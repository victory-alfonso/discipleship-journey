<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Check your Disciples Journey registration status and view your attendance QR code once approved." />
<meta name="theme-color" content="#23211D" />
<title>My Status — Disciples Journey</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #F6F1E4; font-family: system-ui, sans-serif; color: #2A2620; }

  .wrap { max-width: 480px; margin: 0 auto; padding: 22px 18px 60px; }
  .header { background: #23211D; color: #EFE7D3; padding: 18px 20px; text-align: center; }
  .headerTitle { font-family: Georgia, serif; font-size: 19px; font-weight: 700; }
  .headerSub { font-size: 12.5px; color: #C9BF9E; margin-top: 2px; }

  .msgScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center; padding: 20px; color: #7A6E4E; }
  .msgScreen .big { font-family: Georgia, serif; font-size: 22px; color: #23211D; margin-bottom: 8px; }
  .msgScreen .sub { font-size: 14px; color: #5C5230; max-width: 340px; line-height: 1.6; }
  .checkCircle { width: 56px; height: 56px; border-radius: 50%; background: #385026; color: #EFE7D3; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 14px; }

  .pendingDot { width: 14px; height: 14px; border-radius: 50%; background: #E5A430; margin-bottom: 14px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

  .qrCard { background: #FFFFFF; border: 1px solid #E4DCC6; border-radius: 12px; padding: 20px; margin-top: 6px; box-shadow: 0 8px 20px -14px rgba(35,33,29,0.3); }
  .noteBox { background: #FBF8F0; border: 1px solid #EFE7D3; color: #6B5E3E; padding: 12px 14px; border-radius: 10px; font-size: 12.5px; margin-top: 16px; text-align: left; max-width: 340px; }
  .retryBtn { margin-top: 18px; padding: 10px 18px; border-radius: 8px; border: 1px solid #D8CFB0; background: #FFFFFF; color: #4A4230; cursor: pointer; font-size: 13.5px; font-weight: 600; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="header">
  <div class="headerTitle">Disciples Journey</div>
  <div class="headerSub">My Registration Status</div>
</div>
<div class="wrap" id="app" aria-live="polite">
  <div class="msgScreen">Loading…</div>
</div>

<script>
// ---- PASTE YOUR FIREBASE CONFIG HERE (same as index.html / register.html) ----
const firebaseConfig = {
  apiKey: "AIzaSyD-cz-NFG35omoPBN4cG1gM-w8kLjS8G8s",
  authDomain: "discipleship-journey-cc60b.firebaseapp.com",
  projectId: "discipleship-journey-cc60b",
  storageBucket: "discipleship-journey-cc60b.firebasestorage.app",
  messagingSenderId: "942058852250",
  appId: "1:942058852250:web:7ae5092a3efbe146283423",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const app = document.getElementById("app");

function qs(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

// Same scheme index.html's admin scanner expects — keep in sync with
// memberQrText() there.
function memberQrText(memberId) {
  return `DJMEMBER:${memberId}`;
}

// Looks up the class name(s) for a registration's classIds so every
// screen on this page can say which class it's actually about —
// someone may have registered for more than one class and forgotten
// which link is which. Cached by classIds since they don't change
// after a registration is created, so a live update doesn't refetch
// on every snapshot.
let classNameCache = { key: null, names: [] };
async function classNamesFor(ids) {
  const list = (ids || []).slice(0, 10);
  if (!list.length) return [];
  const key = list.join(",");
  if (key === classNameCache.key) return classNameCache.names;
  const snap = await db.collection("classes").where(firebase.firestore.FieldPath.documentId(), "in", list).get();
  const names = snap.docs.map((d) => (d.data() || {}).name).filter(Boolean);
  classNameCache = { key, names };
  return names;
}

function ensureSignedIn() {
  return new Promise((resolve) => {
    if (auth.currentUser) { resolve(auth.currentUser); return; }
    auth.signInAnonymously().then(resolve).catch(() => resolve(null));
  });
}

function renderMissing() {
  app.innerHTML = `
    <div class="msgScreen">
      <div class="big">Link not found</div>
      <div class="sub">This status link isn't valid, or the registration it points to no longer exists. Please check the link, or ask your class leader for help.</div>
    </div>
  `;
}

function renderError(message, onRetry) {
  app.innerHTML = `
    <div class="msgScreen">
      <div class="big">Something went wrong</div>
      <div class="sub">${esc(message)}</div>
      ${onRetry ? `<button class="retryBtn" id="retryBtn">Try Again</button>` : ""}
    </div>
  `;
  if (onRetry) document.getElementById("retryBtn").onclick = onRetry;
}

function renderPending(data, className) {
  const forClass = className ? ` for <strong>${esc(className)}</strong>` : "";
  app.innerHTML = `
    <div class="msgScreen">
      <div class="pendingDot"></div>
      <div class="big">Still under review</div>
      <div class="sub">Hi ${esc(data.name || "there")}! A class leader hasn't approved your registration${forClass} yet. This page updates on its own as soon as they do — no need to refresh or check back manually.</div>
    </div>
  `;
}

function renderRejected(data, className) {
  app.innerHTML = `
    <div class="msgScreen">
      <div class="big">Not approved</div>
      <div class="sub">Your registration for ${esc(className || "this class")} wasn't approved. Please check with your class leader for details.</div>
    </div>
  `;
}

let qrObj = null;
function renderApproved(data, className) {
  const forClass = className ? ` for <strong>${esc(className)}</strong>` : "";
  app.innerHTML = `
    <div class="msgScreen" style="min-height: auto; padding-top: 36px;">
      <div class="checkCircle">✓</div>
      <div class="big">You're all set!</div>
      <div class="sub">This is your personal attendance QR code${forClass}. Show it to your class leader at the start of each session.</div>
      <div class="qrCard" style="margin-top: 16px;">
        <div id="qrBox" style="display: inline-block;"></div>
        <div style="margin-top: 10px; font-weight: 700; color: #23211D;">${esc(data.name || "")}</div>
      </div>
      <div class="noteBox">Bookmark or screenshot this page — you can come back to this same link any time to see your QR code again.</div>
    </div>
  `;
  const box = document.getElementById("qrBox");
  box.innerHTML = "";
  qrObj = new QRCode(box, {
    text: memberQrText(data.memberId),
    width: 220,
    height: 220,
    correctLevel: QRCode.CorrectLevel.M,
  });
}

let currentUnsub = null;
let autoRetried = false;

function subscribeToStatus(regId) {
  if (currentUnsub) { currentUnsub(); currentUnsub = null; }
  currentUnsub = db.collection("pendingRegistrations").doc(regId).onSnapshot(
    async (doc) => {
      autoRetried = false; // a good read means we're past any earlier hiccup
      if (!doc.exists) { renderMissing(); return; }
      const data = doc.data();
      let className = null;
      try {
        const names = await classNamesFor(data.classIds);
        if (names.length) className = names.join(", ");
      } catch (err) {
        // Couldn't resolve the class name (e.g. rules don't allow it
        // for an anonymous reader) — the status screens all fall back
        // to generic copy when className is null, so this is safe to
        // ignore rather than block the whole page on it.
      }
      if (data.status === "approved" && data.memberId) {
        renderApproved(data, className);
      } else if (data.status === "rejected") {
        renderRejected(data, className);
      } else {
        renderPending(data, className);
      }
    },
    (err) => {
      // The same brief window right after a fresh anonymous sign-in
      // that can make index.html's listeners fail once (see its
      // useCollection comment) can hit this page too — retry once
      // automatically before bothering the person with an error.
      if (!autoRetried) {
        autoRetried = true;
        setTimeout(() => subscribeToStatus(regId), 1500);
        return;
      }
      renderError(
        err && err.message ? err.message : "Couldn't load your status. Please check your connection and try again.",
        () => { autoRetried = false; subscribeToStatus(regId); }
      );
    }
  );
}

async function init() {
  const regId = qs("regId");
  if (!regId) { renderMissing(); return; }

  try {
    await ensureSignedIn();
  } catch (err) {
    // fall through — the snapshot listener below will surface a
    // permissions error if anonymous access truly isn't allowed
  }

  // A live listener (not a one-time get) is what makes this page
  // "automatic": the moment a leader approves or rejects the
  // registration in index.html, this page updates on its own.
  subscribeToStatus(regId);
}

init();
</script>
</body>
</html>
