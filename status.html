<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Check your Disciples Journey registration status and view your attendance QR code once approved." />
<meta name="theme-color" content="#23211D" />
<title>My Status — Disciples Journey</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #F6F1E4; font-family: system-ui, sans-serif; color: #2A2620; }

  .wrap { max-width: 480px; margin: 0 auto; padding: 22px 18px 60px; }
  .header { background: #23211D; color: #EFE7D3; padding: 18px 20px; text-align: center; }
  .headerTitle { font-family: Georgia, serif; font-size: 19px; font-weight: 700; }
  .headerSub { font-size: 12.5px; color: #C9BF9E; margin-top: 2px; }

  .msgScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center; padding: 20px; color: #7A6E4E; }
  .msgScreen .big { font-family: Georgia, serif; font-size: 22px; color: #23211D; margin-bottom: 8px; }
  .msgScreen .sub { font-size: 14px; color: #5C5230; max-width: 340px; line-height: 1.6; }
  .checkCircle { width: 56px; height: 56px; border-radius: 50%; background: #385026; color: #EFE7D3; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 14px; }

  .pendingDot { width: 14px; height: 14px; border-radius: 50%; background: #E5A430; margin-bottom: 14px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } }

  .qrCard { background: #FFFFFF; border: 1px solid #E4DCC6; border-radius: 12px; padding: 20px; margin-top: 6px; box-shadow: 0 8px 20px -14px rgba(35,33,29,0.3); }
  .noteBox { background: #FBF8F0; border: 1px solid #EFE7D3; color: #6B5E3E; padding: 12px 14px; border-radius: 10px; font-size: 12.5px; margin-top: 16px; text-align: left; max-width: 340px; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="header">
  <div class="headerTitle">Disciples Journey</div>
  <div class="headerSub">My Registration Status</div>
</div>
<div class="wrap" id="app">
  <div class="msgScreen">Loading…</div>
</div>

<script>
// ---- PASTE YOUR FIREBASE CONFIG HERE (same as index.html / register.html) ----
const firebaseConfig = {
  apiKey: "AIzaSyD-cz-NFG35omoPBN4cG1gM-w8kLjS8G8s",
  authDomain: "discipleship-journey-cc60b.firebaseapp.com",
  projectId: "discipleship-journey-cc60b",
  storageBucket: "discipleship-journey-cc60b.firebasestorage.app",
  messagingSenderId: "942058852250",
  appId: "1:942058852250:web:7ae5092a3efbe146283423",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const app = document.getElementById("app");

function qs(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

// Same scheme index.html's admin scanner expects — keep in sync with
// memberQrText() there.
function memberQrText(memberId) {
  return `DJMEMBER:${memberId}`;
}

function ensureSignedIn() {
  return new Promise((resolve) => {
    if (auth.currentUser) { resolve(auth.currentUser); return; }
    auth.signInAnonymously().then(resolve).catch(() => resolve(null));
  });
}

function renderMissing() {
  app.innerHTML = `
    <div class="msgScreen">
      <div class="big">Link not found</div>
      <div class="sub">This status link isn't valid, or the registration it points to no longer exists. Please check the link, or ask your class leader for help.</div>
    </div>
  `;
}

function renderError(message) {
  app.innerHTML = `
    <div class="msgScreen">
      <div class="big">Something went wrong</div>
      <div class="sub">${esc(message)}</div>
    </div>
  `;
}

function renderPending(data) {
  app.innerHTML = `
    <div class="msgScreen">
      <div class="pendingDot"></div>
      <div class="big">Still under review</div>
      <div class="sub">Hi ${esc(data.name || "there")}! A class leader hasn't approved your registration yet. This page updates on its own as soon as they do — no need to refresh or check back manually.</div>
    </div>
  `;
}

function renderRejected(data) {
  app.innerHTML = `
    <div class="msgScreen">
      <div class="big">Not approved</div>
      <div class="sub">Your registration for ${esc(data.name || "this class")} wasn't approved. Please check with your class leader for details.</div>
    </div>
  `;
}

let qrObj = null;
function renderApproved(data) {
  app.innerHTML = `
    <div class="msgScreen" style="min-height: auto; padding-top: 36px;">
      <div class="checkCircle">✓</div>
      <div class="big">You're all set!</div>
      <div class="sub">This is your personal attendance QR code. Show it to your class leader at the start of each session.</div>
      <div class="qrCard" style="margin-top: 16px;">
        <div id="qrBox" style="display: inline-block;"></div>
        <div style="margin-top: 10px; font-weight: 700; color: #23211D;">${esc(data.name || "")}</div>
      </div>
      <div class="noteBox">Bookmark or screenshot this page — you can come back to this same link any time to see your QR code again.</div>
    </div>
  `;
  const box = document.getElementById("qrBox");
  box.innerHTML = "";
  qrObj = new QRCode(box, {
    text: memberQrText(data.memberId),
    width: 220,
    height: 220,
    correctLevel: QRCode.CorrectLevel.M,
  });
}

async function init() {
  const regId = qs("regId");
  if (!regId) { renderMissing(); return; }

  try {
    await ensureSignedIn();
  } catch (err) {
    // fall through — the snapshot listener below will surface a
    // permissions error if anonymous access truly isn't allowed
  }

  // A live listener (not a one-time get) is what makes this page
  // "automatic": the moment a leader approves or rejects the
  // registration in index.html, this page updates on its own.
  db.collection("pendingRegistrations").doc(regId).onSnapshot(
    (doc) => {
      if (!doc.exists) { renderMissing(); return; }
      const data = doc.data();
      if (data.status === "approved" && data.memberId) {
        renderApproved(data);
      } else if (data.status === "rejected") {
        renderRejected(data);
      } else {
        renderPending(data);
      }
    },
    (err) => {
      renderError(err && err.message ? err.message : "Couldn't load your status. Please check your connection and try again.");
    }
  );
}

init();
</script>
</body>
</html>
