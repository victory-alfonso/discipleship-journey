<style>
  /* Baseline header-height fallback, used the instant the page paints —
     before the JS measurement effect below has a chance to run — so a
     modal opened very early (or in a browser where the effect somehow
     fails) still can't start on top of the header. The JS effect
     (headerBarRef, see the App component) overwrites this with the
     exact measured pixel height via an inline style on <html>, and an
     inline style always wins over a stylesheet rule, so this is purely
     a safety net and never fights the precise JS value once it lands.
     Kept in sync with the header's real height at the >640px and
     <=640px breakpoints used below. */
  :root { --dj-header-h: 180px; }
  @media (max-width: 640px) { :root { --dj-header-h: 150px; } }
  * { box-sizing: border-box; }
  html { overflow-x: hidden; max-width: 100%; }
  body { margin: 0; overflow-x: clip; max-width: 100%; color: #23211D; background-color: #F5F2E4; background-image: radial-gradient(circle at 12% 12%, rgba(229,164,48,0.14), transparent 42%), radial-gradient(circle at 88% 8%, rgba(31,56,100,0.1), transparent 45%), radial-gradient(circle at 15% 85%, rgba(56,80,38,0.08), transparent 45%), radial-gradient(circle at 90% 88%, rgba(31,56,100,0.08), transparent 48%), linear-gradient(160deg, #F5F2E4 0%, #EFE7D3 45%, #F0EAD8 100%); background-attachment: fixed; }
  input, button, select, textarea, a { touch-action: manipulation; }
  input:focus, textarea:focus, select:focus { border-color: #1F3864 !important; box-shadow: 0 0 0 3px rgba(31,56,100,0.15) !important; }

  /* Fast, repeated taps on plain/blank areas of the screen were being
     picked up by the browser as an attempt to select text (especially
     on mobile Safari/Chrome), which pops a native text-selection
     overlay + selection handles on top of the app. Once that overlay
     grabs the touch events, taps stop reaching the React app at all,
     which reads as the whole page freezing/lagging. Disabling text
     selection and the iOS long-press callout globally (and explicitly
     re-enabling it only where people actually need to select/type
     text) fixes this without affecting normal use. */
  * { -webkit-touch-callout: none; }
  html, body { -webkit-user-select: none; user-select: none; }
  input, textarea, [contenteditable="true"] {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(31,56,100,0.3); border-radius: 8px; }

  @keyframes popIn { from { opacity: 0; transform: translateY(-6px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes djRingWedgeIn { from { opacity: 0; transform: scale(0.3) rotate(-8deg); } to { opacity: 1; transform: scale(1) rotate(0deg); } }
  @keyframes djRingCenterIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
  .dj-ring-wedge { transform-box: view-box; animation: djRingWedgeIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .dj-ring-center { animation: djRingCenterIn 0.35s ease-out both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes djToastIn {
    0% { opacity: 0; transform: translate(-50%, calc(-50% - 10px)) scale(0.85); }
    60% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes djToastOut {
    from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    to { opacity: 0; transform: translate(-50%, calc(-50% - 8px)) scale(0.94); }
  }
  @keyframes djCheckPop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .dj-ios-toast { animation: djToastIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .dj-ios-toast.dj-toast-leaving { animation: djToastOut 0.22s ease-in both; }
  .dj-ios-toast .dj-toast-check { animation: djCheckPop 0.4s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both; }

  /* Global notice toasts (replace native showError()) */
  @keyframes djNoticeIn {
    0% { opacity: 0; transform: translateY(-14px) scale(0.92); }
    60% { opacity: 1; transform: translateY(2px) scale(1.02); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes djNoticeOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to { opacity: 0; transform: translateY(-10px) scale(0.95); }
  }
  .dj-notice { animation: djNoticeIn 0.32s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  .dj-notice.dj-notice-leaving { animation: djNoticeOut 0.22s ease-in both; }
  .dj-notice .dj-notice-icon { animation: djCheckPop 0.4s 0.1s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
  @media (prefers-reduced-motion: reduce) {
    .dj-notice, .dj-notice.dj-notice-leaving, .dj-notice .dj-notice-icon { animation-duration: 0.01s; }
  }

  /* Login → app transition — once sign-in succeeds and the main app
     replaces the auth screen, the app content eases in (fade + gentle
     rise) instead of just popping into view. */
  @keyframes djAppEnter {
    0%   { opacity: 0; transform: translateY(14px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .dj-app-enter { animation: djAppEnter 0.55s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
  @media (prefers-reduced-motion: reduce) {
    .dj-app-enter { animation-duration: 0.01s; }
  }

  /* Tab switch transition — a clean crossfade: the new panel fades in
     (the old one is already gone from the DOM by the time this runs,
     since React swaps them in one commit, so this reads as an
     old-fades-out/new-fades-in crossfade without any flash or jump).
     Keyed on the tab name in React so it re-triggers on every switch. */
  @keyframes djTabEnter {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }
  .dj-tab-enter { animation: djTabEnter 0.22s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    .dj-tab-enter { animation-duration: 0.01s; }
  }

  /* App-open splash — Victory logo gently scales/fades in on a dark
     backdrop, holds briefly, then the whole overlay fades out to
     reveal the app underneath. See <SplashScreen />. */
  @keyframes djSplashLogoIn {
    0%   { opacity: 0; transform: scale(0.82); }
    60%  { opacity: 1; transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes djSplashOverlayOut {
    0%   { opacity: 1; }
    100% { opacity: 0; }
  }
  .dj-splash-logo { animation: djSplashLogoIn 0.9s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
  .dj-splash-overlay.dj-splash-leaving { animation: djSplashOverlayOut 0.7s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    .dj-splash-logo { animation-duration: 0.01s; }
    .dj-splash-overlay.dj-splash-leaving { animation-duration: 0.01s; }
  }

  /* Logo spark — tapping a genuinely plain/blank part of the screen
     (not any card, row, section, or anything with writing/details in
     it — see djIsTouchableTarget) pops a small Victory logo icon at
     the tap point: quick pop-in, then it stays put and vibrates
     (building up, silently) until it releases its charge — a bright
     shine flash plus a burst of small gold sparkles flying outward
     (like a wand letting off its stored-up power), with a soft
     bubble-pop sound. The icon itself never breaks apart, and it
     never fires while a modal/dialog is open. See djGenerateSparkles
     / djPlayExplosion. */
  @keyframes djLogoSpark {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(0deg); }
    14%  { opacity: 1; transform: translate(-50%, -50%) scale(1.18) rotate(0deg); }
    22%  { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    28%  { transform: translate(-50%, -50%) scale(1) rotate(-3deg); }
    34%  { transform: translate(-50%, -50%) scale(1) rotate(3deg); }
    40%  { transform: translate(-50%, -50%) scale(1.02) rotate(-3deg); }
    46%  { transform: translate(-50%, -50%) scale(1.02) rotate(3deg); }
    52%  { transform: translate(-50%, -50%) scale(1.04) rotate(-4deg); }
    58%  { transform: translate(-50%, -50%) scale(1.04) rotate(4deg); }
    64%  { transform: translate(-50%, -50%) scale(1.06) rotate(-5deg); }
    70%  { transform: translate(-50%, -50%) scale(1.06) rotate(5deg); }
    76%  { transform: translate(-50%, -50%) scale(1.1) rotate(-6deg); }
    82%  { transform: translate(-50%, -50%) scale(1.1) rotate(6deg); }
    85%  { opacity: 1; transform: translate(-50%, -50%) scale(1.35) rotate(0deg); }
    86%  { opacity: 0; transform: translate(-50%, -50%) scale(1.7) rotate(0deg); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.7) rotate(0deg); }
  }
  .dj-logo-spark { animation: djLogoSpark 1.4s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
  @media (prefers-reduced-motion: reduce) {
    .dj-logo-spark { animation-duration: 0.01s; }
  }

  /* A bright, shiny flash right at the release point — like a wand
     letting its stored power go — so the burst reads clearly even
     before the eye picks out the flying sparkles. */
  @keyframes djPopFlash {
    0%   { opacity: 0.9; transform: translate(-50%, -50%) scale(0.15); }
    55%  { opacity: 0.6; }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(2.6); }
  }
  .dj-pop-flash { animation: djPopFlash 0.4s ease-out both; }
  @media (prefers-reduced-motion: reduce) {
    .dj-pop-flash { display: none; }
  }

  /* Small gold sparkle glints that shoot outward from the icon and
     tumble as they fade — a shine/release effect, not a break. The
     icon itself stays whole; only the sparkle dust flies off it. */
  @keyframes djSparkleFly {
    0%   { opacity: 0; transform: translate(-50%, -50%) translate(0, 0) rotate(0deg) scale(0.2); }
    22%  { opacity: 1; transform: translate(-50%, -50%) translate(calc(var(--bx) * 0.2), calc(var(--by) * 0.2)) rotate(calc(var(--br) * 0.3)) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%, -50%) translate(var(--bx), var(--by)) rotate(var(--br)) scale(0.2); }
  }
  .dj-sparkle { animation: djSparkleFly 0.6s cubic-bezier(0.15, 0.7, 0.4, 1) both; }
  @media (prefers-reduced-motion: reduce) {
    .dj-sparkle { display: none; }
  }

  .authInput:focus { border-color: #1F3864; box-shadow: 0 0 0 3px rgba(31,56,100,0.15); }
  .authTabBtn:hover { color: #1F3864 !important; }
  .authPwToggle:hover { color: #4A4230 !important; }

  * { -webkit-tap-highlight-color: transparent; }
  .nav-item:hover { background: rgba(31,56,100,0.1) !important; }
  .card-row:hover { background: rgba(31,56,100,0.05) !important; }
  .card-row:active { background: rgba(31,56,100,0.08) !important; }
  .milestone-row:active { background: rgba(31,56,100,0.06); }

  .dj-class-photo-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .dj-class-photo-card:hover { transform: translateY(-2px); }
  .dj-class-photo-card:active { transform: scale(0.985); }
  .dj-detail-row:hover { background: rgba(255,255,255,0.15) !important; }

  /* Nav tabs: scroll horizontally within their own bar instead of
     pushing the whole page wider than the viewport (which was
     causing the entire header/table/content to shift and clip on
     narrow phones). Harmless on desktop since items fit and no
     scrolling is needed there. */
  .dj-nav { overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; max-width: 100%; }
  .dj-nav::-webkit-scrollbar { display: none; }
  .dj-nav .nav-item { flex-shrink: 0; }
  .dj-nav-pill { pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    .dj-nav-pill { transition-duration: 0.01s !important; }
  }

  @media (max-width: 480px) {
    .dj-classes-grid { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
  }
  @media (max-width: 640px) {
    .hide-mobile { display: none !important; }
    .stack-mobile {
      flex-direction: row !important;
      flex-wrap: wrap !important;
      align-items: center !important;
      gap: 6px !important;
      margin-bottom: 8px !important;
    }
    /* Compact the search box, dropdowns and buttons that live inside
       toolbar rows so several of them fit per line instead of each
       one stacking full-width and eating vertical space. */
    .stack-mobile input[type="text"],
    .stack-mobile input:not([type]),
    .stack-mobile > input {
      flex: 1 1 100% !important;
      padding: 6px 10px !important;
      font-size: 12.5px !important;
      min-width: 0 !important;
    }
    .stack-mobile button {
      flex: 0 0 auto !important;
      padding: 5px 8px !important;
      font-size: 11px !important;
      min-width: 0 !important;
      white-space: nowrap !important;
      border-radius: 6px !important;
    }
    /* Button group (Print QR / Export / Import / Add Member) and the
       leader-name row: keep to a single scrollable row instead of
       wrapping onto a second line. */
    .stack-mobile > div {
      flex: 1 1 100% !important;
      gap: 6px !important;
      flex-wrap: nowrap !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch !important;
      scrollbar-width: none !important;
    }
    .stack-mobile > div::-webkit-scrollbar { display: none !important; }
    /* Filter row (Gender / Life stage / Membership / Min age / Max age):
       one scrollable row instead of a 2-column grid. */
    .filter-grid-mobile {
      display: flex !important;
      flex-wrap: nowrap !important;
      overflow-x: auto !important;
      -webkit-overflow-scrolling: touch !important;
      scrollbar-width: none !important;
      gap: 8px !important;
    }
    .filter-grid-mobile::-webkit-scrollbar { display: none !important; }
    .filter-grid-mobile > * { flex: 0 0 auto !important; width: auto !important; min-width: auto !important; margin: 0 !important; padding: 5px 8px !important; font-size: 11px !important; }
    .filter-grid-mobile input[type="number"] { width: 62px !important; }
    .dj-modal-body { flex-direction: column !important; align-items: center !important; }
    .dj-modal-ring-col { width: 100% !important; }
    .dj-modal-list { max-height: 46vh !important; }
    /* Class detail modal: the wide two-column layout (cover/batch/
       progress on the left, sessions/members on the right) doesn't fit
       a phone screen, so stack it back into one scrollable column. */
    .dj-classdetail-body { flex-direction: column !important; overflow-y: auto !important; }
    .dj-classdetail-left { width: 100% !important; overflow-y: visible !important; flex-shrink: 1 !important; }
    .dj-classdetail-right { border-left: none !important; border-top: 1px solid rgba(255,255,255,0.12) !important; overflow-y: visible !important; }

    /* Header: tighten up title + let the sign-out row keep its own
       line without crowding the title (headerUser is already
       hidden on mobile via .hide-mobile). */
    .dj-header { padding: 12px 14px !important; gap: 8px !important; }
    .dj-header-logo { width: 26px !important; height: 26px !important; }
    .dj-header-line1 { font-size: 10.5px !important; letter-spacing: 0.4px !important; }
    .dj-header-line2 { font-size: 13px !important; letter-spacing: 0.3px !important; }
    .dj-sign-out { padding: 6px 10px !important; font-size: 12px !important; }
    .dj-nav { padding: 8px 10px !important; gap: 4px !important; }
    .dj-nav .nav-item { padding: 8px 12px !important; font-size: 12.5px !important; }
    .dj-main { padding: 16px 12px 40px !important; }
  }

  @media print {
    body * { visibility: hidden; }
    .qr-print-area, .qr-print-area * { visibility: visible; }
    .qr-print-area { position: absolute; top: 0; left: 0; width: 100%; }
    .no-print { display: none !important; }
  }

  body.dj-scanning .dj-watermark { display: none !important; }
</style>

function normEmail(e) { return (e || "").trim().toLowerCase(); }
function isValidEmail(e) { return /^[^\s@()]+@[^\s@()]+\.[^\s@()]+$/.test(normEmail(e)); }
// Small local ID generator for items that live inside an array field on
// a Firestore doc (e.g. a ONE2ONE person's sessions), where each entry
// needs its own stable id but doesn't warrant its own subcollection.
function genLocalId() { return `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`; }

// ============================================================
// CONFIRM DIALOG — replaces native confirm(). Usage:
//   if (await askConfirm({ title, message, confirmLabel, danger })) { ... }
// <ConfirmHost /> is mounted once at the root.
// ============================================================
let confirmListener = null;
function askConfirm(opts) {
  return new Promise((resolve) => {
    if (!confirmListener) { resolve(false); return; }
    confirmListener({ ...opts, resolve });
  });
}

function ConfirmHost() {
  const [req, setReq] = useState(null);

  useEffect(() => {
    confirmListener = (r) => setReq(r);
    return () => { confirmListener = null; };
  }, []);

  const close = (result) => {
    if (req) req.resolve(result);
    setReq(null);
  };

  useEffect(() => {
    if (!req) return;
    const onKey = (e) => { if (e.key === "Escape") close(false); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [req]);

  if (!req) return null;
  return (
    <div style={{ ...styles.modalOverlay, zIndex: 10001 }} onClick={() => close(false)}>
      <div
        role="alertdialog"
        aria-modal="true"
        style={{ ...styles.modalCard, maxWidth: 360 }}
        onClick={(e) => e.stopPropagation()}
      >
        <div style={styles.modalTitle}>{req.title || "Are you sure?"}</div>
        {req.message && (
          <div style={{ fontSize: 14, color: "#4A4230", lineHeight: 1.5, marginBottom: 16 }}>{req.message}</div>
        )}
        <div style={styles.modalActions}>
          <button style={styles.modalCancelBtn} onClick={() => close(false)} autoFocus>Cancel</button>
          <button
            style={{ ...styles.modalConfirmBtn, ...(req.danger ? { background: "rgba(166,64,47,0.95)" } : {}) }}
            onClick={() => close(true)}
          >
            {req.confirmLabel || "Confirm"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// SESSION PICKER — replaces a plain confirm() when a leader
// downgrades a member away from "Completed" in Edit Member.
// Lets them check off exactly which sessions actually happened
// instead of leaving every session marked attended under a
// status that now says otherwise. Usage:
//   const result = await askSessionPicker({ title, message, sessions, initialChecked });
//   if (result) { ...result is { [topicId]: boolean }... }
// <SessionPickerHost /> is mounted once at the root.
// ============================================================
let sessionPickerListener = null;
function askSessionPicker(opts) {
  return new Promise((resolve) => {
    if (!sessionPickerListener) { resolve(null); return; }
    sessionPickerListener({ ...opts, resolve });
  });
}

function SessionPickerHost() {
  const [req, setReq] = useState(null);
  const [checked, setChecked] = useState({});

  useEffect(() => {
    sessionPickerListener = (r) => { setReq(r); setChecked(r.initialChecked || {}); };
    return () => { sessionPickerListener = null; };
  }, []);

  const close = (result) => {
    if (req) req.resolve(result);
    setReq(null);
  };

  useEffect(() => {
    if (!req) return;
    const onKey = (e) => { if (e.key === "Escape") close(null); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [req]);

  if (!req) return null;
  const sessions = req.sessions || [];
  const toggle = (id) => setChecked((prev) => ({ ...prev, [id]: !prev[id] }));
  const allChecked = sessions.length > 0 && sessions.every((t) => checked[t.id]);
  const setAll = (value) => setChecked(() => {
    const next = {};
    sessions.forEach((t) => { next[t.id] = value; });
    return next;
  });
  return (
    <div style={{ ...styles.modalOverlay, zIndex: 10001 }} onClick={() => close(null)}>
      <div role="dialog" aria-modal="true" style={{ ...styles.modalCard, maxWidth: 420 }} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalTitle}>{req.title || "Update sessions"}</div>
        {req.message && (
          <div style={{ fontSize: 13.5, color: "#4A4230", lineHeight: 1.5, marginBottom: 14 }}>{req.message}</div>
        )}
        {sessions.length > 0 && (
          <button
            type="button"
            onClick={() => setAll(!allChecked)}
            style={{ alignSelf: "flex-start", marginBottom: 8, background: "none", border: "none", color: "#1F3864", fontSize: 12.5, fontWeight: 700, cursor: "pointer", padding: 0 }}
          >
            {allChecked ? "Uncheck all" : "Check all"}
          </button>
        )}
        <div style={{ display: "flex", flexDirection: "column", gap: 2, maxHeight: "44vh", overflowY: "auto", marginBottom: 8, border: "1px solid rgba(216,207,176,0.5)", borderRadius: 10, padding: "4px 8px" }}>
          {sessions.length === 0 ? (
            <div style={{ fontSize: 13, color: "#7A6E4E", fontStyle: "italic", padding: "8px 4px" }}>This class has no sessions yet.</div>
          ) : sessions.map((t) => (
            <label key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "7px 4px", cursor: "pointer" }}>
              <input type="checkbox" checked={!!checked[t.id]} onChange={() => toggle(t.id)} />
              <span style={{ fontSize: 13.5, color: "#23211D", fontWeight: 600 }}>{t.name}</span>
            </label>
          ))}
        </div>
        <div style={styles.modalActions}>
          <button style={styles.modalCancelBtn} onClick={() => close(null)}>Cancel</button>
          <button style={styles.modalConfirmBtn} onClick={() => close(checked)}>Save</button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// NOTICES (toast) — replaces native showError() so errors don't
// block the UI. Call showError("...") / showNotice("...") from
// anywhere; <ToastHost /> (mounted once at the root) renders them.
// ============================================================
const noticeListeners = new Set();
let noticeSeq = 0;
function pushNotice(type, text) {
  const notice = { id: ++noticeSeq, type, text: String(text || "") };
  noticeListeners.forEach((fn) => fn(notice));
}
function showError(text) { pushNotice("error", text); }
function showNotice(text) { pushNotice("success", text); }

function ToastHost() {
  const [items, setItems] = useState([]); // { id, type, text, leaving }
  const timersRef = useRef({});

  const dismiss = useCallback((id) => {
    setItems((prev) => prev.map((n) => (n.id === id ? { ...n, leaving: true } : n)));
    setTimeout(() => setItems((prev) => prev.filter((n) => n.id !== id)), 220);
    if (timersRef.current[id]) { clearTimeout(timersRef.current[id]); delete timersRef.current[id]; }
  }, []);

  useEffect(() => {
    const onNotice = (notice) => {
      setItems((prev) => {
        // Drop an identical message that's still showing, so repeated
        // failures don't pile up.
        const rest = prev.filter((n) => !(n.text === notice.text && n.type === notice.type));
        return [...rest, notice].slice(-3);
      });
      timersRef.current[notice.id] = setTimeout(
        () => dismiss(notice.id),
        notice.type === "error" ? 6000 : 3000
      );
    };
    noticeListeners.add(onNotice);
    return () => {
      noticeListeners.delete(onNotice);
      Object.values(timersRef.current).forEach(clearTimeout);
      timersRef.current = {};
    };
  }, [dismiss]);

  if (items.length === 0) return null;
  return (
    <div
      style={{
        position: "fixed",
        top: "calc(env(safe-area-inset-top, 0px) + 14px)",
        left: 0,
        right: 0,
        zIndex: 10000,
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        gap: 10,
        padding: "0 14px",
        pointerEvents: "none",
      }}
    >
      {items.map((n) => {
        const isError = n.type === "error";
        // "Could not save the class. Error: xyz" -> title + detail
        const idx = n.text.indexOf(" Error: ");
        const title = idx > -1 ? n.text.slice(0, idx) : n.text;
        const detail = idx > -1 ? n.text.slice(idx + " Error: ".length) : "";
        return (
          <div
            key={n.id}
            role={isError ? "alert" : "status"}
            aria-live={isError ? "assertive" : "polite"}
            className={`dj-notice${n.leaving ? " dj-notice-leaving" : ""}`}
            onClick={() => dismiss(n.id)}
            style={{
              pointerEvents: "auto",
              cursor: "pointer",
              width: "min(100%, 400px)",
              display: "flex",
              alignItems: "center",
              gap: 12,
              padding: "14px 16px",
              borderRadius: 18,
              background: "rgba(28,28,30,0.92)",
              backdropFilter: "blur(14px)",
              WebkitBackdropFilter: "blur(14px)",
              boxShadow: "0 10px 30px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.06) inset",
            }}
          >
            <div
              className="dj-notice-icon"
              style={{
                flex: "0 0 auto",
                width: 34,
                height: 34,
                borderRadius: "50%",
                background: isError ? "#FF453A" : "#34C759",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
              }}
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                {isError ? (
                  <path d="M6 6L18 18M18 6L6 18" stroke="#fff" strokeWidth="3.2" strokeLinecap="round" />
                ) : (
                  <path d="M4 12.5L9.5 18L20 6" stroke="#fff" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round" />
                )}
              </svg>
            </div>
            <div style={{ minWidth: 0, flex: 1 }}>
              <div style={{ color: "#fff", fontSize: 15, fontWeight: 700, lineHeight: 1.3 }}>{title}</div>
              {detail && (
                <div style={{ color: "rgba(255,255,255,0.72)", fontSize: 12.5, fontWeight: 500, lineHeight: 1.35, marginTop: 2, wordBreak: "break-word" }}>
                  {detail}
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ============================================================
// LOGO SPARK — tapping any genuinely plain/blank part of the screen
// (page background, empty whitespace — NOT buttons, links, inputs,
// anything with a pointer cursor, or any card/row/section that has
// writing or details in it) pops up a small Victory logo icon at the
// tap point that pops in, stays put and vibrates silently (building
// up) until it pops like a bubble (with a little burst of bubbles +
// a pop sound). Purely decorative; never blocks a real tap on
// something touchable, and skips entirely while a modal/dialog is
// open.
// <LogoSparkHost /> is mounted once at the root.
// ============================================================

// An element counts as "touchable" (skip the spark) if it, or any
// ancestor up to <body>, is a natural control, carries an
// interactive role, has a pointer cursor, or sits inside a card or
// content container — this app's cards, rows, sections and modals
// all use a translucent "glass" background with a backdrop blur (see
// the *Card/*Row/*Section entries in the stylesheet), so checking for
// that blur is a reliable way to catch "any box with writing/details
// in it" without needing to tag every one of them individually. The
// spark only ever fires on genuinely plain, blank screen background.
function djIsTouchableTarget(el) {
  const interactiveTags = new Set(["BUTTON", "A", "INPUT", "SELECT", "TEXTAREA", "LABEL", "OPTION"]);
  let node = el;
  let hops = 0;
  while (node && node !== document.body && hops < 40) {
    if (node.nodeType === 1) {
      if (interactiveTags.has(node.tagName)) return true;
      const role = node.getAttribute && node.getAttribute("role");
      if (role && ["button", "link", "dialog", "alertdialog", "checkbox", "tab", "menuitem"].includes(role)) return true;
      if (node.isContentEditable) return true;
      const cs = window.getComputedStyle(node);
      if (cs) {
        if (cs.cursor === "pointer") return true;
        const backdrop = cs.backdropFilter || cs.webkitBackdropFilter;
        if (backdrop && backdrop !== "none") return true;
      }
    }
    node = node.parentElement;
    hops++;
  }
  return false;
}

// Duration of the whole logo-spark lifecycle, and the moment (as a
// fraction of it) when the vibration build-up peaks and the icon
// releases its charge (matches the djLogoSpark keyframes' 85%/86%
// pop). The pop sound/shine burst is scheduled off this same
// fraction so audio and visuals stay in sync, at the same spot the
// icon appeared (it doesn't move).
const DJ_SPARK_DURATION_MS = 1400;
const DJ_SPARK_POP_FRACTION = 0.86;
// Size of the logo-spark icon (px).
const DJ_ICON_SIZE = 28;

// Lazily-created, reused AudioContext for the sound effects so we
// don't spin up a new one on every tap (and so it only ever starts
// from within a real user gesture, satisfying autoplay policies).
let djAudioCtx = null;
function djGetAudioCtx() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!djAudioCtx) djAudioCtx = new Ctx();
  if (djAudioCtx.state === "suspended") djAudioCtx.resume();
  return djAudioCtx;
}

// A little cluster of soft "bubble pop" plinks — several quick sine
// chirps, each rising fast in pitch with a snappy percussive decay,
// staggered by a few milliseconds and randomized slightly in pitch
// and timing so it reads as a small burst of bubbles popping rather
// than one single sound. No audio file needed, so it all stays
// inline in this one index.html.
function djPlayExplosion() {
  try {
    const ctx = djGetAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const popCount = 4 + Math.floor(Math.random() * 3); // 4-6 little pops
    for (let i = 0; i < popCount; i++) {
      const t0 = now + i * (0.03 + Math.random() * 0.018);
      const startFreq = 550 + Math.random() * 300;
      const endFreq = startFreq * (1.7 + Math.random() * 0.6);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(startFreq, t0);
      osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + 0.05);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.13, t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.09);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + 0.12);
    }
  } catch (err) {
    // Audio is purely decorative — never let it break the tap effect.
  }
}

// Generates a small burst of gold sparkle glints flying outward from
// the pop point in a rough circle, each with its own distance,
// tumble and size — so it reads as a shiny release of magic dust
// (like a wand letting off power), not the icon breaking apart.
function djGenerateSparkles(groupId, popX, popY) {
  const count = 8 + Math.floor(Math.random() * 5); // 8-12 sparkles
  const sparkles = [];
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.7;
    const dist = 24 + Math.random() * 34;
    const bx = Math.cos(angle) * dist;
    const by = Math.sin(angle) * dist - 6; // slight upward bias
    const br = (Math.random() - 0.5) * 240; // tumble, degrees
    const size = 6 + Math.random() * 8;
    sparkles.push({
      id: `${groupId}-s${i}`,
      groupId,
      x: popX,
      y: popY,
      bx,
      by,
      br,
      size,
      warm: Math.random() < 0.6, // mix of warm-gold and bright-white glints
    });
  }
  return sparkles;
}

// SPLASH SCREEN — shown once, right when the app first opens, over
// everything else (including the auth/loading screen underneath it).
// The Victory logo scales/fades in, holds for a moment, then the
// whole dark overlay fades out to reveal whatever screen is actually
// ready underneath. Purely cosmetic — it never blocks or delays app
// logic, it just sits on top of it for a beat.
const SPLASH_HOLD_MS = 900;   // how long the logo stays fully visible
const SPLASH_FADE_MS = 700;   // overlay fade-out duration (must match djSplashOverlayOut)
function SplashScreen() {
  const [leaving, setLeaving] = useState(false);
  const [done, setDone] = useState(false);
  useEffect(() => {
    const leaveTimer = setTimeout(() => setLeaving(true), SPLASH_HOLD_MS);
    const doneTimer = setTimeout(() => setDone(true), SPLASH_HOLD_MS + SPLASH_FADE_MS);
    return () => { clearTimeout(leaveTimer); clearTimeout(doneTimer); };
  }, []);
  if (done) return null;
  return (
    <div className={`dj-splash-overlay${leaving ? " dj-splash-leaving" : ""}`} style={splashStyles.overlay}>
      <img src={VICTORY_LOGO_DATA_URI} alt="Victory Alfonso" className="dj-splash-logo" style={splashStyles.logo} />
    </div>
  );
}
const splashStyles = {
  overlay: {
    position: "fixed", inset: 0, zIndex: 9999,
    display: "flex", alignItems: "center", justifyContent: "center",
    background: "radial-gradient(circle at 18% 12%, rgba(169,120,47,0.35) 0%, transparent 45%), radial-gradient(circle at 82% 18%, rgba(31,56,100,0.5) 0%, transparent 50%), radial-gradient(circle at 50% 100%, rgba(56,80,38,0.25) 0%, transparent 55%), radial-gradient(circle at 50% 0%, #332F26 0%, #17150F 65%)",
  },
  logo: { width: 96, height: 96, objectFit: "contain", filter: "drop-shadow(0 8px 20px rgba(0,0,0,0.45))" },
};

let logoSparkSeq = 0;
function LogoSparkHost() {
  const [sparks, setSparks] = useState([]); // { id, x, y }
  const [sparkles, setSparkles] = useState([]); // shine glints, { id, groupId, x, y, bx, by, br, size, warm }
  const [flashes, setFlashes] = useState([]); // { id, x, y }
  const lastSparkAtRef = useRef(0);

  useEffect(() => {
    const onPointerDown = (e) => {
      if (e.button !== undefined && e.button !== 0) return; // left click / primary touch only
      // Debounce FIRST, before any expensive DOM work below — rapid
      // tapping on an empty area used to still run the full ancestor
      // walk + getComputedStyle on every single tap (only the actual
      // spark creation was debounced), which could hammer the main
      // thread hard enough to freeze the app on fast repeated taps.
      // Kept short on purpose: low enough that quick, repeated taps
      // each still pop out their own icon right away, but non-zero so
      // a genuine rapid-fire mash (or multi-touch) can't flood the
      // main thread with ancestor walks.
      const now = Date.now();
      if (now - lastSparkAtRef.current < 60) return;
      // Skip while any modal/dialog is open so it never fights with that UI.
      if (document.querySelector('[role="dialog"], [role="alertdialog"]')) return;
      if (djIsTouchableTarget(e.target)) return;
      lastSparkAtRef.current = now;
      const x = e.clientX ?? (e.touches && e.touches[0] && e.touches[0].clientX) ?? window.innerWidth / 2;
      const y = e.clientY ?? (e.touches && e.touches[0] && e.touches[0].clientY) ?? window.innerHeight / 2;
      const id = ++logoSparkSeq;
      setSparks((prev) => [...prev.slice(-5), { id, x, y }]);
      setTimeout(() => {
        setSparks((prev) => prev.filter((s) => s.id !== id));
      }, DJ_SPARK_DURATION_MS);

      const reducedMotion =
        window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Fire the release — shine flash + gold sparkle burst + sound —
      // timed to the moment the vibration build-up peaks and the icon
      // visually pops in the CSS keyframes.
      const popDelay = reducedMotion ? 0 : DJ_SPARK_DURATION_MS * DJ_SPARK_POP_FRACTION;
      setTimeout(() => {
        djPlayExplosion();
        if (reducedMotion) return; // skip the sparkle burst + flash too
        const groupId = id;
        setFlashes((prev) => [...prev.slice(-5), { id: groupId, x, y }]);
        setTimeout(() => {
          setFlashes((prev) => prev.filter((f) => f.id !== groupId));
        }, 420);
        const burst = djGenerateSparkles(groupId, x, y);
        setSparkles((prev) => [...prev.slice(-48), ...burst]);
        setTimeout(() => {
          setSparkles((prev) => prev.filter((p) => p.groupId !== groupId));
        }, 620);
      }, popDelay);
    };
    window.addEventListener("pointerdown", onPointerDown, true);
    return () => window.removeEventListener("pointerdown", onPointerDown, true);
  }, []);

  if (sparks.length === 0 && sparkles.length === 0 && flashes.length === 0) return null;
  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 9500, pointerEvents: "none" }}>
      {sparks.map((s) => (
        <img
          key={s.id}
          src={VICTORY_LOGO_DATA_URI}
          alt=""
          className="dj-logo-spark"
          style={{
            position: "fixed",
            left: s.x,
            top: s.y,
            width: DJ_ICON_SIZE,
            height: DJ_ICON_SIZE,
            objectFit: "contain",
            filter: "drop-shadow(0 3px 6px rgba(20,18,14,0.35))",
          }}
        />
      ))}
      {flashes.map((f) => (
        <span
          key={f.id}
          className="dj-pop-flash"
          style={{
            position: "fixed",
            left: f.x,
            top: f.y,
            width: 46,
            height: 46,
            borderRadius: "50%",
            background:
              "radial-gradient(circle, rgba(255,224,150,0.9), rgba(255,196,90,0.5) 45%, rgba(255,196,90,0) 72%)",
          }}
        />
      ))}
      {sparkles.map((p) => (
        <span
          key={p.id}
          className="dj-sparkle"
          style={{
            position: "fixed",
            left: p.x,
            top: p.y,
            width: p.size,
            height: p.size,
            borderRadius: "50%",
            background: p.warm
              ? "radial-gradient(circle, #FFF6DC 0%, #F0C860 45%, rgba(229,164,48,0) 75%)"
              : "radial-gradient(circle, #FFFFFF 0%, #FFE7A8 45%, rgba(255,231,168,0) 75%)",
            boxShadow: p.warm
              ? "0 0 6px rgba(229,164,48,0.7)"
              : "0 0 6px rgba(255,255,255,0.8)",
            "--bx": `${p.bx}px`,
            "--by": `${p.by}px`,
            "--br": `${p.br}deg`,
          }}
        />
      ))}
    </div>
  );
}

function fmtDate(d) {
  if (!d) return "";
  const dt = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(dt.getTime())) return "";
  return dt.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function fmtTime(d) {
  if (!d) return "";
  const dt = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(dt.getTime())) return "";
  return dt.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

function fmtDateTime(d) {
  if (!d) return "";
  const dt = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(dt.getTime())) return "";
  return dt.toLocaleString(undefined, { year: "numeric", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

function ageFromBirthdate(birthdate) {
  if (!birthdate) return null;
  const bd = birthdate.toDate ? birthdate.toDate() : new Date(birthdate);
  if (isNaN(bd.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - bd.getFullYear();
  const monthDiff = today.getMonth() - bd.getMonth();
  if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < bd.getDate())) age--;
  return age;
}

function toDateInputValue(d) {
  if (!d) return "";
  const dt = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(dt.getTime())) return "";
  const yyyy = dt.getFullYear();
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  const dd = String(dt.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

// Member photos are stored directly on the member document as a
// compressed base64 data URL (no Firebase Storage bucket needed).
// Resize/compress client-side first so the doc stays well under
// Firestore's 1 MB-per-document limit.
function resizeImageToDataUrl(file, maxDim = 480, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read the file."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not load the image."));
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height >= width && height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function initials(name) {
  return (name || "")
    .split(/\s+/)
    .filter(Boolean)
    .slice(0, 2)
    .map((w) => w[0].toUpperCase())
    .join("");

// DISCIPLESHIP JOURNEY — default class / session structure
// ============================================================
// Spiritual Foundations runs 1–10 sessions, Making Disciples runs
// 1–2 sessions, and Empowering Leaders is a single session. These
// are used to seed the "classes" and "topics" collections the
// first time a leader sets up the app (see the "Load Disciples
// Journey Classes" button on the Classes tab).
const DEFAULT_CLASSES = [
  { name: "Spiritual Foundations", order: 1, sessionCount: 10 },
  { name: "Making Disciples Class", order: 2, sessionCount: 2 },
  { name: "Empowering Leaders Class", order: 3, sessionCount: 1 },
];

const LIFE_STAGES = ["Single", "Married", "ENC"];
const GENDERS = ["Male", "Female"];
const MEMBER_CATEGORIES = ["Water Baptize", "Transfer"];

const DOB_MONTHS = [
  ["01", "Jan"], ["02", "Feb"], ["03", "Mar"], ["04", "Apr"],
  ["05", "May"], ["06", "Jun"], ["07", "Jul"], ["08", "Aug"],
  ["09", "Sep"], ["10", "Oct"], ["11", "Nov"], ["12", "Dec"],
];

function daysInMonth(month, year) {
  return new Date(year, month, 0).getDate();
}

// Birthdate as Month / Day / Year dropdowns instead of the native
// <input type="date">, whose calendar-grid picker some mobile browsers
// render slowly (scrolling year-by-year to reach an older birth year)
// and can look inconsistent across devices. Plain <select>s scroll
// instantly everywhere and stay a predictable width next to Gender.
// Uncontrolled by design: it keeps its own month/day/year state and only
// reports the composed "YYYY-MM-DD" up via onChange once all three are
// picked (an empty string while incomplete), so a parent that resets
// `birthdate` to "" mid-entry doesn't wipe out what's already selected.
function DobPicker({ value, onChange }) {
  const initial = useMemo(() => {
    const [y, m, d] = (value || "").split("-");
    return { y: y || "", m: m || "", d: d || "" };
  }, []);
  const [year, setYear] = useState(initial.y);
  const [month, setMonth] = useState(initial.m);
  const [day, setDay] = useState(initial.d);

  const thisYear = new Date().getFullYear();
  const years = useMemo(() => Array.from({ length: 101 }, (_, i) => thisYear - i), [thisYear]);
  const maxDay = month ? daysInMonth(Number(month), Number(year) || thisYear) : 31;
  const dayOptions = useMemo(
    () => Array.from({ length: maxDay }, (_, i) => String(i + 1).padStart(2, "0")),
    [maxDay]
  );

  useEffect(() => {
    // A previously picked day (e.g. 30) can become invalid after
    // switching to a shorter month (e.g. Feb) — clear it back to the
    // placeholder rather than silently keeping an impossible date.
    if (day && Number(day) > maxDay) setDay("");
  }, [maxDay]);

  useEffect(() => {
    onChange(year && month && day ? `${year}-${month}-${day}` : "");
  }, [year, month, day]);

  return (
    <div style={styles.dobRow}>
      <select style={{ ...styles.modalInput, marginBottom: 0, flex: "1.15 1 0", minWidth: 0 }} value={month} onChange={(e) => setMonth(e.target.value)} required aria-label="Birth month">
        <option value="" disabled>Month</option>
        {DOB_MONTHS.map(([v, label]) => <option key={v} value={v}>{label}</option>)}
      </select>
      <select style={{ ...styles.modalInput, marginBottom: 0, flex: "0.85 1 0", minWidth: 0 }} value={day} onChange={(e) => setDay(e.target.value)} required aria-label="Birth day">
        <option value="" disabled>Day</option>
        {dayOptions.map((dd) => <option key={dd} value={dd}>{Number(dd)}</option>)}
      </select>
      <select style={{ ...styles.modalInput, marginBottom: 0, flex: "1.2 1 0", minWidth: 0 }} value={year} onChange={(e) => setYear(e.target.value)} required aria-label="Birth year">
        <option value="" disabled>Year</option>
        {years.map((yy) => <option key={yy} value={yy}>{yy}</option>)}
      </select>
    </div>
  );
}

// Discipleship track statuses — independent of the dynamic "classes"
// collection above. Each member gets a status per track, defaulting
// to "Not Enrolled" until a leader sets it.
const DISCIPLESHIP_TRACKS = ["One2One", "Spiritual Foundations", "Making Disciples", "Empowering Leaders", "Leadership 113"];
const TRACK_STATUSES = ["Not Enrolled", "Enrolled", "In-Progress", "Incomplete", "Completed", "Cancelled"];

// ============================================================
// MEMBERS CSV IMPORT / EXPORT — plain client-side CSV (no server
// component). Export writes one row per member with their core
// fields plus one status column per discipleship track. Import
// reads the same shape back and *syncs*: a row is matched to an
// existing member first by the "ID" column (the Firestore doc id,
// present on every export), falling back to an exact, case-
// insensitive name match when no id is given or the id isn't
// found — otherwise a brand-new member is created. This lets
// someone export, edit in a spreadsheet, and re-import to update
// everyone in bulk instead of re-adding people as duplicates.
// ============================================================
const MEMBER_CSV_TRACK_HEADERS = DISCIPLESHIP_TRACKS.map((t) => `${t} Status`);
const MEMBER_CSV_HEADERS = ["ID", "Name", "Birthdate", "Gender", "Life Stage", "Membership", "Contact Number", "Address", "Notes", ...MEMBER_CSV_TRACK_HEADERS];

function csvEscapeCell(value) {
  const s = value === null || value === undefined ? "" : String(value);
  return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

// Minimal RFC-4180-ish CSV parser: handles quoted fields (with escaped
// "" quotes inside), commas/newlines inside quotes, and \r\n or \n
// line endings. Good enough for a spreadsheet export/re-import
// round-trip without pulling in a library.
function parseCsvText(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  const src = String(text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (inQuotes) {
      if (c === '"') { if (src[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else field += c;
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter((r) => !(r.length === 1 && r[0].trim() === ""));
}

function buildMembersCsvText(members) {
  const lines = [MEMBER_CSV_HEADERS.map(csvEscapeCell).join(",")];
  (members || []).forEach((m) => {
    const row = [
      m.id, m.name || "", m.birthdate || "", m.gender || "", m.lifeStage || "", m.category || "",
      m.contactNumber || "", m.address || "", m.notes || "",
      ...DISCIPLESHIP_TRACKS.map((t) => (m.trackStatus && m.trackStatus[t]) || "Not Enrolled"),
    ];
    lines.push(row.map(csvEscapeCell).join(","));
  });
  return lines.join("\r\n");
}

function downloadTextFile(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || "text/csv") + ";charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// Parses the raw CSV text into plain row objects. Only the track
// columns actually present in the file are included in trackStatus —
// that's what lets a re-import touch just the columns someone edited
// without silently resetting every other track to "Not Enrolled".
function parseMembersCsvRows(text) {
  const rows = parseCsvText(text);
  if (rows.length === 0) return [];
  const header = rows[0].map((h) => h.trim());
  const idx = {};
  header.forEach((h, i) => { if (!(h in idx)) idx[h] = i; });
  const trackIdx = {};
  DISCIPLESHIP_TRACKS.forEach((t) => {
    const col = `${t} Status`;
    if (idx[col] !== undefined) trackIdx[t] = idx[col];
  });
  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const cells = rows[r];
    if (cells.every((c) => !c || !c.trim())) continue;
    const get = (col) => (idx[col] !== undefined ? (cells[idx[col]] || "").trim() : "");
    const trackStatus = {};
    Object.keys(trackIdx).forEach((t) => {
      const v = (cells[trackIdx[t]] || "").trim();
      if (v) trackStatus[t] = TRACK_STATUSES.includes(v) ? v : "Not Enrolled";
    });
    out.push({
      id: get("ID"), name: get("Name"), birthdate: get("Birthdate"), gender: get("Gender"),
      lifeStage: get("Life Stage"), category: get("Membership"), contactNumber: get("Contact Number"),
      address: get("Address"), notes: get("Notes"), trackStatus,
    });
  }
  return out;
}

// Runs the actual sync against Firestore: match-by-id, then
// match-by-name, then create new. Batched (chunked well under
// Firestore's 500-op limit) so a big spreadsheet doesn't need one
// write per row on the UI thread. Returns a summary for the toast.
async function importMembersCsv(parsedRows, existingMembers, classes) {
  const byId = new Map(existingMembers.map((m) => [m.id, m]));
  const byName = new Map();
  existingMembers.forEach((m) => {
    const key = (m.name || "").trim().toLowerCase();
    if (!key) return;
    if (!byName.has(key)) byName.set(key, []);
    byName.get(key).push(m);
  });

  let created = 0, updated = 0, skipped = 0;
  const resolvedMembers = new Set(); // existing member ids already touched this run
  const resolvedNewNames = new Set(); // "name key"s already created this run
  let batch = db.batch();
  let opsInBatch = 0;
  const flushIfNeeded = async () => {
    if (opsInBatch >= 400) {
      await batch.commit();
      batch = db.batch();
      opsInBatch = 0;
    }
  };

  for (const row of parsedRows) {
    if (!row.name) { skipped++; continue; }
    const key = row.name.toLowerCase();
    let target = row.id ? byId.get(row.id) : null;
    if (!target) {
      const matches = byName.get(key) || [];
      if (matches.length === 1) target = matches[0];
      else if (matches.length > 1) { skipped++; continue; } // ambiguous name, needs the ID column
    }

    if (target) {
      if (resolvedMembers.has(target.id)) { skipped++; continue; } // duplicate row for same person
      resolvedMembers.add(target.id);
      const nextTrackStatus = { ...(target.trackStatus || {}), ...row.trackStatus };
      const nextClassStatus = deriveClassStatusFromTracks(classes, row.trackStatus, target.classStatus);
      const nextClassIds = Array.from(new Set([
        ...(target.classIds || []),
        ...Object.keys(nextClassStatus).filter((id) => nextClassStatus[id] && nextClassStatus[id] !== "Not Enrolled"),
      ]));
      batch.update(db.collection("members").doc(target.id), {
        name: row.name,
        birthdate: row.birthdate || target.birthdate || "",
        gender: row.gender || target.gender || "",
        lifeStage: row.lifeStage || target.lifeStage || "",
        category: row.category || target.category || "",
        contactNumber: row.contactNumber || target.contactNumber || "",
        address: row.address || target.address || "",
        notes: row.notes || target.notes || "",
        trackStatus: nextTrackStatus,
        classStatus: nextClassStatus,
        classIds: nextClassIds,
      });
      updated++;
    } else {
      if (resolvedNewNames.has(key)) { skipped++; continue; } // duplicate new name within this file
      resolvedNewNames.add(key);
      const classStatus = deriveClassStatusFromTracks(classes, row.trackStatus, null);
      const classIds = Object.keys(classStatus).filter((id) => classStatus[id] && classStatus[id] !== "Not Enrolled");
      batch.set(db.collection("members").doc(), {
        name: row.name, photoUrl: null,
        birthdate: row.birthdate || "", gender: row.gender || "", lifeStage: row.lifeStage || "",
        category: row.category || "", contactNumber: row.contactNumber || "", address: row.address || "",
        notes: row.notes || "", classIds, classStatus, trackStatus: row.trackStatus, trackBatch: {},
        dateAdded: new Date(), source: "csv-import",
      });
      created++;
    }
    opsInBatch++;
    await flushIfNeeded();
  }
  if (opsInBatch > 0) await batch.commit();
  return { created, updated, skipped };
}
// Compact per-track status cell for the disciples list table. The
// default "Not Enrolled" state (the vast majority of cells) renders
// as a small muted dot instead of a full text pill, which is what
// was forcing the table into horizontal scroll. Meaningful statuses
// still render as a short colored pill so they stand out.
function TrackStatusCell({ status, batch, dark }) {
  if (status === "Not Enrolled") {
    return (
      <span
        style={{
          display: "inline-block",
          width: 7,

        }}
      />
    );

      {batch && <span style={{ fontSize: 8.5, color: dark ? "rgba(245,242,228,0.55)" : "#7A6E4E", whiteSpace: "nowrap" }}>{batch}</span>}
    </div>
  );
}

// ============================================================
// HELPERS — attendance / progress calculations
// ============================================================

function trackStatusBadgeStyle(status, dark) {
  if (status === "Completed") return dark ? styles.statusBadgeDoneDark : styles.statusBadgeDone;
  if (status === "In-Progress") return dark ? styles.statusBadgeProgressDark : styles.statusBadgeProgress;
  if (status === "Enrolled") return dark ? styles.statusBadgeEnrolledDark : styles.statusBadgeEnrolled;
  if (status === "Incomplete") return dark ? styles.statusBadgeIncompleteDark : styles.statusBadgeIncomplete;
  if (status === "Cancelled") return dark ? styles.statusBadgeCancelledDark : styles.statusBadgeCancelled;
  return dark ? styles.statusBadgeNoneDark : styles.statusBadgeNone;
}

function topicsForClass(topics, className) {
  return topics.filter((t) => t.class === className);
}

// ---- Batches ------------------------------------------------------
// A topic (session) belongs to a batch, stored as a plain "batch"
// string field. Sessions created before this feature existed have no
// "batch" field at all — topicBatch() treats those as "Batch 1"
// automatically (no migration write needed, so nothing changes for
// existing data unless a leader explicitly adds a new batch).
function topicBatch(t) {
  return (t && t.batch) || "Batch 1";
}
// The list of batches for a class is the union of: any batch names a
// leader has explicitly created on the class doc (classItem.batches —
// this is what lets a leader make an empty batch before any sessions
// exist), plus any batch already used by that class's sessions. Always
// includes at least "Batch 1" so a class with no batches configured
// yet still works exactly as before.
function getBatchesForClass(classItem, topics) {
  const set = new Set();
  ((classItem && classItem.batches) || []).forEach((b) => set.add(b));
  topicsForClass(topics, classItem ? classItem.name : "").forEach((t) => set.add(topicBatch(t)));
  if (set.size === 0) set.add("Batch 1");
  return Array.from(set).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
}
// A batch counts as complete once it has at least one session and
// every session in it has been marked conducted — same rule used to
// show the "✓ Batch complete" badge on the class detail view.
function isBatchComplete(classItem, topics, batch) {
  if (!classItem) return false;
  const ts = topicsForClass(topics, classItem.name).filter((t) => topicBatch(t) === batch);
  return ts.length > 0 && ts.every((t) => t.conducted);
}
// Batches still open for new enrollment — completed batches are
// dropped so a leader can't enroll or add a member into a batch
// that's already finished. Returns an empty array (not a fallback to
// every batch) once every batch is complete — a class with nothing
// left open has nowhere valid for a NEW enrollment to go; see how
// DiscipleshipTrackFields and AddMemberModal handle that empty case.
function openBatchesForClass(classItem, topics) {
  if (!classItem) return null;
  const all = getBatchesForClass(classItem, topics || []);
  return all.filter((b) => !isBatchComplete(classItem, topics || [], b));
}
// The batch to surface on the Classes tab card: the newest batch
// that isn't finished yet (i.e. the one currently being run). Falls
// back to the newest batch overall once every batch is complete, so
// a fully-finished class still shows its last batch instead of
// nothing.
function latestOngoingBatch(classItem, topics) {
  const batches = getBatchesForClass(classItem, topics);
  for (let i = batches.length - 1; i >= 0; i--) {
    if (!isBatchComplete(classItem, topics, batches[i])) return batches[i];
  }
  return batches[batches.length - 1];
}
// The next not-yet-conducted session in a batch, in display order —
// i.e. the session that comes right after whichever one was last
// marked conducted.
function nextSessionForBatch(classItem, topics, batch) {
  const ts = sortTopicsForDisplay(topicsForClass(topics, classItem.name).filter((t) => topicBatch(t) === batch));
  return ts.find((t) => !t.conducted) || null;
}
// A member's own batch's sessions for a class — same rule
// getEnrolledTopics uses: a class matching a Discipleship Track only
// counts that member's own batch's sessions; a custom class with no
// track counts all of them.
function memberBatchTopics(classItem, topics, member, track) {
  const ts = topicsForClass(topics, classItem.name);
  if (!track) return ts;
  const memberBatch = (member && member.trackBatch && member.trackBatch[track]) || "Batch 1";
  return ts.filter((t) => topicBatch(t) === memberBatch);
}
function memberClassPct(classItem, topics, attendanceByMember, member, track) {
  const ts = memberBatchTopics(classItem, topics, member, track);
  if (ts.length === 0) return 0;
  const att = attendanceByMember[member.id] || {};
  const done = ts.filter((t) => att[t.id] && att[t.id].attended).length;
  return Math.round((done / ts.length) * 100);
}

// Natural sort so "Session 2" lands before "Session 10" — topic
// order from the data source isn't always numeric-safe.
function sessionSortKey(name) {
  const m = (name || "").match(/(\d+)/);
  return m ? parseInt(m[1], 10) : Infinity;
}
function sortTopicsNaturally(list) {
  return [...list].sort((a, b) => {
    const ka = sessionSortKey(a.name), kb = sessionSortKey(b.name);
    if (ka !== kb) return ka - kb;
    return (a.name || "").localeCompare(b.name || "");
  });
}
// Display/drag order for a class's sessions: primarily the "order"
// field (which drag-to-reorder writes to), falling back to the old
// name-based natural sort for any session saved before that field
// existed.
function sortTopicsForDisplay(list) {
  return [...list].sort((a, b) => {
    const oa = typeof a.order === "number" ? a.order : null;
    const ob = typeof b.order === "number" ? b.order : null;
    if (oa != null && ob != null && oa !== ob) return oa - ob;
    if (oa != null && ob == null) return -1;
    if (oa == null && ob != null) return 1;
    const ka = sessionSortKey(a.name), kb = sessionSortKey(b.name);
    if (ka !== kb) return ka - kb;
    return (a.name || "").localeCompare(b.name || "");
  });
}

function classProgressPct(className, topics, attendanceByMember, memberId) {
  const ts = topicsForClass(topics, className);
  if (ts.length === 0) return 0;
  const att = attendanceByMember[memberId] || {};
  const done = ts.filter((t) => att[t.id] && att[t.id].attended).length;
  return Math.round((done / ts.length) * 100);
}

function overallProgressPct(topics, attendanceByMember, memberId) {
  if (topics.length === 0) return 0;
  const att = attendanceByMember[memberId] || {};
  const done = topics.filter((t) => att[t.id] && att[t.id].attended).length;
  return Math.round((done / topics.length) * 100);
}

function completedClassesCount(classes, topics, attendanceByMember, memberId) {
  return classes.filter((c) => {
    const ts = topicsForClass(topics, c.name);
    if (ts.length === 0) return false;
    return classProgressPct(c.name, topics, attendanceByMember, memberId) === 100;
  }).length;
}

function topicAttendanceLists(members, attendanceByMember, topicId) {
  const attended = [];
  const notAttended = [];
  (members || []).forEach((m) => {
    const a = (attendanceByMember[m.id] || {})[topicId];
    if (a && a.attended) {
      attended.push({ ...m, _attendance: a });
    } else {
      notAttended.push(m);
    }
  });
  attended.sort((a, b) => a.name.localeCompare(b.name));
  notAttended.sort((a, b) => a.name.localeCompare(b.name));
  return { attended, notAttended };
}

// Overall attendance rate for a class: attended-marks over
// (sessions × members), i.e. the average of every member's
// per-session attendance for that class. Used for the ring chart
// on the Classes list.
function classAttendanceRate(className, topics, members, attendanceByMember) {
  const ts = topicsForClass(topics, className);
  if (ts.length === 0 || !members || members.length === 0) return 0;
  let attendedCount = 0;
  members.forEach((m) => {
    const att = attendanceByMember[m.id] || {};
    ts.forEach((t) => { if (att[t.id] && att[t.id].attended) attendedCount++; });
  });
  const total = ts.length * members.length;
  return total ? Math.round((attendedCount / total) * 100) : 0;
}

// Buckets every member into Completed / In Progress / Not Started
// for a given class, used to drive the "Iron Man"-style demographics
// ring on the Classes tab (proportional wedges instead of a flat list).
function classDemographicsSegments(classItem, topics, members, attendanceByMember) {
  const ts = topicsForClass(topics, classItem.name);
  if (ts.length === 0 || !members || members.length === 0) {
    return { segments: [], total: 0 };
  }
  let completed = 0, inProgress = 0, notStarted = 0;
  members.forEach((m) => {
    const pct = classProgressPct(classItem.name, topics, attendanceByMember, m.id);
    if (pct >= 100) completed++;
    else if (pct > 0) inProgress++;
    else notStarted++;
  });
  const segments = [
    { label: "Completed", count: completed, color: "#385026" },
    { label: "In Progress", count: inProgress, color: "#E5A430" },
    { label: "Not Started", count: notStarted, color: "#C9BC94" },
  ].filter((s) => s.count > 0);
  return { segments, total: members.length };
}

// A member is only "in" the classes explicitly listed in their own
// classIds. Members added before this feature existed have no
// classIds field at all — treat those as enrolled in every class so
// their existing attendance keeps showing exactly as before. Any
// member added or edited from now on always gets an explicit
// (possibly empty) classIds array, so an empty array genuinely means
// "not enrolled in anything" rather than "legacy member".
function getEnrolledClasses(classes, member) {
  if (!member || !Array.isArray(member.classIds)) return classes;
  return classes.filter((c) => member.classIds.includes(c.id));
}

// The other direction of getEnrolledClasses: given a class, only the
// members actually enrolled in it (per their classIds). A member with
// no classIds field at all is a legacy member and is still treated as
// enrolled in every class (see the comment above getEnrolledClasses).
// This is what keeps a member set to "Not Enrolled" for a class —
// whether from the registration form or the Add/Edit Member form —
// out of that class's roster, sessions, and attendance stats.
function getClassMembers(members, classId) {
  return (members || []).filter((m) => !Array.isArray(m.classIds) || m.classIds.includes(classId));
}

// Same idea as getClassMembers, but for a class's own sessions: when
// the class matches a Discipleship Track (the only place a member's
// per-class batch is recorded), only that member's own batch's
// sessions count — so someone who finished a 7-session 2026 batch
// isn't measured against a 2027 batch's extra sessions too. A custom
// class with no matching track has no per-member batch label, so all
// of its sessions still count, same as before.
function getEnrolledTopics(topics, enrolledClasses, member) {
  const names = new Set(enrolledClasses.map((c) => c.name));
  return topics.filter((t) => {
    if (!names.has(t.class)) return false;
    const classItem = enrolledClasses.find((c) => c.name === t.class);
    const track = classItem && trackNameForClass(classItem.name);
    if (!track) return true;
    const memberBatch = (member && member.trackBatch && member.trackBatch[track]) || "Batch 1";
    return topicBatch(t) === memberBatch;
  });
}

function normName(s) {
  return (s || "").trim().toLowerCase().replace(/\s+/g, " ");
}

// Finds existing members whose name matches a pending registration's
// name, so a leader can merge instead of creating a duplicate person.
function findPossibleDuplicates(members, name) {
  const n = normName(name);
  if (!n) return [];
  return members.filter((m) => normName(m.name) === n);
}

// ============================================================
// FIRESTORE HOOKS — live-sync collections into React state
// ============================================================

function useCollection(path, orderField, enabled = true, whereField = null, whereValue = null) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  const [retryToken, setRetryToken] = useState(0);
  useEffect(() => {
    if (!db || !enabled) { setData([]); setLoading(false); return; }
    let cancelled = false;
    let ref = db.collection(path);
    // Optional equality filter — needed when Firestore rules only allow
    // reading the docs that match (e.g. a ONE2ONE leader's own members).
    if (whereField) ref = ref.where(whereField, "==", whereValue);
    const unsub = ref.onSnapshot((snap) => {
      let rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (orderField) rows.sort((a, b) => (a[orderField] || 0) - (b[orderField] || 0));
      setData(rows);
      setLoading(false);
    }, (err) => {
      console.error(path, err);
      setLoading(false);
      // onSnapshot never retries a listener on its own once it errors.
      // Right after sign-in (including a fresh browser open that's
      // restoring a persisted session), there's a brief window where
      // Firestore's own auth plumbing hasn't fully caught up with the
      // freshly-ready auth token yet, so the very first attempt to
      // subscribe can fail with permission-denied even though the user
      // really is signed in and allowed. Without a retry, that left a
      // collection like "leaders" stuck empty — showing "Viewer" —
      // until something tore the listener down and rebuilt it, e.g.
      // signing out and back in. Retrying once after a short delay
      // lets it recover on its own instead.
      if (!cancelled) {
        setTimeout(() => { if (!cancelled) setRetryToken((n) => n + 1); }, 1500);
      }
    });
    return () => { cancelled = true; unsub(); };
  }, [path, orderField, enabled, retryToken, whereField, whereValue]);
  return [data, loading];
}

                {showPw ? "Hide" : "Show"}

        {mode === "login" && (
          <div style={{ textAlign: "right", marginBottom: 14 }}>
            <a style={{ ...styles.authLink, fontWeight: 500 }} onClick={() => { setMode("reset"); setError(""); setNotice(""); }}>
              Forgot password?

        {error && <div style={styles.authError}><span>⚠</span><span>{error}</span></div>}
        {notice && <div style={styles.authNotice}><span>✓</span><span>{notice}</span></div>}

        <button style={styles.authSubmit} disabled={busy} type="submit">
          {busy && <span style={styles.authSpinner} />}
          {busy ? "Please wait…" : mode === "login" ? "Sign In" : mode === "signup" ? "Sign Up" : "Send Reset Link"}
        </button>

        {mode === "reset" && (
          <a style={styles.authBackLink} onClick={() => { setMode("login"); setError(""); setNotice(""); }}>
            ← Back to sign in
          </a>
        )}
      </form>
    </div>
  );
}
