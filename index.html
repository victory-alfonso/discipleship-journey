function normEmail(e) { return (e || "").trim().toLowerCase(); }

function fmtDate(d) {
  if (!d) return "";
  const dt = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(dt.getTime())) return "";
  return dt.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

const DEFAULT_STAGES = [
  { name: "New Believer", order: 1 },
  { name: "Foundation", order: 2 },
  { name: "Growing", order: 3 },
  { name: "Serving", order: 4 },
  { name: "Leading", order: 5 },
];

// ============================================================
// FIRESTORE HOOKS — live-sync collections into React state
// ============================================================

function useCollection(path, orderField) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!db) { setLoading(false); return; }
    let ref = db.collection(path);
    const unsub = ref.onSnapshot((snap) => {
      let rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (orderField) rows.sort((a, b) => (a[orderField] || 0) - (b[orderField] || 0));
      setData(rows);
      setLoading(false);
    }, (err) => { console.error(path, err); setLoading(false); });
    return unsub;
  }, [path, orderField]);
  return [data, loading];
}

// ============================================================
// AUTH SCREEN — email/password sign in, sign up, reset
// ============================================================

function AuthScreen() {
  const [mode, setMode] = useState("login"); // login | signup | reset
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setError(""); setNotice(""); setBusy(true);
    const cleanEmail = normEmail(email);
    try {
      if (mode === "reset") {
        await auth.sendPasswordResetEmail(cleanEmail);
        setNotice("Password reset email sent. Check your inbox.");
      } else if (mode === "signup") {
        const cred = await auth.createUserWithEmailAndPassword(cleanEmail, password);
        if (name.trim()) await cred.user.updateProfile({ displayName: name.trim() });
      } else {
        await auth.signInWithEmailAndPassword(cleanEmail, password);
      }
    } catch (err) {
      setError(err.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  if (!FIREBASE_CONFIGURED) {
    return (
      <div style={styles.authWrap}>
        <div style={styles.authCard}>
          <h1 style={styles.authTitle}>Discipleship Journey</h1>
          <p style={styles.authBody}>
            This app isn't connected to Firebase yet. Paste your project's{" "}
            <code style={styles.code}>firebaseConfig</code> near the top of{" "}
            <code style={styles.code}>index.html</code>, then reload.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div style={styles.authWrap}>
      <form style={styles.authCard} onSubmit={submit}>
        <h1 style={styles.authTitle}>Discipleship Journey</h1>
        <p style={styles.authSubtitle}>
          {mode === "login" && "Sign in to continue."}
          {mode === "signup" && "Create an account."}
          {mode === "reset" && "We'll email you a reset link."}
        </p>

        {mode === "signup" && (
          <input style={styles.authInput} placeholder="Your name" value={name} onChange={(e) => setName(e.target.value)} />
        )}
        <input style={styles.authInput} type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} required />
        {mode !== "reset" && (
          <input style={styles.authInput} type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} required minLength={6} />
        )}

        {error && <div style={styles.authError}>{error}</div>}
        {notice && <div style={styles.authNotice}>{notice}</div>}

        <button style={styles.authSubmit} disabled={busy} type="submit">
          {busy ? "Please wait…" : mode === "login" ? "Sign In" : mode === "signup" ? "Sign Up" : "Send Reset Link"}
        </button>

        <div style={styles.authLinks}>
          {mode !== "login" && <a style={styles.authLink} onClick={() => setMode("login")}>Sign in</a>}
          {mode !== "signup" && <a style={styles.authLink} onClick={() => setMode("signup")}>Create account</a>}
          {mode !== "reset" && <a style={styles.authLink} onClick={() => setMode("reset")}>Forgot password?</a>}
        </div>
      </form>
    </div>
  );
}

// ============================================================
// PROGRESS BAR
// ============================================================

function ProgressBar({ pct }) {
  return (
    <div style={styles.progressTrack}>
      <div style={{ ...styles.progressFill, width: `${Math.max(0, Math.min(100, pct))}%` }} />
    </div>
  );
}

function stageProgressPct(disciple, stages, milestones, progressByDisciple) {
  const stageMilestones = milestones.filter((m) => m.stage === disciple.currentStage);
  if (stageMilestones.length === 0) return 0;
  const done = stageMilestones.filter((m) => {
    const p = (progressByDisciple[disciple.id] || {})[m.id];
    return p && p.completed;
  }).length;
  return Math.round((done / stageMilestones.length) * 100);
}

// ============================================================
// ROSTER — list of disciples
// ============================================================

function Roster({ disciples, stages, milestones, progressByDisciple, isLeader, onOpen, onAdd }) {
  const [query, setQuery] = useState("");
  const filtered = disciples.filter((d) => (d.name || "").toLowerCase().includes(query.toLowerCase()));

  return (
    <div>
      <div style={{ ...styles.toolbar, ...styles.stackMobileFlex }}>
        <input style={styles.toolbarInput} placeholder="Search name…" value={query} onChange={(e) => setQuery(e.target.value)} />
        {isLeader && <button style={styles.primaryBtn} onClick={onAdd}>+ Add Disciple</button>}
      </div>

      {filtered.length === 0 && <div style={styles.emptyNote}>No disciples yet.</div>}

      <div style={styles.rosterList}>
        {filtered.map((d) => {
          const pct = stageProgressPct(d, stages, milestones, progressByDisciple);
          return (
            <div key={d.id} className="card-row" style={styles.rosterCard} onClick={() => onOpen(d)}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={styles.rosterName}>{d.name}</div>
                <div style={styles.rosterMeta}>
                  {d.currentStage || "No stage set"}{d.mentor ? ` · Mentor: ${d.mentor}` : ""}
                </div>
                <ProgressBar pct={pct} />
              </div>
              <div style={styles.rosterPct}>{pct}%</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================
// DISCIPLE PROFILE — stage, milestones, session history
// ============================================================

function DiscipleProfile({ disciple, stages, milestones, progressByDisciple, sessions, isLeader, onBack, onUpdateStage, onToggleMilestone, onAddSession, onDeleteDisciple }) {
  const [logOpen, setLogOpen] = useState(false);
  const [logNotes, setLogNotes] = useState("");
  const [logMentor, setLogMentor] = useState(disciple.mentor || "");

  const stageMilestones = milestones.filter((m) => m.stage === disciple.currentStage);
  const progress = progressByDisciple[disciple.id] || {};
  const pct = stageProgressPct(disciple, stages, milestones, progressByDisciple);
  const mySessions = sessions.filter((s) => s.discipleId === disciple.id);

  const submitSession = (e) => {
    e.preventDefault();
    if (!logNotes.trim()) return;
    onAddSession({ discipleId: disciple.id, mentor: logMentor, notes: logNotes.trim(), date: new Date() });
    setLogNotes(""); setLogOpen(false);
  };

  return (
    <div>
      <a style={styles.backLink} onClick={onBack}>&larr; Back to roster</a>

      <div style={styles.profileHeader}>
        <div>
          <h2 style={styles.profileName}>{disciple.name}</h2>
          <div style={styles.rosterMeta}>{disciple.mentor ? `Mentor: ${disciple.mentor}` : "No mentor assigned"}{disciple.startDate ? ` · Started ${fmtDate(disciple.startDate)}` : ""}</div>
        </div>
        {isLeader && (
          <button style={styles.dangerLink} onClick={() => { if (confirm(`Remove ${disciple.name}?`)) onDeleteDisciple(disciple.id); }}>Remove</button>
        )}
      </div>

      <div style={styles.lightCard}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, flexWrap: "wrap", gap: 8 }}>
          <div style={styles.sectionLabel}>Current Stage</div>
          {isLeader ? (
            <select style={styles.stageSelect} value={disciple.currentStage || ""} onChange={(e) => onUpdateStage(disciple.id, e.target.value)}>
              <option value="">— Select stage —</option>
              {stages.map((s) => <option key={s.id} value={s.name}>{s.name}</option>)}
            </select>
          ) : (
            <div style={styles.stageBadge}>{disciple.currentStage || "Not set"}</div>
          )}
        </div>
        <ProgressBar pct={pct} />
        <div style={styles.pctLabel}>{pct}% of milestones complete for this stage</div>
      </div>

      <div style={styles.sectionLabel}>Milestones</div>
      {stageMilestones.length === 0 && <div style={styles.emptyNote}>No milestones defined for this stage yet.</div>}
      <div style={styles.milestoneList}>
        {stageMilestones.map((m) => {
          const done = !!(progress[m.id] && progress[m.id].completed);
          return (
            <label key={m.id} className="milestone-row" style={styles.milestoneRow}>
              <input
                type="checkbox"
                checked={done}
                disabled={!isLeader}
                onChange={(e) => onToggleMilestone(disciple.id, m.id, e.target.checked)}
                style={{ width: 18, height: 18 }}
              />
              <span style={{ ...styles.milestoneText, ...(done ? styles.milestoneDone : {}) }}>{m.name}</span>
              {done && progress[m.id].dateCompleted && <span style={styles.milestoneDate}>{fmtDate(progress[m.id].dateCompleted)}</span>}
            </label>
          );
        })}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 26, marginBottom: 8 }}>
        <div style={styles.sectionLabel}>Session Log</div>
        {isLeader && <button style={styles.ghostBtn} onClick={() => setLogOpen((v) => !v)}>{logOpen ? "Cancel" : "+ Log Session"}</button>}
      </div>

      {logOpen && (
        <form style={styles.lightCard} onSubmit={submitSession}>
          <input style={{ ...styles.toolbarInput, width: "100%", marginBottom: 8 }} placeholder="Mentor name" value={logMentor} onChange={(e) => setLogMentor(e.target.value)} />
          <textarea style={styles.textarea} placeholder="What did you cover? Any notes…" value={logNotes} onChange={(e) => setLogNotes(e.target.value)} rows={3} />
          <button style={{ ...styles.primaryBtn, marginTop: 8 }} type="submit">Save Session</button>
        </form>
      )}

      {mySessions.length === 0 ? (
        <div style={styles.emptyNote}>No sessions logged yet.</div>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          {mySessions.map((s) => (
            <div key={s.id} style={styles.sessionCard}>
              <div style={styles.sessionDate}>{fmtDate(s.date)}{s.mentor ? ` · ${s.mentor}` : ""}</div>
              <div style={styles.sessionNotes}>{s.notes}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  const [mentor, setMentor] = useState("");
  const [stage, setStage] = useState(stages[0] ? stages[0].name : "");

  const submit = (e) => {
    e.preventDefault();
    if (!name.trim()) return;
    onSave({ name: name.trim(), mentor: mentor.trim(), currentStage: stage, startDate: new Date() });
  };

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <form style={styles.modalCard} onClick={(e) => e.stopPropagation()} onSubmit={submit}>
        <div style={styles.modalTitle}>Add Disciple</div>
        <input style={styles.modalInput} placeholder="Full name" value={name} onChange={(e) => setName(e.target.value)} autoFocus required />
        <input style={styles.modalInput} placeholder="Mentor (optional)" value={mentor} onChange={(e) => setMentor(e.target.value)} />

}

// ============================================================
// SETTINGS — manage stages, milestones, leaders (leader-only)
// ============================================================

function Settings({ stages, milestones, leaders, currentEmail, onAddStage, onDeleteStage, onAddMilestone, onDeleteMilestone, onAddLeader, onRemoveLeader }) {
  const [newStage, setNewStage] = useState("");
  const [milestoneStage, setMilestoneStage] = useState(stages[0] ? stages[0].name : "");
  const [newMilestone, setNewMilestone] = useState("");
  const [newLeaderEmail, setNewLeaderEmail] = useState("");

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
      <div style={styles.settingsSection}>
        <div style={styles.sectionLabel}>Stages</div>
        <div style={styles.pairGrid}>
          {stages.map((s) => (
            <div key={s.id} style={styles.pairItem}>
              <span style={{ flex: 1 }}>{s.name}</span>
              <button style={styles.iconDanger} onClick={() => onDeleteStage(s.id, s.name)}>×</button>
            </div>
          ))}
        </div>
        <div style={styles.addRoleRow}>
          <input style={styles.roleEditInput} placeholder="New stage name" value={newStage} onChange={(e) => setNewStage(e.target.value)} />
          <button style={styles.smallBtn} onClick={() => { if (newStage.trim()) { onAddStage(newStage.trim(), stages.length + 1); setNewStage(""); } }}>Add</button>
        </div>
      </div>

      <div style={styles.settingsSection}>
        <div style={styles.sectionLabel}>Milestones</div>
        <div style={styles.restrictAddRow}>
          <select style={styles.restrictSelect} value={milestoneStage} onChange={(e) => setMilestoneStage(e.target.value)}>
            {stages.map((s) => <option key={s.id} value={s.name}>{s.name}</option>)}
          </select>
          <input style={styles.roleEditInput} placeholder="Milestone name" value={newMilestone} onChange={(e) => setNewMilestone(e.target.value)} />
          <button style={styles.smallBtn} onClick={() => { if (newMilestone.trim() && milestoneStage) { onAddMilestone(milestoneStage, newMilestone.trim(), milestones.length + 1); setNewMilestone(""); } }}>Add</button>
        </div>
        <div style={styles.restrictList}>
          {stages.map((s) => {
            const ms = milestones.filter((m) => m.stage === s.name);
            if (ms.length === 0) return null;
            return (
              <div key={s.id} style={{ marginTop: 6 }}>
                <div style={styles.milestoneGroupLabel}>{s.name}</div>
                {ms.map((m) => (
                  <div key={m.id} style={styles.restrictRow}>
                    <span style={styles.restrictName}>{m.name}</span>
                    <button style={styles.iconDanger} onClick={() => onDeleteMilestone(m.id, m.name)}>×</button>
                  </div>
                ))}
              </div>
            );
          })}
        </div>
      </div>

      <div style={styles.settingsSection}>
        <div style={styles.sectionLabel}>Leaders / Mentors (can edit)</div>
        <div style={styles.pairNote}>Anyone whose email is listed here can update stages, milestones, and sessions. Everyone else who signs in gets a read-only view.</div>
        <div style={styles.restrictList}>
          {leaders.map((l) => (
            <div key={l.id} style={styles.restrictRow}>
              <span style={styles.restrictName}>{l.id}{l.id === currentEmail ? " (you)" : ""}</span>
              <button style={styles.iconDanger} onClick={() => onRemoveLeader(l.id)}>×</button>
            </div>
          ))}
        </div>
        <div style={styles.addRoleRow}>
          <input style={styles.roleEditInput} type="email" placeholder="email@example.com" value={newLeaderEmail} onChange={(e) => setNewLeaderEmail(e.target.value)} />
          <button style={styles.smallBtn} onClick={() => { if (newLeaderEmail.trim()) { onAddLeader(newLeaderEmail.trim()); setNewLeaderEmail(""); } }}>Add</button>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================

function App() {
  const [authUser, setAuthUser] = useState(undefined); // undefined = loading, null = signed out
  const [tab, setTab] = useState("roster");
  const [openDisciple, setOpenDisciple] = useState(null);
  const [addOpen, setAddOpen] = useState(false);

  useEffect(() => {
    if (!auth) { setAuthUser(null); return; }
    return auth.onAuthStateChanged((u) => setAuthUser(u));
  }, []);

  const currentEmail = normEmail(authUser && authUser.email);

  const [disciplesRaw, discLoading] = useCollection("disciples");
  const [stages] = useCollection("stages", "order");
  const [milestones] = useCollection("milestones", "order");
  const [sessions] = useCollection("sessions");
  const [leaders] = useCollection("leaders");
  const [progressDocs] = useCollection("progress");

  const isLeader = leaders.some((l) => l.id === currentEmail);

  // One-time seed of default stages if the collection is empty and this user is a leader.
  useEffect(() => {
    if (!db || !isLeader) return;
    if (stages.length === 0) {
      DEFAULT_STAGES.forEach((s) => db.collection("stages").add(s));
    }
  }, [db, isLeader, stages.length]);

  const disciples = useMemo(() => disciplesRaw.map((d) => ({ ...d, name: d.name || "(no name)" })), [disciplesRaw]);

  const progressByDisciple = useMemo(() => {
    const map = {};
    progressDocs.forEach((p) => {
      if (!map[p.discipleId]) map[p.discipleId] = {};
      map[p.discipleId][p.milestoneId] = p;
    });
    return map;
  }, [progressDocs]);

  // Keep openDisciple in sync with live data.
  const liveOpenDisciple = openDisciple ? disciples.find((d) => d.id === openDisciple.id) || openDisciple : null;

  const addDisciple = (data) => { db.collection("disciples").add(data); setAddOpen(false); };
  const deleteDisciple = (id) => { db.collection("disciples").doc(id).delete(); setOpenDisciple(null); };
  const updateStage = (id, stage) => db.collection("disciples").doc(id).update({ currentStage: stage });
  const toggleMilestone = (discId, msId, completed) => {
    const docId = `${discId}_${msId}`;
    db.collection("progress").doc(docId).set({ discipleId: discId, milestoneId: msId, completed, dateCompleted: completed ? new Date() : null }, { merge: true });
  };
  const addSession = (data) => db.collection("sessions").add(data);
  const addStage = (name, order) => db.collection("stages").add({ name, order });
  const deleteStage = (id) => db.collection("stages").doc(id).delete();
  const addMilestone = (stage, name, order) => db.collection("milestones").add({ stage, name, order });
  const deleteMilestone = (id) => db.collection("milestones").doc(id).delete();
  const addLeader = (email) => db.collection("leaders").doc(normEmail(email)).set({ addedAt: new Date() });
  const removeLeader = (email) => db.collection("leaders").doc(email).delete();

  if (authUser === undefined) {
    return <div style={styles.loadingScreen}>Loading…</div>;
  }
  if (!authUser) {
    return <AuthScreen />;
  }

  return (
    <div style={styles.appWrap}>
      <header style={styles.header}>
        <div style={styles.headerTitle}>Discipleship Journey</div>
        <div style={styles.headerRight}>
          <span style={styles.headerUser} className="hide-mobile">
            {authUser.displayName || authUser.email} {isLeader ? "· Leader" : "· Viewer"}
          </span>
          <button style={styles.signOutBtn} onClick={() => auth.signOut()}>Sign out</button>
        </div>
      </header>

      <nav style={styles.nav}>
        <button className="nav-item" style={{ ...styles.navItem, ...(tab === "roster" ? styles.navItemActive : {}) }} onClick={() => { setTab("roster"); setOpenDisciple(null); }}>Roster</button>
        {isLeader && (
          <button className="nav-item" style={{ ...styles.navItem, ...(tab === "settings" ? styles.navItemActive : {}) }} onClick={() => { setTab("settings"); setOpenDisciple(null); }}>Settings</button>
        )}
      </nav>

      <main style={styles.main}>
        {tab === "roster" && !liveOpenDisciple && (
          <Roster
            disciples={disciples}
            stages={stages}
            milestones={milestones}
            progressByDisciple={progressByDisciple}
            isLeader={isLeader}
            onOpen={setOpenDisciple}
            onAdd={() => setAddOpen(true)}
          />
        )}

        {tab === "roster" && liveOpenDisciple && (
          <DiscipleProfile
            disciple={liveOpenDisciple}
            stages={stages}
            milestones={milestones}
            progressByDisciple={progressByDisciple}
            sessions={sessions}
            isLeader={isLeader}
            onBack={() => setOpenDisciple(null)}
            onUpdateStage={updateStage}
            onToggleMilestone={toggleMilestone}
            onAddSession={addSession}
            onDeleteDisciple={deleteDisciple}
          />
        )}

        {tab === "settings" && isLeader && (
          <Settings
            stages={stages}
            milestones={milestones}
            leaders={leaders}
            currentEmail={currentEmail}
            onAddStage={addStage}
            onDeleteStage={deleteStage}
            onAddMilestone={addMilestone}
            onDeleteMilestone={deleteMilestone}
            onAddLeader={addLeader}
            onRemoveLeader={removeLeader}
          />
        )}
      </main>

      {addOpen && <AddDiscipleModal stages={stages} onClose={() => setAddOpen(false)} onSave={addDisciple} />}
    </div>
  );
}
