function App() {
  const [authUser, setAuthUser] = useState(undefined); // undefined = loading, null = signed out
  // The app-open entrance animation (djAppEnter) ends on transform:
  // translateY(0) held via fill-mode "both". Even though that's
  // visually a no-op, ANY non-"none" transform value on an ancestor
  // creates a new containing block for descendant position:fixed
  // elements — so every fixed-position modal/overlay rendered inside
  // this wrapper (the ONE2ONE profile card, confirm dialogs, etc.)
  // was being sized/positioned relative to this div instead of the
  // real viewport, which is why they showed up cropped/off-center on
  // desktop. Dropping the animation class once it finishes restores
  // a real "none" transform and fixes that for good.
  const [introDone, setIntroDone] = useState(false);
  const [tab, setTab] = useState("classes");
  const [openMember, setOpenMember] = useState(null);
  // Which discipleship track (if any) the currently open member was
  // reached through — set when opened from inside a specific class
  // (Classes tab), left null when opened from the Disciples tab so
  // Edit Member shows every track. Used to restrict EditMemberModal.
  const [openMemberTrack, setOpenMemberTrack] = useState(null);
  const openMemberInContext = (m, track) => { setOpenMember(m); setOpenMemberTrack(track || null); };
  const [openClass, setOpenClass] = useState(null);
  const [openTopic, setOpenTopic] = useState(null);
  const [addOpen, setAddOpen] = useState(false);
  const [editingMember, setEditingMember] = useState(null);
  const [renamingClass, setRenamingClass] = useState(null);
  const [renamingTopic, setRenamingTopic] = useState(null);
  const [renamingBatch, setRenamingBatch] = useState(null); // { classId, oldName }
  const [openOneOnOne, setOpenOneOnOne] = useState(null);
  const [addOneOnOneOpen, setAddOneOnOneOpen] = useState(false);
  const [justAddedOneOnOne, setJustAddedOneOnOne] = useState(null);
  const [editingOneOnOne, setEditingOneOnOne] = useState(null);
  // Which ONE2ONE leader's profile is currently open (Leaders/Managers
  // land on a grid of leader cards first — see OneOnOneLeaders — and
  // drill into one leader's profile to see the members they added).
  const [openOneOnOneLeaderEmail, setOpenOneOnOneLeaderEmail] = useState(null);
  const [creatingOwnProfile, setCreatingOwnProfile] = useState(false);
  const [editingOneOnOneLeader, setEditingOneOnOneLeader] = useState(null);

  useEffect(() => {
    if (!auth) { setAuthUser(null); return; }
    return auth.onAuthStateChanged((u) => setAuthUser(u));
  }, []);

  const currentEmail = normEmail(authUser && authUser.email);

  // Don't start these listeners until Firebase Auth has actually
  // confirmed a signed-in user. Firing them immediately on mount (before
  // auth.onAuthStateChanged resolves) can hit Firestore's rules with no
  // auth token yet, get rejected once, and then never retry on its own —
  // which is what made "leaders" look empty (stuck on "Viewer") right
  // after signing in until the page was refreshed.
  // An anonymous user (e.g. left over from opening register.html in this
  // browser) is not a real sign-in — treat it as signed out so the leader
  // is asked to log in instead of landing in a Viewer session.
  const authReady = !!authUser && !authUser.isAnonymous;
  // Roles come first so the shared collections below can be skipped
  // for ONE2ONE-only leaders (they never see Disciples/Classes).
  const [leaders] = useCollection("leaders", null, authReady);
  const [admins] = useCollection("admins", null, authReady);
  const [oneLeaders] = useCollection("one2oneLeaders", null, authReady);

  // A manager (in "admins") gets full edit access even if they were
  // never separately added to "leaders" — managers aren't a subset of
  // leaders, they're a superset with one extra privilege (managing this
  // Settings page). Someone in "leaders" but not "admins" can edit but
  // not manage; someone in neither can do nothing.
  const isInLeadersList = leaders.some((l) => l.id === currentEmail);
  const isInManagersList = admins.some((a) => a.id === currentEmail);
  const isLeader = isInLeadersList || isInManagersList;
  // Until the first manager is added, every leader is treated as a
  // manager so nobody gets locked out of Settings.
  const isAdmin = isInManagersList || (admins.length === 0 && isInLeadersList);
  // ONE2ONE leaders: only the ONE2ONE tab, only their own added members.
  // Leaders/Managers already have full access, so being in both lists
  // just means the normal leader view.
  const isOneLeader = oneLeaders.some((l) => l.id === currentEmail);
  const isOneOnly = isOneLeader && !isLeader;
  const canUseOneOnOne = isLeader || isOneLeader;
  // A ONE2ONE-only leader whose one2oneLeaders doc has no name yet
  // hasn't created their profile — they're shown a create-profile
  // prompt in the ONE2ONE tab instead of their member tracker until
  // they do (see the OneOnOne needsProfile prop).
  const myOneLeaderDoc = oneLeaders.find((l) => l.id === currentEmail);
  const needsOwnProfile = isOneOnly && !(myOneLeaderDoc && myOneLeaderDoc.name);

  const [membersRaw] = useCollection("members", null, authReady && !isOneOnly);
  const [classes] = useCollection("classes", "order", authReady);
  const [topics] = useCollection("topics", "order", authReady);
  const [attendanceDocs] = useCollection("attendance", null, authReady && !isOneOnly);
  // ONE2ONE lives in its own collection, fetched in full like every
  // other collection here; each person carries a createdBy (the
  // adder's email) so it can be filtered below — Leaders/Managers see
  // everyone, ONE2ONE leaders only see the people they added.
  const [oneOnOneRaw] = useCollection("oneOnOne", null, authReady && canUseOneOnOne, isOneOnly ? "createdBy" : null, isOneOnly ? currentEmail : null);

  const [pendingRegistrationsAll] = useCollection("pendingRegistrations", null, isLeader);
  // Approved/rejected registrations stay in this collection (so each
  // registrant's status link keeps working) — the leader's queue only
  // ever shows the ones still awaiting a decision.
  const pendingRegistrations = useMemo(
    () => pendingRegistrationsAll.filter((p) => !p.status || p.status === "pending"),
    [pendingRegistrationsAll]
  );

  const members = useMemo(() => membersRaw.map((m) => ({ ...m, name: m.name || "(no name)" })), [membersRaw]);
  const myOneOnOne = useMemo(
    () => oneOnOneRaw
      .filter((p) => isLeader || p.createdBy === currentEmail)
      .sort((a, b) => (a.name || "").localeCompare(b.name || "")),
    [oneOnOneRaw, currentEmail, isLeader]
  );
  // Newly added ONE2ONE members wait as status "pending" until a
  // Leader/Manager approves them in the Registrations tab — until then
  // no Disciples record exists for them (see approveOneOnOnePerson).
  // Leaders/Managers see everyone's pending people here (oneOnOneRaw is
  // unfiltered for them); ONE2ONE-only leaders only ever see their own.
  const oneOnOnePendingCount = useMemo(() => myOneOnOne.filter((p) => p.status === "pending").length, [myOneOnOne]);
  const pendingOneOnOnePeople = useMemo(
    () => oneOnOneRaw.filter((p) => p.status === "pending").sort((a, b) => (a.name || "").localeCompare(b.name || "")),
    [oneOnOneRaw]
  );
  // ONE2ONE leaders are locked to the ONE2ONE tab; anyone with no
  // ONE2ONE access can't land on it either.
  const activeTab = isOneOnly ? "one2one" : (!canUseOneOnOne && tab === "one2one" ? "roster" : tab);

  // Measures the sticky header bar's real rendered height (it differs
  // between desktop and mobile, and can change when text wraps) and
  // publishes it as a CSS variable so every modal overlay can anchor
  // itself just below the header instead of covering it. Re-measures
  // on mount, on resize, and whenever the header's own size changes
  // (ResizeObserver), so it stays correct across breakpoints.
  const headerBarRef = useRef(null);
  useEffect(() => {
    const el = headerBarRef.current;
    if (!el) return;
    const setHeaderVar = () => {
      document.documentElement.style.setProperty("--dj-header-h", `${el.offsetHeight}px`);
    };
    setHeaderVar();
    const ro = new ResizeObserver(setHeaderVar);
    ro.observe(el);
    window.addEventListener("resize", setHeaderVar);
    return () => { ro.disconnect(); window.removeEventListener("resize", setHeaderVar); };
  }, []);

  // Sliding pill nav indicator — measures the active nav button's
  // position/width and animates a background pill to it via CSS
  // transform (translateX + width), so the pill smoothly glides under
  // whichever tab is active instead of each button toggling its own
  // background instantly. Re-measures on tab change, on mount, and on
  // resize (nav items can reflow on narrow screens).
  const navRefs = useRef({});
  const [navPill, setNavPill] = useState(null);
  useEffect(() => {
    const measure = () => {
      const el = navRefs.current[activeTab];
      const nav = el && el.parentElement;
      if (!el || !nav) { setNavPill(null); return; }
      const elRect = el.getBoundingClientRect();
      const navRect = nav.getBoundingClientRect();
      setNavPill({ left: elRect.left - navRect.left + nav.scrollLeft, width: elRect.width });
    };
    measure();
    window.addEventListener("resize", measure);
    return () => window.removeEventListener("resize", measure);
  }, [activeTab, isOneOnly, canUseOneOnOne, isLeader, oneOnOnePendingCount, pendingRegistrations.length, pendingOneOnOnePeople.length]);
  // One card per ONE2ONE leader (Leaders/Managers land here first — see
  // OneOnOneLeaders). Built from the one2oneLeaders collection, plus a
  // "virtual" entry for anyone who has added ONE2ONE people without
  // being formally listed there (e.g. a full Leader/Manager using the
  // tab themselves) so their added members always have a card to live
  // under too.
  const oneOnOneLeaderProfiles = useMemo(() => {
    const map = new Map();
    oneLeaders.forEach((l) => map.set(l.id, { ...l }));
    oneOnOneRaw.forEach((p) => {
      const email = normEmail(p.createdBy);
      if (email && !map.has(email)) map.set(email, { id: email, name: null, photoUrl: null, virtual: true });
    });
    return Array.from(map.values())
      .map((l) => {
        const mine = oneOnOneRaw.filter((p) => normEmail(p.createdBy) === l.id);
        return { ...l, peopleCount: mine.length, pendingCount: mine.filter((p) => p.status === "pending").length };
      })
      .sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));
  }, [oneLeaders, oneOnOneRaw]);
  const openOneOnOneLeaderProfile = openOneOnOneLeaderEmail
    ? (oneOnOneLeaderProfiles.find((l) => l.id === openOneOnOneLeaderEmail) || { id: openOneOnOneLeaderEmail, name: null, photoUrl: null, virtual: true })
    : null;
  const oneOnOneClass = useMemo(() => findOneOnOneClass(classes), [classes]);
  const oneOnOneSessions = useMemo(() => oneOnOneClassSessions(oneOnOneClass, topics), [oneOnOneClass, topics]);
  const liveOpenOneOnOne = openOneOnOne && canUseOneOnOne ? myOneOnOne.find((p) => p.id === openOneOnOne.id) || null : null;

  const attendanceByMember = useMemo(() => {
    const map = {};
    attendanceDocs.forEach((a) => {
      if (!map[a.memberId]) map[a.memberId] = {};
      map[a.memberId][a.topicId] = a;
    });
    return map;
  }, [attendanceDocs]);

  const liveOpenMember = openMember ? members.find((m) => m.id === openMember.id) || openMember : null;
  const liveOpenClass = openClass ? classes.find((c) => c.id === openClass.id) || openClass : null;
  const liveOpenTopic = openTopic ? topics.find((t) => t.id === openTopic.id) || openTopic : null;

  // mergeIntoMemberId comes from AddMemberModal's duplicate picker: when
  // set, the person already exists in Disciples, so we fold the new
  // form's classes/track info into that record instead of creating a
  // second one. Never downgrades a track status the existing member
  // already has, and unions class enrollments rather than replacing them.
  const addMember = (data, mergeIntoMemberId) => {
    if (mergeIntoMemberId) {
      const existing = members.find((m) => m.id === mergeIntoMemberId) || {};
      const nextClassIds = Array.from(new Set([...(existing.classIds || []), ...(data.classIds || [])]));
      const nextTrackStatus = { ...(data.trackStatus || {}) };
      Object.keys(existing.trackStatus || {}).forEach((k) => { nextTrackStatus[k] = existing.trackStatus[k]; });
      Object.keys(data.trackStatus || {}).forEach((k) => {
        if (!existing.trackStatus || !existing.trackStatus[k] || existing.trackStatus[k] === "Not Enrolled") {
          nextTrackStatus[k] = data.trackStatus[k];
        }
      });
      const nextTrackBatch = { ...(data.trackBatch || {}), ...(existing.trackBatch || {}) };
      const nextClassStatus = deriveClassStatusFromTracks(classes, nextTrackStatus, existing.classStatus);
      const fillGap = (key) => (existing[key] && String(existing[key]).trim()) ? existing[key] : data[key];
      const merged = {
        photoUrl: existing.photoUrl || data.photoUrl || null,
        birthdate: fillGap("birthdate"),
        gender: fillGap("gender"),
        lifeStage: fillGap("lifeStage"),
        category: fillGap("category"),
        contactNumber: fillGap("contactNumber"),
        address: fillGap("address"),
        notes: [existing.notes, data.notes].filter(Boolean).join("\n"),
        classIds: nextClassIds,
        classStatus: nextClassStatus,
        trackStatus: nextTrackStatus,
        trackBatch: nextTrackBatch,
      };
      return db.collection("members").doc(mergeIntoMemberId).update(merged)
        .then(() => { setAddOpen(false); showNotice("Merged into existing Disciples record."); })
        .catch((err) => { showError("Could not merge into the existing member. Error: " + err.message); throw err; });
    }
    return db.collection("members").add(data)
      .then(() => { setAddOpen(false); showNotice("Member saved."); })
      .catch((err) => { showError("Could not save the member. Error: " + err.message); throw err; });
  };
  const updateMember = (id, data) => {
    return db.collection("members").doc(id).update(data)
      .then(() => { setEditingMember(null); showNotice("Changes saved."); })
      .catch((err) => { showError("Could not save the changes. Error: " + err.message); throw err; });
  };
  // Removing a member also removes their attendance records (attendance
  // docs are keyed by member), attendance first and the member doc last
  // so a failed attempt can simply be retried.
  //
  // A member created from ONE2ONE (has oneOnOneId) stays linked to their
  // now-"approved" oneOnOne doc. If we only deleted the member, that
  // oneOnOne doc would still say "approved" with a memberId pointing at
  // nothing — and the ONE2ONE self-heal effect above (see oneOnOneSyncTick)
  // treats that exact situation as "the Disciples record for an approved
  // ONE2ONE person went missing" and quietly recreates it. That's what
  // makes a removed ONE2ONE member appear to "come back" or duplicate in
  // Disciples. Deleting their oneOnOne doc in the same pass keeps this a
  // clean, one-way removal.
  const deleteMember = async (id) => {
    try {
      const member = members.find((m) => m.id === id);
      const memberAttendance = attendanceDocs.filter((a) => a.memberId === id);
      const refs = [
        ...memberAttendance.map((a) => db.collection("attendance").doc(a.id)),
        db.collection("members").doc(id),
      ];
      if (member && member.oneOnOneId) {
        refs.push(db.collection("oneOnOne").doc(member.oneOnOneId));
      }
      await deleteRefsInChunks(refs);
      setOpenMember(null);
      setOpenMemberTrack(null);
      showNotice("Member removed.");
    } catch (err) {
      showError("Could not delete the member. Error: " + err.message);
    }
  };
  const toggleAttendance = (memberId, topicId, attended) => {
    const docId = `${memberId}_${topicId}`;
    const attendanceRef = db.collection("attendance").doc(docId);
    const attendanceData = { memberId, topicId, attended, dateAttended: attended ? new Date() : null };

    // Keep each discipleship track's status in sync with attendance,
    // fully automatically:
    //   0 sessions attended     -> stays/reverts to "Enrolled"
    //   1+ sessions, not all    -> "In-Progress" (this is the "Day 1" flip)
    //   every session attended  -> "Completed"
    // Covers the checkbox in Session detail and QR scan check-in, since
    // both call this same function. It only ever touches a track that's
    // currently in one of these automatic states — a leader who has
    // manually set "Incomplete" or "Cancelled" is left alone; nothing
    // here overrides that judgment call.
    const topic = topics.find((t) => t.id === topicId);
    const member = members.find((m) => m.id === memberId);
    const classInfo = topic && classes.find((c) => c.name === topic.class);
    const track = classInfo && trackNameForClass(classInfo.name);
    let memberUpdate = null;
    if (topic && member && classInfo && track) {
      const currentStatus = (member.trackStatus && member.trackStatus[track]) || "Not Enrolled";
      const AUTO_STATUSES = ["Not Enrolled", "Enrolled", "In-Progress", "Completed"];
      if (AUTO_STATUSES.includes(currentStatus)) {
        const memberBatch = (member.trackBatch && member.trackBatch[track]) || "Batch 1";
        const sessions = topicsForClass(topics, topic.class).filter((t) => topicBatch(t) === memberBatch);
        const attForMember = { ...(attendanceByMember[memberId] || {}) };
        attForMember[topicId] = { attended };
        const attendedCount = sessions.filter((t) => attForMember[t.id] && attForMember[t.id].attended).length;
        let nextStatus = currentStatus;
        if (sessions.length > 0 && attendedCount === sessions.length) {
          nextStatus = "Completed";
        } else if (attendedCount > 0) {
          nextStatus = "In-Progress";
        } else if (currentStatus !== "Not Enrolled") {
          nextStatus = "Enrolled";
        }
        if (nextStatus !== currentStatus) {
          const nextTrackStatus = { ...(member.trackStatus || {}), [track]: nextStatus };
          const nextClassStatus = deriveClassStatusFromTracks(classes, nextTrackStatus, member.classStatus);
          const existingClassIds = Array.isArray(member.classIds) ? member.classIds : [];
          const nextClassIds = existingClassIds.includes(classInfo.id) ? existingClassIds : [...existingClassIds, classInfo.id];
          memberUpdate = { trackStatus: nextTrackStatus, classStatus: nextClassStatus, classIds: nextClassIds };
        }
      }
    }

    // Attendance and the discipleship status it drives are written
    // together in one batch, so either both land or neither does — a
    // dropped connection can no longer save the attendance mark but
    // miss the status flip (or vice versa) and leave the two out of
    // sync.
    const batch = db.batch();
    batch.set(attendanceRef, attendanceData, { merge: true });
    if (memberUpdate) {
      batch.update(db.collection("members").doc(memberId), memberUpdate);
    }
    batch.commit().catch((err) => showError("Could not save the attendance. Error: " + err.message));
  };
  const setAttendanceDate = (memberId, topicId, dateStr) => {
    const docId = `${memberId}_${topicId}`;
    const [y, m, d] = dateStr.split("-").map(Number);
    const dateAttended = new Date(y, m - 1, d);
    db.collection("attendance").doc(docId).set({ memberId, topicId, attended: true, dateAttended }, { merge: true })
      .catch((err) => showError("Could not save the date. Error: " + err.message));
  };
  // Used when a leader manually flips a member's status to "Completed"
  // in the Edit Member form (after confirming) — marks every session in
  // that class as attended so the attendance records actually back up
  // the status shown, instead of leaving it saying "Completed" while
  // sessions still show 0 attended.
  const completeAllSessionsForClass = async (memberId, classId, batchLabel) => {
    const classInfo = classes.find((c) => c.id === classId);
    if (!classInfo) return;
    const classTopics = batchLabel
      ? topicsForClass(topics, classInfo.name).filter((t) => topicBatch(t) === batchLabel)
      : topicsForClass(topics, classInfo.name);
    if (classTopics.length === 0) return;
    const batch = db.batch();
    classTopics.forEach((t) => {
      const docId = `${memberId}_${t.id}`;
      batch.set(db.collection("attendance").doc(docId), { memberId, topicId: t.id, attended: true, dateAttended: new Date() }, { merge: true });
    });
    try {
      await batch.commit();
    } catch (err) {
      showError("Could not mark all sessions as attended. Error: " + err.message);
    }
  };
  // Used when a leader downgrades a member away from "Completed" for a
  // class in the Edit Member form's session picker — writes back exactly
  // which sessions they checked as done, so the attendance records match
  // the status they just chose instead of every session still showing
  // attended.
  const updateSessionAttendanceForClass = async (memberId, classId, attendanceMap) => {
    const classInfo = classes.find((c) => c.id === classId);
    if (!classInfo) return;
    const batch = db.batch();
    Object.entries(attendanceMap || {}).forEach(([topicId, attended]) => {
      const docId = `${memberId}_${topicId}`;
      batch.set(db.collection("attendance").doc(docId), { memberId, topicId, attended: !!attended, dateAttended: attended ? new Date() : null }, { merge: true });
    });
    try {
      await batch.commit();
    } catch (err) {
      showError("Could not update session attendance. Error: " + err.message);
    }
  };
  // ============================================================
  // ONE2ONE — each person is a doc in its own collection, carrying
  // createdBy (the adder's email) and a plain array of sessions
  // ({id, name, conducted, dateConducted}). Sessions are small and
  // fully owned by the one parent doc, so they're edited by reading
  // the array from local state and writing the whole array back,
  // rather than a subcollection.
  // ============================================================
  // Every ONE2ONE person is also a real Disciples member enrolled in the
  // ONE2ONE class. The member doc is created in the same batch as the
  // ONE2ONE doc and linked both ways (memberId / oneOnOneId), and their
  // ONE2ONE session checks are mirrored into attendance + status below.
  const oneOnOneTrack = () => (oneOnOneClass && trackNameForClass(oneOnOneClass.name)) || "One2One";
  const oneOnOneStatusFor = (done, total) => (total > 0 && done === total ? "Completed" : done > 0 ? "In-Progress" : "Enrolled");
  const buildOneOnOneMember = ({ name, photoUrl, birthdate, gender, lifeStage, contactNumber, address, oneOnOneId, status }) => {
    const track = oneOnOneTrack();
    const trackStatus = { [track]: status };
    const classStatus = deriveClassStatusFromTracks(classes, trackStatus, null);
    const classIds = Object.keys(classStatus).filter((id) => classStatus[id] && classStatus[id] !== "Not Enrolled");
    if (oneOnOneClass) {
      classStatus[oneOnOneClass.id] = status;
      if (!classIds.includes(oneOnOneClass.id)) classIds.push(oneOnOneClass.id);
    }
    const trackBatch = oneOnOneClass ? { [track]: getBatchesForClass(oneOnOneClass, topics)[0] } : {};
    return {
      name, photoUrl: photoUrl || null,
      birthdate: birthdate || "", gender: gender || "", lifeStage: lifeStage || "", category: "", contactNumber: contactNumber || "", address: address || "", notes: "",
      classIds, classStatus, trackStatus, trackBatch,
      dateAdded: new Date(), source: "one2one", createdBy: currentEmail, oneOnOneId,
    };
  };
  // A new ONE2ONE person starts as status "pending" and gets no
  // Disciples record yet — a Leader/Manager has to approve them first
  // (see approveOneOnOnePerson below). Every "pending" check elsewhere
  // (Registrations tab list, nav badge count, card badge) matches this
  // string exactly, so it must be set here or the person silently never
  // shows up for approval. The ONE2ONE leader can still mark sessions
  // while pending (toggleOneOnOneSession handles that case by writing
  // only to this doc), so no progress is lost while waiting.
  const addOneOnOnePerson = ({ name, photoUrl, birthdate, gender, lifeStage, contactNumber, address }, createdByOverride) => {
    const personRef = db.collection("oneOnOne").doc();
    return personRef.set({ name, photoUrl: photoUrl || null, birthdate, gender, lifeStage, contactNumber, address, status: "pending", createdBy: createdByOverride || currentEmail, createdAt: new Date(), progress: {} })
      .then(() => {
        setAddOneOnOneOpen(false);
        // Immediately hand the leader this person's attendance QR — no
        // separate step to remember later. The code (see oneOnOneQrText)
        // works right away, even before a Leader/Manager approves them.
        setJustAddedOneOnOne({ id: personRef.id, name, photoUrl: photoUrl || null });
      })
      .catch((err) => showError("Could not add them. Error: " + err.message));
  };
  const updateOneOnOnePerson = async (id, { name, photoUrl, birthdate, gender, lifeStage, contactNumber, address }) => {
    try {
      const person = oneOnOneRaw.find((p) => p.id === id);
      const batch = db.batch();
      const details = { name, photoUrl: photoUrl || null, birthdate, gender, lifeStage, contactNumber, address };
      batch.update(db.collection("oneOnOne").doc(id), details);
      if (person && person.memberId) {
        const memberRef = db.collection("members").doc(person.memberId);
        if ((await memberRef.get()).exists) batch.update(memberRef, details);
      }
      await batch.commit();
      setEditingOneOnOne(null);
      showNotice("Saved.");
    } catch (err) {
      showError("Could not save the changes. Error: " + err.message);
    }
  };
  // Reassigns a ONE2ONE member to a different ONE2ONE leader by
  // changing createdBy — the field every filter/grouping above keys
  // off of (myOneOnOne, oneOnOneLeaderProfiles, the leader profile
  // view). Nothing else about the person or their progress changes.
  const moveOneOnOnePerson = async (person, newLeaderEmail) => {
    const target = normEmail(newLeaderEmail);
    if (!target || target === normEmail(person.createdBy)) return;
    if (!(await askConfirm({ title: "Move this ONE2ONE member?", message: `${person.name} will move to ${target}'s ONE2ONE tracker. Their session progress stays exactly as is.`, confirmLabel: "Move" }))) return;
    try {
      await db.collection("oneOnOne").doc(person.id).update({ createdBy: target });
      showNotice("Moved.");
    } catch (err) {
      showError("Could not move them. Error: " + err.message);
    }
  };
  const deleteOneOnOnePerson = async (id, name) => {
    if (!(await askConfirm({ title: "Remove from ONE2ONE?", message: `${name} and their ONE2ONE progress will be removed. Their record in the Disciples tab is kept.`, confirmLabel: "Remove", danger: true }))) return;
    db.collection("oneOnOne").doc(id).delete()
      .then(() => { setOpenOneOnOne(null); showNotice("Removed."); })
      .catch((err) => showError("Could not remove them. Error: " + err.message));
  };
  // Checking a ONE2ONE session also marks that session attended for the
  // linked Disciples member and keeps their ONE2ONE class status in sync
  // (0 done = Enrolled, some = In-Progress, all = Completed), leaving a
  // manually set Incomplete/Cancelled status alone — same rules as
  // toggleAttendance above. While the person is still "pending" approval
  // there's no Disciples member to sync yet, so the check is only saved
  // on their own oneOnOne doc; approveOneOnOnePerson replays every
  // conducted session into attendance once they're approved.
  const toggleOneOnOneSession = async (person, topicId, conducted) => {
    try {
      const batch = db.batch();
      batch.update(db.collection("oneOnOne").doc(person.id), { [`progress.${topicId}`]: { conducted, dateConducted: conducted ? new Date() : null } });

      // Once a ONE2ONE person has been approved they're also a real
      // Disciples member (person.memberId) enrolled in the ONE2ONE
      // class/track, so from that point on a session check here must
      // also land in "attendance" and update their track/class status —
      // exactly like checking/scanning a normal class session does (see
      // toggleAttendance) — or the Classes tab and their member profile
      // never see it. Before approval there's no member yet to sync to;
      // approveOneOnOnePerson replays whatever was checked while pending
      // into attendance at that point instead.
      if (person.status === "approved" && person.memberId) {
        const memberId = person.memberId;
        batch.set(db.collection("attendance").doc(`${memberId}_${topicId}`), { memberId, topicId, attended: conducted, dateAttended: conducted ? new Date() : null }, { merge: true });

        const member = members.find((m) => m.id === memberId);
        const track = oneOnOneTrack();
        const currentStatus = member && ((member.trackStatus && member.trackStatus[track]) || "Not Enrolled");
        const AUTO_STATUSES = ["Not Enrolled", "Enrolled", "In-Progress", "Completed"];
        if (member && AUTO_STATUSES.includes(currentStatus)) {
          const nextDone = oneOnOneSessions.filter((t) => {
            if (t.id === topicId) return conducted;
            return isOneOnOneSessionDone(person, t, attendanceByMember);
          }).length;
          let nextStatus = oneOnOneStatusFor(nextDone, oneOnOneSessions.length);
          if (nextDone === 0 && currentStatus === "Not Enrolled") nextStatus = "Not Enrolled";
          if (nextStatus !== currentStatus) {
            const nextTrackStatus = { ...(member.trackStatus || {}), [track]: nextStatus };
            const nextClassStatus = deriveClassStatusFromTracks(classes, nextTrackStatus, member.classStatus);
            const nextClassIds = Array.isArray(member.classIds) ? [...member.classIds] : [];
            if (oneOnOneClass && !nextClassIds.includes(oneOnOneClass.id)) nextClassIds.push(oneOnOneClass.id);
            batch.update(db.collection("members").doc(memberId), { trackStatus: nextTrackStatus, classStatus: nextClassStatus, classIds: nextClassIds });
          }
        }
      }

      await batch.commit();
    } catch (err) {
      showError("Could not save that. Error: " + err.message);
    }
  };
  // Approving a pending ONE2ONE person (Leaders/Managers only, from the
  // Registrations tab) is what actually creates — or, if merged, updates
  // — their Disciples record, and it happens no matter how long they sat
  // pending: every session already marked "conducted" on their oneOnOne
  // doc is replayed into attendance right here, so the class/status ends
  // up exactly where it would have if they'd been approved instantly.
  const STATUS_RANK = { "Not Enrolled": 0, "Enrolled": 1, "In-Progress": 2, "Completed": 3 };
  const AUTO_STATUSES = ["Not Enrolled", "Enrolled", "In-Progress", "Completed"];
  const approveOneOnOnePerson = async (person, mergeIntoMemberId) => {
    try {
      const personRef = db.collection("oneOnOne").doc(person.id);
      const total = oneOnOneSessions.length;
      const doneCount = oneOnOneSessions.filter((t) => isOneOnOneSessionDone(person, t, attendanceByMember)).length;
      const status = oneOnOneStatusFor(doneCount, total);
      let memberId;
      // Guard against double-approval: a fast double-tap (or any other
      // way this fires twice) used to be able to slip through before the
      // "Approve" button's disabled state applied, and each call created
      // its own brand-new member doc — two separate "rows" in Disciples,
      // both enrolled in the ONE2ONE class (so two rows in Classes too),
      // with only one of them ever getting linked back from the oneOnOne
      // doc. Doing the whole approval as one transaction — re-reading the
      // oneOnOne doc's live status first and aborting if it's already
      // been approved/rejected — makes this safe no matter how many
      // times it gets triggered, since only one transaction can win.
      const alreadyProcessed = await db.runTransaction(async (tx) => {
        const freshSnap = await tx.get(personRef);
        const freshStatus = (freshSnap.data() || {}).status;
        if (freshStatus && freshStatus !== "pending") return true;

        if (mergeIntoMemberId) {
          memberId = mergeIntoMemberId;
          const existing = members.find((m) => m.id === mergeIntoMemberId) || {};
          const track = oneOnOneTrack();
          const currentTrackStatus = (existing.trackStatus && existing.trackStatus[track]) || "Not Enrolled";
          const nextTrackStatus = { ...(existing.trackStatus || {}) };
          // Only move the track forward — never roll back a status the
          // member already reached some other way.
          if (!AUTO_STATUSES.includes(currentTrackStatus)) {
            // manual status (Incomplete/Cancelled/etc.) — leave it alone
          } else if (STATUS_RANK[status] > STATUS_RANK[currentTrackStatus]) {
            nextTrackStatus[track] = status;
          } else if (currentTrackStatus === "Not Enrolled") {
            nextTrackStatus[track] = status;
          }
          const nextClassStatus = deriveClassStatusFromTracks(classes, nextTrackStatus, existing.classStatus);
          const nextClassIds = Array.isArray(existing.classIds) ? [...existing.classIds] : [];
          if (oneOnOneClass) {

            if (!nextClassIds.includes(oneOnOneClass.id)) nextClassIds.push(oneOnOneClass.id);

          }
        });
        tx.update(personRef, { status: "approved", memberId, approvedAt: new Date(), approvedBy: currentEmail });
        return false;
      });
      if (alreadyProcessed) {
        showNotice("Already processed — no changes made.");
        return;
      }
      showNotice(mergeIntoMemberId ? "Approved and linked to their existing Disciples record." : "Approved — added to Disciples and synced to Classes.");

  // Reorders classes. The list is already sorted by "order"; after moving

  const moveClass = (id, action) => {
    const list = [...classes];
    const from = list.findIndex((c) => c.id === id);
    if (from < 0) return;
    let to = from;
    if (action === "first") to = 0;
    else if (action === "left") to = Math.max(0, from - 1);
    else if (action === "right") to = Math.min(list.length - 1, from + 1);
    if (to === from) return;
    const [item] = list.splice(from, 1);
    list.splice(to, 0, item);

    list.forEach((c, i) => {

  // Deletes any number of docs, split into batches (Firestore allows
  // at most 500 writes per batch).
  const deleteRefsInChunks = async (refs) => {

  // Same idea as deleteRefsInChunks but for updates — used when renaming
  // or deleting a batch, which can touch the class doc plus every
  // session and member in that batch in one atomic-per-chunk sweep.
  const commitWritesInChunks = async (writes) => {
    for (let i = 0; i < writes.length; i += 400) {

      await batch.commit();

  };
  // Topics store the class's name in their "class" field, and attendance

  // sessions and their attendance records. Children go first and the
  // class doc last, so if anything fails midway the class is still there
  // and the delete can simply be retried.
  const deleteClass = async (id) => {
    const classItem = classes.find((c) => c.id === id);
    const className = classItem ? classItem.name : "this class";
    const classTopics = classItem ? topics.filter((t) => t.class === classItem.name) : [];
    const topicIds = new Set(classTopics.map((t) => t.id));
    const classAttendance = attendanceDocs.filter((a) => topicIds.has(a.topicId));
    const ok = await askConfirm({
      title: "Delete class?",
      message: classTopics.length > 0
        ? `"${className}", its ${classTopics.length} session${classTopics.length === 1 ? "" : "s"}, and their attendance records will be deleted. This can't be undone.`
        : `"${className}" will be deleted. This can't be undone.`,
      confirmLabel: "Delete",
      danger: true,
    });
    if (!ok) return;
    try {
      await deleteRefsInChunks([
        ...classAttendance.map((a) => db.collection("attendance").doc(a.id)),

        db.collection("classes").doc(id),

  // Topics store the class's *name* (not id) in their "class" field, so
  // renaming a class has to cascade to every topic under it too — a
  // batch keeps the class doc and all its topic docs in sync atomically.
  const updateClass = (id, { name: newName, photoUrl }) => {
    const oldClass = classes.find((c) => c.id === id);
    const oldName = oldClass ? oldClass.name : null;
    const batch = db.batch();
    batch.update(db.collection("classes").doc(id), { name: newName, photoUrl: photoUrl || null });
    if (oldName && oldName !== newName) {

      .then(() => { setRenamingClass(null); showNotice("Class updated."); })
      .catch((err) => showError("Could not update the class. Error: " + err.message));

  const addTopic = (className, name, order, batch) => {
    db.collection("topics").add({ class: className, name, order, batch: batch || "Batch 1" })
      .then(() => showNotice("Session added."))
      .catch((err) => showError("Could not save the topic. Error: " + err.message));
  };
  // Adds a batch name to a class's "batches" list. Creating a batch
  // this way (rather than only ever implying one from a session's
  // "batch" field) is what lets a leader set up "Batch 2026" ahead of
  // time, before any sessions or members are attached to it.
  // Adds a batch name to a class's "batches" list. New batches start
  // with a copy of the sessions from the batch the leader was viewing
  // when they added it (same names, freshly unconducted, renumbered
  // 1..n) so the curriculum doesn't have to be retyped every time —
  // but never with any members or attendance; a batch always starts
  // with nobody enrolled and nothing marked attended.
  const addBatch = (classId, batchName, copyFromBatch) => {
    const name = (batchName || "").trim();
    if (!name) return;
    const classItem = classes.find((c) => c.id === classId);
    const existing = getBatchesForClass(classItem, topics);
    if (existing.includes(name)) { showError("That batch already exists."); return; }
    const sourceTopics = copyFromBatch
      ? sortTopicsForDisplay(topicsForClass(topics, classItem.name).filter((t) => topicBatch(t) === copyFromBatch))
      : [];
    const batch = db.batch();
    batch.update(db.collection("classes").doc(classId), { batches: [...(classItem.batches || []), name] });
    sourceTopics.forEach((t, i) => {
      batch.set(db.collection("topics").doc(), { class: classItem.name, name: t.name, order: i + 1, batch: name });
    });
    batch.commit()
      .then(() => showNotice(sourceTopics.length ? `Batch added with ${sourceTopics.length} session${sourceTopics.length === 1 ? "" : "s"} copied.` : "Batch added."))
      .catch((err) => showError("Could not add the batch. Error: " + err.message));
  };
  // Renaming a batch has to cascade like a class rename does: every
  // session in that batch gets the new batch label, and — for classes
  // that match one of the discipleship tracks — every member currently
  // parked in that batch gets their trackBatch label updated too. The
  // class doc's own "batches" list is updated (and the new name added
  // to it explicitly) so the batch keeps existing even if it's empty.
  const renameBatch = (classId, oldName, newName) => {
    const name = (newName || "").trim();
    if (!name) return;
    const classItem = classes.find((c) => c.id === classId);
    if (!classItem) return;
    if (name === oldName) { setRenamingBatch(null); return; }
    const existing = getBatchesForClass(classItem, topics);
    if (existing.includes(name)) { showError("That batch already exists."); return; }
    const track = trackNameForClass(classItem.name);
    const classTopics = topics.filter((t) => t.class === classItem.name && topicBatch(t) === oldName);
    const affectedMembers = track ? members.filter((m) => ((m.trackBatch && m.trackBatch[track]) || "Batch 1") === oldName) : [];
    const newBatchesList = (classItem.batches || []).map((b) => (b === oldName ? name : b));
    if (!newBatchesList.includes(name)) newBatchesList.push(name);
    const writes = [
      { ref: db.collection("classes").doc(classId), data: { batches: newBatchesList } },
      ...classTopics.map((t) => ({ ref: db.collection("topics").doc(t.id), data: { batch: name } })),
      ...affectedMembers.map((m) => ({ ref: db.collection("members").doc(m.id), data: { trackBatch: { ...(m.trackBatch || {}), [track]: name } } })),
    ];
    commitWritesInChunks(writes)
      .then(() => { setRenamingBatch(null); showNotice("Batch renamed."); })
      .catch((err) => showError("Could not rename the batch. Error: " + err.message));
  };
  // Deleting a batch removes its sessions and their attendance records

  const deleteBatch = async (classId, batchName) => {

    if (allBatches.length <= 1) { showError("A class needs at least one batch — add another batch before deleting this one."); return; }
    const track = trackNameForClass(classItem.name);

    const topicIds = new Set(batchTopics.map((t) => t.id));

    const affectedMembers = track ? members.filter((m) => ((m.trackBatch && m.trackBatch[track]) || "Batch 1") === batchName) : [];

  // Approving a pending self-registration either creates a brand-new
  // member (carrying over everything the person filled in) or, if the
  // leader picked a match, merges the requested class into an existing
  // member instead — so one person doesn't end up with two roster
  // entries just because they registered twice.
  //
  // The pendingRegistrations doc itself is kept (not deleted) and
  // stamped with status + memberId instead — that's what lets the
  // registrant's personal status.html link automatically reveal their
  // QR the moment this runs, with no extra step on their end.
  // Approving turns a form submission into real enrollment, so the
  // discipleship track(s) matching whatever class(es) the person
  // registered for are automatically stamped "Enrolled" right here —
  // no leader has to remember to flip a dropdown afterward. It only
  // ever moves a track forward out of "Not Enrolled"; a track that's
  // already further along (In-Progress, Completed, etc.) is left
  // untouched so re-approving/merging can't roll status backward.
  const trackStatusForNewEnrollments = (classIds, existingTrackStatus) => {
    const next = { ...(existingTrackStatus || {}) };
    (classIds || []).forEach((cid) => {
      const c = classes.find((cl) => cl.id === cid);
      const track = c && trackNameForClass(c.name);
      if (track && (!next[track] || next[track] === "Not Enrolled")) {
        next[track] = "Enrolled";

  };

  // carries that batch on the pending doc; approving it here is what
  // actually places the person in that batch instead of leaving them
  // to the "Batch 1" default. No batch on the pending doc (an older
  // link, or a class that never got extra batches) leaves trackBatch
  // untouched, same as before this feature existed.
  const trackBatchForNewEnrollments = (classIds, existingTrackBatch, batchLabel) => {
    if (!batchLabel) return existingTrackBatch || {};
    const next = { ...(existingTrackBatch || {}) };
    (classIds || []).forEach((cid) => {
      const c = classes.find((cl) => cl.id === cid);
      const track = c && trackNameForClass(c.name);
      if (track) next[track] = batchLabel;
    });
    return next;
  };
  // Guarded the same way as approveOneOnOnePerson below: a double-tap,
  // slow network, or any other way this fires twice used to be able to
  // create two separate Disciples rows for one registration, since the
  // member doc was created first and the pendingRegistrations doc was
  // only marked "approved" afterward — a second call in that window had
  // no way to know the first had already run. Re-reading the pending
  // doc's live status inside a transaction and aborting if it's already
  // been approved/rejected makes this safe no matter how many times it
  // fires, since only one transaction can win.
  const approveRegistration = async (pending, mergeIntoMemberId) => {
    try {
      const pendingRef = db.collection("pendingRegistrations").doc(pending.id);
      let memberId = mergeIntoMemberId;
      const alreadyProcessed = await db.runTransaction(async (tx) => {
        const freshSnap = await tx.get(pendingRef);
        const freshStatus = (freshSnap.data() || {}).status;
        if (freshStatus && freshStatus !== "pending") return true;

        if (mergeIntoMemberId) {
          const member = members.find((m) => m.id === mergeIntoMemberId);
          const existingClassIds = Array.isArray(member && member.classIds) ? member.classIds : [];
          const newlyGrantedClassIds = (pending.classIds || []).filter((id) => !existingClassIds.includes(id));
          const nextClassIds = Array.from(new Set([...existingClassIds, ...(pending.classIds || [])]));
          const nextTrackStatus = trackStatusForNewEnrollments(newlyGrantedClassIds, member && member.trackStatus);
          const nextTrackBatch = trackBatchForNewEnrollments(newlyGrantedClassIds, member && member.trackBatch, pending.batch);
          const nextClassStatus = deriveClassStatusFromTracks(classes, nextTrackStatus, member && member.classStatus);
          tx.update(db.collection("members").doc(mergeIntoMemberId), { classIds: nextClassIds, trackStatus: nextTrackStatus, trackBatch: nextTrackBatch, classStatus: nextClassStatus });
        } else {
          const { id, selfRegistered, status, batch, ...rest } = pending;
          const classIds = Array.isArray(pending.classIds) ? pending.classIds : [];
          const trackStatus = trackStatusForNewEnrollments(classIds, null);
          const trackBatch = trackBatchForNewEnrollments(classIds, null, batch);
          const classStatus = deriveClassStatusFromTracks(classes, trackStatus, null);
          const newMemberRef = db.collection("members").doc();
          memberId = newMemberRef.id;

    return <div style={styles.loadingScreen}>Loading…</div>;
  }
  if (!authUser || authUser.isAnonymous) {
    return <AuthScreen />;
  }

  return (
    <div style={styles.appWrap} className={introDone ? "" : "dj-app-enter"} onAnimationEnd={() => setIntroDone(true)}>
      <div style={styles.watermark} className="dj-watermark" aria-hidden="true">
        <img src={WATERMARK_IMG} alt="" style={styles.watermarkImg} />
      </div>
      <div ref={headerBarRef} style={styles.dashboardBar}>
        <header className="dj-header" style={styles.header}>
          <div className="dj-header-title" style={styles.headerBrand}>
            <img src={VICTORY_LOGO_DATA_URI} alt="Victory Alfonso" className="dj-header-logo" style={styles.headerLogo} />
            <div>
              <div className="dj-header-line1" style={styles.headerTitleLine1}>Victory Alfonso</div>
              <div className="dj-header-line2" style={styles.headerTitleLine2}>Discipleship Journey</div>
            </div>
          </div>
          <div style={styles.headerRight}>
            <span style={styles.headerUser} className="hide-mobile">
              {authUser.displayName || authUser.email}
              <span style={{ ...styles.roleBadge, ...(isLeader || isOneLeader ? styles.roleBadgeLeader : {}) }}>{isLeader ? "Leader" : isOneLeader ? "ONE2ONE Leader" : "Viewer"}</span>
            </span>
            <button className="dj-sign-out" style={styles.signOutBtn} onClick={() => auth.signOut()}>Sign out</button>
          </div>
        </header>

        <nav className="dj-nav" style={styles.nav}>
          {navPill && <div className="dj-nav-pill" style={{ ...styles.navPill, transform: `translateX(${navPill.left}px)`, width: navPill.width }} />}
          {!isOneOnly && <button ref={(el) => { navRefs.current.classes = el; }} className="nav-item" style={{ ...styles.navItem, ...(activeTab === "classes" ? styles.navItemActiveText : {}) }} onClick={() => { setTab("classes"); setOpenMember(null); setOpenMemberTrack(null); setOpenClass(null); setOpenTopic(null); }}>Classes</button>}
          {!isOneOnly && <button ref={(el) => { navRefs.current.roster = el; }} className="nav-item" style={{ ...styles.navItem, ...(activeTab === "roster" ? styles.navItemActiveText : {}) }} onClick={() => { setTab("roster"); setOpenMember(null); setOpenMemberTrack(null); setOpenClass(null); setOpenTopic(null); }}>Disciples</button>}
          {canUseOneOnOne && <button ref={(el) => { navRefs.current.one2one = el; }} className="nav-item" style={{ ...styles.navItem, ...(activeTab === "one2one" ? styles.navItemActiveText : {}) }} onClick={() => { setTab("one2one"); setOpenMember(null); setOpenMemberTrack(null); setOpenClass(null); setOpenTopic(null); setOpenOneOnOne(null); setOpenOneOnOneLeaderEmail(null); }}>ONE2ONE{oneOnOnePendingCount > 0 ? ` (${oneOnOnePendingCount})` : ""}</button>}
          {isLeader && (
            <button ref={(el) => { navRefs.current.registrations = el; }} className="nav-item" style={{ ...styles.navItem, ...(activeTab === "registrations" ? styles.navItemActiveText : {}) }} onClick={() => { setTab("registrations"); setOpenMember(null); setOpenMemberTrack(null); setOpenClass(null); setOpenTopic(null); }}>
              Registrations{(pendingRegistrations.length + pendingOneOnOnePeople.length) > 0 ? ` (${pendingRegistrations.length + pendingOneOnOnePeople.length})` : ""}
            </button>
          )}
          {isLeader && (
            <button ref={(el) => { navRefs.current.settings = el; }} className="nav-item" style={{ ...styles.navItem, ...(activeTab === "settings" ? styles.navItemActiveText : {}) }} onClick={() => { setTab("settings"); setOpenMember(null); setOpenMemberTrack(null); setOpenClass(null); setOpenTopic(null); }}>Settings</button>
          )}
        </nav>
      </div>

      <main className="dj-main" style={styles.main}>
        <div key={activeTab} className="dj-tab-enter">
        {activeTab === "registrations" && isLeader && (
          <>
            <PendingRegistrations
              pendingRegistrations={pendingRegistrations}
              classes={classes}
              members={members}
              onApprove={approveRegistration}
              onReject={rejectRegistration}
            />
            <PendingOneOnOne
              pendingOneOnOne={pendingOneOnOnePeople}
              sessions={oneOnOneSessions}
              attendanceByMember={attendanceByMember}
              members={members}
              onApprove={approveOneOnOnePerson}
              onReject={rejectOneOnOnePerson}
            />
          </>
        )}

        {activeTab === "roster" && (
          <Roster
            members={members}
            classes={classes}
            topics={topics}
            attendanceByMember={attendanceByMember}
            isLeader={isLeader}
            onOpen={(m) => openMemberInContext(m, null)}
            onAdd={() => setAddOpen(true)}
          />
        )}

        {activeTab === "classes" && !liveOpenClass && (
          <Classes
            classes={classes}
            topics={topics}
            members={members}
            attendanceByMember={attendanceByMember}
            isLeader={isLeader}
            onAddClass={addClass}
            onDeleteClass={deleteClass}
            onEditClass={setRenamingClass}
            onMoveClass={moveClass}
            onSeedDefaults={seedDefaultClasses}
            onOpenSession={setOpenTopic}
            onOpenClass={setOpenClass}
            onAddTopic={addTopic}
            onDeleteTopic={deleteTopic}
            onEditTopic={setRenamingTopic}
            onOpenMember={openMemberInContext}
            onAddBatch={addBatch}
            onRenameBatch={(classId, oldName) => setRenamingBatch({ classId, oldName })}
            onDeleteBatch={deleteBatch}
            onToggleConducted={toggleTopicConducted}
            onAddMember={addMember}
            onReorderTopics={reorderTopics}
          />
        )}

        {activeTab === "classes" && liveOpenClass && (
          <ClassOverview
            classItem={liveOpenClass}
            topics={topics}
            members={members}
            attendanceByMember={attendanceByMember}
            isLeader={isLeader}
            onBack={() => setOpenClass(null)}
            onOpenSession={setOpenTopic}
            onAddTopic={addTopic}
            onDeleteTopic={deleteTopic}
            onEditClass={setRenamingClass}
            onEditTopic={setRenamingTopic}
            onOpenMember={openMemberInContext}
            onAddBatch={addBatch}
            onRenameBatch={(classId, oldName) => setRenamingBatch({ classId, oldName })}
            onDeleteBatch={deleteBatch}
            onToggleConducted={toggleTopicConducted}
            onReorderTopics={reorderTopics}
          />
        )}

        {activeTab === "one2one" && isOneOnly && needsOwnProfile && (
          <OneOnOne
            people={myOneOnOne}
            onAdd={() => setAddOneOnOneOpen(true)}
            onOpen={setOpenOneOnOne}
            sessions={oneOnOneSessions}
            attendanceByMember={attendanceByMember}
            hasClass={!!oneOnOneClass}
            onEdit={setEditingOneOnOne}
            onDelete={deleteOneOnOnePerson}
            showAll={false}
            needsProfile={true}
            onCreateProfile={() => setCreatingOwnProfile(true)}
          />
        )}

        {activeTab === "one2one" && isOneOnly && !needsOwnProfile && (
          <OneOnOneOwnProfile
            leader={myOneLeaderDoc || { id: currentEmail, name: null, photoUrl: null }}
            people={myOneOnOne}
            sessions={oneOnOneSessions}
            attendanceByMember={attendanceByMember}
            hasClass={!!oneOnOneClass}
            coverPhotoUrl={oneOnOneClass?.photoUrl}
            onAdd={() => setAddOneOnOneOpen(true)}
            onOpen={setOpenOneOnOne}
            onEditPerson={setEditingOneOnOne}
            onDelete={deleteOneOnOnePerson}
            onEditProfile={() => setCreatingOwnProfile(true)}
            onToggleSession={toggleOneOnOneSession}
            leaderEmail={currentEmail}
          />
        )}

        {activeTab === "one2one" && !isOneOnly && !openOneOnOneLeaderProfile && (
          <OneOnOneLeaders
            leaders={oneOnOneLeaderProfiles}
            onOpenLeader={setOpenOneOnOneLeaderEmail}
            onEditLeader={setEditingOneOnOneLeader}
            onRemoveLeader={removeOneLeader}
          />
        )}

        {activeTab === "one2one" && !isOneOnly && openOneOnOneLeaderProfile && (
          <OneOnOneLeaderProfile
            leader={openOneOnOneLeaderProfile}
            people={myOneOnOne.filter((p) => normEmail(p.createdBy) === openOneOnOneLeaderProfile.id)}
            onAdd={() => setAddOneOnOneOpen(true)}
            onOpen={setOpenOneOnOne}
            sessions={oneOnOneSessions}
            attendanceByMember={attendanceByMember}
            hasClass={!!oneOnOneClass}
            onBack={() => setOpenOneOnOneLeaderEmail(null)}
            onEdit={setEditingOneOnOne}
            onDelete={deleteOneOnOnePerson}
            onToggleSession={toggleOneOnOneSession}
          />
        )}

        {activeTab === "settings" && isLeader && (
          <Settings
            leaders={leaders}
            currentEmail={currentEmail}
            onAddLeader={addLeader}
            onRemoveLeader={removeLeader}
            oneLeaders={oneLeaders}
            onAddOneLeader={addOneLeader}
            onRemoveOneLeader={removeOneLeader}
            admins={admins}
            isAdmin={isAdmin}
            onAddAdmin={addAdmin}
            onRemoveAdmin={removeAdmin}
          />
        )}
        </div>
      </main>

      {liveOpenTopic && (
        <SessionDetail
          topic={liveOpenTopic}
          classes={classes}
          members={members}
          attendanceByMember={attendanceByMember}
          isLeader={isLeader}
          onClose={() => setOpenTopic(null)}
          onToggleAttendance={toggleAttendance}
          onSetAttendanceDate={setAttendanceDate}
          onEditTopic={setRenamingTopic}
          onOpenMember={openMemberInContext}
          onToggleConducted={toggleTopicConducted}
        />
      )}

      {liveOpenMember && (
        <MemberProfile
          member={liveOpenMember}
          classes={classes}
          topics={topics}
          attendanceByMember={attendanceByMember}
          isLeader={isLeader}
          onBack={() => { setOpenMember(null); setOpenMemberTrack(null); }}
          onToggleAttendance={toggleAttendance}
          onSetAttendanceDate={setAttendanceDate}
          onDeleteMember={deleteMember}
          onEdit={() => setEditingMember(liveOpenMember)}
        />
      )}
      {addOpen && <AddMemberModal classes={classes} topics={topics} members={members} onClose={() => setAddOpen(false)} onSave={addMember} />}
      {liveOpenOneOnOne && (
        <OneOnOneDetailModal
          person={liveOpenOneOnOne}
          sessions={oneOnOneSessions}
          attendanceByMember={attendanceByMember}
          hasClass={!!oneOnOneClass}
          onClose={() => setOpenOneOnOne(null)}
          onEdit={setEditingOneOnOne}
          onToggleSession={toggleOneOnOneSession}
          isLeader={isLeader}
          leaderOptions={oneOnOneLeaderProfiles}
          onMove={moveOneOnOnePerson}
        />
      )}
      {addOneOnOneOpen && (
        <OneOnOneFormModal
          title="Add Member to ONE2ONE"
          submitLabel="Add"
          members={members}
          onClose={() => setAddOneOnOneOpen(false)}
          onSave={(data) => addOneOnOnePerson(data, isOneOnly ? null : openOneOnOneLeaderEmail)}
        />
      )}
      {editingOneOnOne && (
        <OneOnOneFormModal
          title="Edit ONE2ONE Member"
          initial={editingOneOnOne}
          onClose={() => setEditingOneOnOne(null)}
          onSave={(data) => updateOneOnOnePerson(editingOneOnOne.id, data)}
        />
      )}
      {justAddedOneOnOne && (
        <OneOnOneQrModal
          person={justAddedOneOnOne}
          title={`Added! Give ${justAddedOneOnOne.name} this QR code`}
          intro={`Provide this to the member — they'll present it at the start of every session so you (or another leader) can scan it here to mark their attendance.`}
          onClose={() => setJustAddedOneOnOne(null)}
        />
      )}
      {creatingOwnProfile && (
        <OneOnOneLeaderFormModal
          title={needsOwnProfile ? "Create Your ONE2ONE Profile" : "Edit Your ONE2ONE Profile"}
          initialEmail={currentEmail}
          initialName={myOneLeaderDoc && myOneLeaderDoc.name}
          initialPhoto={myOneLeaderDoc && myOneLeaderDoc.photoUrl}
          submitLabel={needsOwnProfile ? "Create Profile" : "Save"}
          onClose={() => setCreatingOwnProfile(false)}
          onSave={(data) => updateOneOnOneLeaderProfile(currentEmail, data)}
        />
      )}
      {editingOneOnOneLeader && (
        <OneOnOneLeaderFormModal
          title="Edit Leader Profile"
          initialEmail={editingOneOnOneLeader.id}
          initialName={editingOneOnOneLeader.name}
          initialPhoto={editingOneOnOneLeader.photoUrl}
          submitLabel="Save"
          onClose={() => setEditingOneOnOneLeader(null)}
          onSave={(data) => updateOneOnOneLeaderProfile(editingOneOnOneLeader.id, data)}
        />
      )}
      {editingMember && (
        <EditMemberModal
          member={editingMember}
          classes={classes}
          topics={topics}
          attendanceByMember={attendanceByMember}
          onClose={() => setEditingMember(null)}
          onSave={(data) => updateMember(editingMember.id, data)}
          onCompleteAllSessions={completeAllSessionsForClass}
          onUpdateSessionAttendance={updateSessionAttendanceForClass}
          initialTrack={openMemberTrack}
        />
      )}
      {renamingClass && (
        <ClassFormModal
          title="Edit Class"
          initialName={renamingClass.name}
          initialPhoto={renamingClass.photoUrl || null}
          onClose={() => setRenamingClass(null)}
          onSave={(data) => updateClass(renamingClass.id, data)}
        />
      )}
      {renamingTopic && (
        <RenameModal
          title="Edit Session Name"
          label="Session name"
          initialValue={renamingTopic.name}
          onClose={() => setRenamingTopic(null)}
          onSave={(name) => updateTopic(renamingTopic.id, name)}
        />
      )}
      {renamingBatch && (
        <RenameModal
          title="Rename Batch"
          label="Batch name"
          initialValue={renamingBatch.oldName}
          onClose={() => setRenamingBatch(null)}
          onSave={(name) => renameBatch(renamingBatch.classId, renamingBatch.oldName, name)}
        />
      )}
    </div>
  );
}
