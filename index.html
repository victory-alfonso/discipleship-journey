// ============================================================
// DONUT CHART — smooth SVG pie/donut used for per-class and
// overall attendance visuals ("demographic infographic" look)
// ============================================================

function polarToXY(cx, cy, r, angleDeg) {
  const a = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}

function annularSectorPath(cx, cy, rOuter, rInner, startAngle, endAngle) {
  const large = endAngle - startAngle > 180 ? 1 : 0;
  const p1 = polarToXY(cx, cy, rOuter, startAngle);
  const p2 = polarToXY(cx, cy, rOuter, endAngle);
  const p3 = polarToXY(cx, cy, rInner, endAngle);
  const p4 = polarToXY(cx, cy, rInner, startAngle);
  return [
    `M ${p1.x} ${p1.y}`,
    `A ${rOuter} ${rOuter} 0 ${large} 1 ${p2.x} ${p2.y}`,
    `L ${p3.x} ${p3.y}`,
    `A ${rInner} ${rInner} 0 ${large} 0 ${p4.x} ${p4.y}`,
    "Z",
  ].join(" ");
}

// Warm-to-navy palette used to color each attended session slice,
// echoing a multi-part infographic wheel.
const DJ_RING_PALETTE = ["#E5A430", "#DB8A2F", "#CC6A38", "#B85156", "#8C4E7E", "#5B4E9C", "#31488C", "#1F3864"];
function djRingColor(i, n) {
  if (n <= 1) return DJ_RING_PALETTE[0];
  const t = i / (n - 1);
  const idx = t * (DJ_RING_PALETTE.length - 1);
  const lo = Math.floor(idx), hi = Math.min(DJ_RING_PALETTE.length - 1, lo + 1), f = idx - lo;
  const c1 = DJ_RING_PALETTE[lo], c2 = DJ_RING_PALETTE[hi];
  const hex = (h) => [1, 3, 5].map((p) => parseInt(h.slice(p, p + 2), 16));
  const [r1, g1, b1] = hex(c1), [r2, g2, b2] = hex(c2);
  const mix = (a, b) => Math.round(a + (b - a) * f);
  return `rgb(${mix(r1, r2)}, ${mix(g1, g2)}, ${mix(b1, b2)})`;
}

// Segmented "pie" ring — one wedge per session, colored when
// attended and left pale when not, styled after a multi-part
// infographic wheel. Center shows the completed/total count.
function SessionRing({ sessions, size = 72, dark = false }) {
  const uid = useId();
  const filterId = `djRingShadow-${uid}`;
  const rOuter = size / 2;
  const rInner = rOuter * 0.58;
  const midR = (rOuter + rInner) / 2;
  const trackWidth = rOuter - rInner;

  const textColor = dark ? "#F5F2E4" : "#23211D";
  const subColor = dark ? "rgba(237,239,245,0.45)" : "#7A6E4E";
  const emptyTrackStroke = dark ? "rgba(255,255,255,0.14)" : "rgba(122,110,78,0.3)";
  const guideStroke = dark ? "rgba(255,255,255,0.08)" : "rgba(35,33,29,0.12)";
  const unattendedFill = dark ? "rgba(255,255,255,0.08)" : "#DCD2B0";
  const unattendedStroke = dark ? "rgba(255,255,255,0.14)" : "rgba(122,110,78,0.25)";

  if (sessions.length === 0) {
    return (
      <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          <circle
            className="dj-ring-wedge"
            cx={rOuter}
            cy={rOuter}
            r={midR}
            fill="none"
            stroke={emptyTrackStroke}
            strokeWidth={trackWidth}
            strokeDasharray="3 5.5"
            style={{ transformOrigin: `${rOuter}px ${rOuter}px` }}
          />
        </svg>
        <div className="dj-ring-center" style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
          <span style={{ fontFamily: "Georgia, serif", fontWeight: 700, color: textColor, fontSize: size * 0.24, lineHeight: 1 }}>0/0</span>
          <span style={{ fontSize: size * 0.1, color: subColor, marginTop: 2, textTransform: "uppercase", letterSpacing: 0.3 }}>no sessions</span>
        </div>
      </div>
    );
  }

  const n = sessions.length;
  const gapDeg = n > 1 ? 3.2 : 0;
  const step = 360 / n;
  const doneCount = sessions.filter((s) => s.attended).length;
  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <defs>
          <filter id={filterId} x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="1" stdDeviation="1.1" floodColor={dark ? "#000000" : "#23211D"} floodOpacity={dark ? 0.35 : 0.18} />
          </filter>
        </defs>
        <circle cx={rOuter} cy={rOuter} r={rOuter - 0.5} fill="none" stroke={guideStroke} strokeWidth="1" />
        <circle cx={rOuter} cy={rOuter} r={rInner} fill="none" stroke={guideStroke} strokeWidth="1" />
        {sessions.map((s, i) => {
          const start = i * step + gapDeg / 2;
          const end = (i + 1) * step - gapDeg / 2;
          const fill = s.attended ? djRingColor(i, n) : unattendedFill;
          return (
            <path
              key={s.id || i}
              className="dj-ring-wedge"
              d={annularSectorPath(rOuter, rOuter, rOuter - 0.5, rInner, start, end)}
              fill={fill}
              stroke={s.attended ? "none" : unattendedStroke}
              strokeWidth={s.attended ? 0 : 0.75}
              filter={s.attended ? `url(#${filterId})` : undefined}
              style={{ transformOrigin: `${rOuter}px ${rOuter}px`, animationDelay: `${i * 40}ms` }}
            />
          );
        })}
      </svg>
      <div className="dj-ring-center" style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", animationDelay: `${n * 40 + 80}ms` }}>
        <span style={{ fontFamily: "Georgia, serif", fontWeight: 700, color: textColor, fontSize: size * 0.24, lineHeight: 1 }}>{doneCount}/{sessions.length}</span>
        <span style={{ fontSize: size * 0.1, color: subColor, marginTop: 2, textTransform: "uppercase", letterSpacing: 0.3 }}>done</span>
      </div>
    </div>
  );
}

// Proportional "demographics" ring — one wedge per category, sized
// by how many members fall into it (not equal-width like SessionRing),
// styled after the holographic population-breakdown HUDs from the
// Iron Man movies. Wedges sweep in with a staggered pop-in animation.
function DemographicsRing({ segments, total, size = 220, dark = true, centerLabel, centerSub }) {
  const uid = useId();
  const filterId = `djDemoShadow-${uid}`;
  const rOuter = size / 2;
  const rInner = rOuter * 0.6;
  const midR = (rOuter + rInner) / 2;
  const trackWidth = rOuter - rInner;

  const textColor = dark ? "#F5F2E4" : "#23211D";
  const subColor = dark ? "rgba(237,239,245,0.55)" : "#7A6E4E";
  const guideStroke = dark ? "rgba(255,255,255,0.1)" : "rgba(35,33,29,0.12)";

  if (!segments.length || !total) {
    return (
      <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
          <circle
            className="dj-ring-wedge"
            cx={rOuter}
            cy={rOuter}
            r={midR}
            fill="none"
            stroke={guideStroke}
            strokeWidth={trackWidth}
            strokeDasharray="3 5.5"
            style={{ transformOrigin: `${rOuter}px ${rOuter}px` }}
          />
        </svg>
        <div className="dj-ring-center" style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
          <span style={{ fontFamily: "Georgia, serif", fontWeight: 700, color: textColor, fontSize: size * 0.13, textAlign: "center", padding: "0 12px" }}>No data yet</span>
        </div>
      </div>
    );
  }

  const gapDeg = segments.length > 1 ? 2.6 : 0;
  let cursor = 0;
  const arcs = segments.map((s, i) => {
    const sweep = (s.count / total) * 360;
    const start = cursor + gapDeg / 2;
    const end = cursor + Math.max(sweep - gapDeg, 0);
    cursor += sweep;
    const pct = Math.round((s.count / total) * 100);
    return { ...s, start, end: Math.max(end, start + 0.001), i, pct };
  });

  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <defs>
          <filter id={filterId} x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="2" stdDeviation="2.4" floodColor="#000000" floodOpacity={dark ? 0.4 : 0.18} />
          </filter>
        </defs>
        <circle cx={rOuter} cy={rOuter} r={rOuter - 0.5} fill="none" stroke={guideStroke} strokeWidth="1" />
        <circle cx={rOuter} cy={rOuter} r={rInner} fill="none" stroke={guideStroke} strokeWidth="1" />
        {arcs.map((s) => (
          <path
            key={s.label}
            className="dj-ring-wedge"
            d={annularSectorPath(rOuter, rOuter, rOuter - 0.5, rInner, s.start, s.end)}
            fill={s.color}
            filter={`url(#${filterId})`}
            style={{ transformOrigin: `${rOuter}px ${rOuter}px`, animationDelay: `${s.i * 110}ms` }}
          />
        ))}
        {arcs.map((s) => {
          if (s.pct < 6) return null;
          const mid = (s.start + s.end) / 2;
          const p = polarToXY(rOuter, rOuter, midR, mid);
          return (
            <text
              key={`${s.label}-pct`}
              className="dj-ring-center"
              x={p.x}
              y={p.y}
              textAnchor="middle"
              dominantBaseline="central"
              style={{
                fontFamily: "system-ui, sans-serif",
                fontWeight: 800,
                fontSize: size * 0.075,
                fill: "#FFFFFF",
                paintOrder: "stroke",
                stroke: "rgba(0,0,0,0.35)",
                strokeWidth: 3,
                strokeLinejoin: "round",
                animationDelay: `${s.i * 110 + 200}ms`,
              }}
            >
              {s.pct}%
            </text>
          );
        })}
      </svg>
      <div className="dj-ring-center" style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", animationDelay: `${arcs.length * 110 + 120}ms` }}>
        <span style={{ fontSize: size * 0.06, color: subColor, textTransform: "uppercase", letterSpacing: 0.5 }}>{centerSub}</span>
        <span style={{ fontFamily: "Georgia, serif", fontWeight: 700, color: textColor, fontSize: size * 0.19, lineHeight: 1.15, marginTop: 3 }}>{centerLabel}</span>
      </div>
    </div>
  );
}

function DonutChart({ pct, size = 64, stroke = 8, label, sublabel, trackColor, dark = false }) {
  const clamped = Math.max(0, Math.min(100, Math.round(pct)));
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const dash = (clamped / 100) * c;
  const gradId = "djDonutGrad";
  const resolvedTrack = trackColor || (dark ? "rgba(255,255,255,0.1)" : "#EFE7D3");
  const textColor = dark ? "#F5F2E4" : "#23211D";
  const subColor = dark ? "rgba(237,239,245,0.45)" : "#7A6E4E";
  return (
    <div style={{ position: "relative", width: size, height: size, flexShrink: 0 }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ transform: "rotate(-90deg)" }}>
        <defs>
          <linearGradient id={gradId} x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#E5A430" />
            <stop offset="100%" stopColor="#1F3864" />
          </linearGradient>
        </defs>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={resolvedTrack} strokeWidth={stroke} />
        {clamped > 0 && (
          <circle
            cx={size / 2}
            cy={size / 2}
            r={r}
            fill="none"
            stroke={`url(#${gradId})`}
            strokeWidth={stroke}
            strokeLinecap="round"
            strokeDasharray={`${dash} ${c - dash}`}
            style={{ transition: "stroke-dasharray 0.4s ease" }}
          />
        )}
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
        <span style={{ fontFamily: "Georgia, serif", fontWeight: 700, color: textColor, fontSize: size * 0.26, lineHeight: 1 }}>{label != null ? label : `${clamped}%`}</span>
        {sublabel && <span style={{ fontSize: size * 0.13, color: subColor, marginTop: 2 }}>{sublabel}</span>}
      </div>
    </div>
  );
}

// ============================================================
// QR CODE — renders a scannable QR for a member's ID. Every
// member gets one code per member (not per session) — the
// leader scans it during whichever session is open to mark
// that member present for that session.
// ============================================================

function memberQrText(memberId) {
  return `DJMEMBER:${memberId}`;
}

// ONE2ONE members get their own QR scheme, keyed to their oneOnOne doc
// id rather than a Disciples memberId — this lets the code work the
// moment someone registers (see register.html), before any Leader/
// Manager has approved them into Disciples.
function oneOnOneQrText(oneOnOneId) {
  return `DJONE2ONE:${oneOnOneId}`;
}

function QrCode({ text, size = 220 }) {
  const boxRef = useRef(null);
  const qrRef = useRef(null);

  useEffect(() => {
    if (!boxRef.current || typeof QRCode === "undefined") return;
    if (!qrRef.current) {
      boxRef.current.innerHTML = "";
      qrRef.current = new QRCode(boxRef.current, {
        text,
        width: size,
        height: size,
        correctLevel: QRCode.CorrectLevel.M,
      });
    } else {
      qrRef.current.makeCode(text);
    }
  }, [text, size]);

  return <div ref={boxRef} style={{ display: "inline-block", background: "#FFFFFF", padding: 10, borderRadius: 10 }} />;
}

// Shows one member's personal QR code full-size — the leader
// prints it, or shares the image straight to the member's phone
// (SMS/Messenger/email), since members don't have app logins.
function MemberQrModal({ member, onClose }) {
  const qrWrapRef = useRef(null);
  const [shareState, setShareState] = useState("idle"); // idle | sharing | unsupported

  function getCanvas() {
    return qrWrapRef.current ? qrWrapRef.current.querySelector("canvas") : null;
  }

  async function shareQr() {
    const canvas = getCanvas();
    if (!canvas) return;
    canvas.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], `${member.name}-QR.png`, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        setShareState("sharing");
        try {
          await navigator.share({ files: [file], title: `${member.name} — Attendance QR` });
        } catch (err) {
          // user cancelled — no-op
        } finally {
          setShareState("idle");
        }
      } else {
        // Desktop / unsupported browsers: fall back to a plain download
        // the leader can then attach manually in Messenger, email, etc.
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${member.name}-QR.png`;
        a.click();
        URL.revokeObjectURL(url);
      }
    }, "image/png");
  }

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div style={styles.modalCard} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalTitle}>Attendance QR — {member.name}</div>
        <div className="qr-print-area" style={{ textAlign: "center", padding: "6px 0 14px" }} ref={qrWrapRef}>
          <QrCode text={memberQrText(member.id)} size={220} />
          <div style={{ marginTop: 10, fontWeight: 700, color: "#23211D" }}>{member.name}</div>
        </div>
        <div style={{ ...styles.pairNote, textAlign: "center" }}>
          Since members don't have accounts, send or print this QR code for them — they'll show it to the leader at every class.
        </div>
        <div style={{ ...styles.modalActions, justifyContent: "center" }} className="no-print">
          <button style={styles.modalCancelBtn} onClick={shareQr} disabled={shareState === "sharing"}>
            {shareState === "sharing" ? "Opening…" : "Send to member"}
          </button>
          <button style={styles.modalCancelBtn} onClick={() => window.print()}>Print</button>
          <button style={styles.modalConfirmBtn} onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

// Same idea as MemberQrModal, but for a ONE2ONE person — the QR
// encodes their oneOnOne doc id (see oneOnOneQrText) so it works
// whether or not they've been approved into Disciples yet.
function OneOnOneQrModal({ person, onClose, title, intro }) {
  const qrWrapRef = useRef(null);
  const [shareState, setShareState] = useState("idle"); // idle | sharing | unsupported

  function getCanvas() {
    return qrWrapRef.current ? qrWrapRef.current.querySelector("canvas") : null;
  }

  async function shareQr() {
    const canvas = getCanvas();
    if (!canvas) return;
    canvas.toBlob(async (blob) => {
      if (!blob) return;
      const file = new File([blob], `${person.name}-QR.png`, { type: "image/png" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        setShareState("sharing");
        try {
          await navigator.share({ files: [file], title: `${person.name} — ONE2ONE Attendance QR` });
        } catch (err) {
          // user cancelled — no-op
        } finally {
          setShareState("idle");
        }
      } else {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `${person.name}-QR.png`;
        a.click();
        URL.revokeObjectURL(url);
      }
    }, "image/png");
  }

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div style={styles.modalCard} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalTitle}>{title || `ONE2ONE Attendance QR — ${person.name}`}</div>
        <div className="qr-print-area" style={{ textAlign: "center", padding: "6px 0 14px" }} ref={qrWrapRef}>
          <QrCode text={oneOnOneQrText(person.id)} size={220} />
          <div style={{ marginTop: 10, fontWeight: 700, color: "#23211D" }}>{person.name}</div>
        </div>
        <div style={{ ...styles.pairNote, textAlign: "center" }}>
          {intro || "Send or print this QR code — the leader scans it each session to mark attendance. It works even while approval is still pending."}
        </div>
        <div style={{ ...styles.modalActions, justifyContent: "center" }} className="no-print">
          <button style={styles.modalCancelBtn} onClick={shareQr} disabled={shareState === "sharing"}>
            {shareState === "sharing" ? "Opening…" : "Send to member"}
          </button>
          <button style={styles.modalCancelBtn} onClick={() => window.print()}>Print</button>
          <button style={styles.modalConfirmBtn} onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

// Camera-based QR scanner used by leaders to auto-mark
// attendance during a session: point the camera at a member's
// QR code and they're checked in instantly.
function ScanAttendanceModal({ topic, members, attendanceByMember, onToggleAttendance, onClose }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const rafRef = useRef(null);
  const lastScanRef = useRef({ id: null, at: 0 });
  const [status, setStatus] = useState({ type: "idle", text: "Point the camera at the member's QR code." });
  const [error, setError] = useState("");
  const [toast, setToast] = useState(null);
  const [toastLeaving, setToastLeaving] = useState(false);
  const toastTimerRef = useRef(null);
  const toastLeaveTimerRef = useRef(null);

  const membersById = useMemo(() => {
    const map = {};
    members.forEach((m) => { map[m.id] = m; });
    return map;
  }, [members]);

  useEffect(() => {
    document.body.classList.add("dj-scanning");
    return () => document.body.classList.remove("dj-scanning");
  }, []);

  // Friendlier, cause-specific copy for the handful of ways
  // getUserMedia can fail, so "Try Again" actually tells the person
  // what to go fix instead of repeating a raw browser error.
  function cameraErrorMessage(err) {
    if (err && err.name === "NotAllowedError") {
      return "Camera access was blocked. Allow camera access for this site in your browser settings, then try again.";
    }
    if (err && (err.name === "NotFoundError" || err.name === "OverconstrainedError")) {
      return "No camera was found on this device. You can still mark attendance from the session list instead.";
    }
    if (err && err.name === "NotReadableError") {
      return "The camera is already in use by another app. Close it and try again.";
    }
    return "Unable to access the camera. " + ((err && err.message) || "Please try again.");
  }

  // Pulled out of the mount effect so the "Try Again" button can call
  // this exact same start-up sequence again after a failure, instead
  // of forcing the person to close and reopen the whole scan modal.
  const cancelledRef = useRef(false);
  const startCamera = useCallback(async () => {
    setError("");
    // A retry after a previous failure may be starting from a clean
    // slate (no prior stream) — stop anything still running first so
    // we never end up with two camera streams or two tick loops.
    if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
    if (streamRef.current) { streamRef.current.getTracks().forEach((t) => t.stop()); streamRef.current = null; }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      if (cancelledRef.current) { stream.getTracks().forEach((t) => t.stop()); return; }
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
      }
      tick();
    } catch (err) {
      if (!cancelledRef.current) setError(cameraErrorMessage(err));
    }
  }, []);

  function tick() {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if (!video || !canvas || typeof jsQR === "undefined") {
      rafRef.current = requestAnimationFrame(tick);
      return;
    }
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data) {
        handleScan(code.data);
      }
    }
    rafRef.current = requestAnimationFrame(tick);
  }

  useEffect(() => {
    cancelledRef.current = false;
    startCamera();
    return () => {
      cancelledRef.current = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function playSuccessBeep() {
    // A short two-note chime in the spirit of iOS's message-sent tone.
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const notes = [
        { freq: 1108.73, start: 0, dur: 0.11 },   // C#6
        { freq: 1479.98, start: 0.09, dur: 0.16 }, // F#6
      ];
      notes.forEach(({ freq, start, dur }) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        const t0 = ctx.currentTime + start;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.55, t0 + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      });
      setTimeout(() => ctx.close(), 400);
    } catch (e) {
      // Web Audio not available — fail silently.
    }
  }

  function showSuccessToast(text) {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    if (toastLeaveTimerRef.current) clearTimeout(toastLeaveTimerRef.current);
    setToastLeaving(false);
    setToast(text);
    toastTimerRef.current = setTimeout(() => {
      setToastLeaving(true);
      toastLeaveTimerRef.current = setTimeout(() => {
        setToast(null);
        setToastLeaving(false);
      }, 220);
    }, 1800);
  }

  useEffect(() => {
    return () => {
      if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
      if (toastLeaveTimerRef.current) clearTimeout(toastLeaveTimerRef.current);
    };
  }, []);

  function handleScan(text) {
    if (!text.startsWith("DJMEMBER:")) return;
    const memberId = text.slice("DJMEMBER:".length);
    const now = Date.now();
    if (lastScanRef.current.id === memberId && now - lastScanRef.current.at < 3000) return;
    lastScanRef.current = { id: memberId, at: now };

    const member = membersById[memberId];
    if (!member) {
      setStatus({ type: "error", text: "Unrecognized QR code. This isn't a member of Disciples." });
      return;
    }
    const scannedAt = new Date();
    const already = !!((attendanceByMember[memberId] || {})[topic.id] || {}).attended;
    onToggleAttendance(memberId, topic.id, true);
    setStatus({
      type: "ok",
      text: already
        ? `${member.name} — already marked present, ${fmtDateTime(scannedAt)}.`
        : `${member.name} — marked present, ${fmtDateTime(scannedAt)}.`,
    });
    if (navigator.vibrate) navigator.vibrate(120);
    playSuccessBeep();
    showSuccessToast(
      already
        ? `${member.name} was already marked present.`
        : `${member.name} has been marked present.`
    );
  }

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <div style={{ ...styles.modalCard, maxWidth: 420 }} onClick={(e) => e.stopPropagation()}>
        <div style={styles.modalTitle}>Scan Attendance — {topic.name}</div>
        {error ? (
          <div>
            <div style={styles.authError}>{error}</div>
            <div style={{ ...styles.modalActions, justifyContent: "center", marginTop: 0 }}>
              <button type="button" style={styles.modalConfirmBtn} onClick={startCamera}>Try Again</button>
            </div>
          </div>
        ) : (
          <div style={{ position: "relative", borderRadius: 12, overflow: "hidden", background: "#000" }}>
            <video ref={videoRef} playsInline muted style={{ width: "100%", display: "block" }} />
            <canvas ref={canvasRef} style={{ display: "none" }} />
            {toast && (
              <div
                className={`dj-ios-toast${toastLeaving ? " dj-toast-leaving" : ""}`}
                onClick={(e) => e.stopPropagation()}
                style={{
                  position: "absolute",
                  top: "50%",
                  left: "50%",
                  zIndex: 20,
                  width: "min(88%, 340px)",
                  display: "flex",
                  alignItems: "center",
                  gap: 12,
                  padding: "16px 18px",
                  borderRadius: 18,
                  background: "rgba(28,28,30,0.92)",
                  backdropFilter: "blur(14px)",
                  WebkitBackdropFilter: "blur(14px)",
                  boxShadow: "0 10px 30px rgba(0,0,0,0.4), 0 1px 0 rgba(255,255,255,0.06) inset",
                }}
              >
                <div
                  className="dj-toast-check"
                  style={{
                    flex: "0 0 auto",
                    width: 36,
                    height: 36,
                    borderRadius: "50%",
                    background: "#34C759",
                    display: "flex",
                    alignItems: "center",
                    justifyContent: "center",
                  }}
                >
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="none">
                    <path d="M4 12.5L9.5 18L20 6" stroke="#fff" strokeWidth="3.2" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                </div>
                <div style={{ minWidth: 0 }}>
                  <div style={{ color: "#fff", fontSize: 17, fontWeight: 800, letterSpacing: 0.1 }}>Attendance Marked</div>
                  <div
                    style={{
                      color: "rgba(255,255,255,0.9)",
                      fontSize: 14.5,
                      fontWeight: 600,
                      lineHeight: 1.3,
                    }}
                  >
                    {toast}
                  </div>
                </div>
              </div>
            )}
          </div>
        )}
        <div
          style={{
            marginTop: 12,
            padding: "10px 12px",
            borderRadius: 8,
            fontSize: 13.5,
            fontWeight: 600,
            textAlign: "center",
            background: status.type === "ok" ? "#DCE7D4" : status.type === "error" ? "#F3E4DF" : "#F6F1E4",
            color: status.type === "ok" ? "#385026" : status.type === "error" ? "#A6402F" : "#7A6E4E",
          }}
        >
          {status.text}
        </div>
        <div style={{ ...styles.modalActions, justifyContent: "center" }}>
          <button style={styles.modalConfirmBtn} onClick={onClose}>Done / Close</button>
        </div>
      </div>
    </div>
  );
}

// A ONE2ONE leader's own scanner (ONE2ONE tab → their profile → "Scan
// Attendance"). Same camera/QR-reading approach as ScanAttendanceModal,
// but reads the "DJONE2ONE:<id>" codes register.html hands out and
// only recognizes people in "people" — i.e. only members under this
// leader (or, when a Leader/Manager opens it from someone else's
// profile, only that leader's people) — so a code from a different
// leader's roster doesn't silently get scanned against the wrong
// tracker. A session must be picked first since attendance here is
// tracked per ONE2ONE session, not per member.
function ScanOneOnOneAttendanceModal({ sessions, people, attendanceByMember, onToggleSession, onClose }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const rafRef = useRef(null);
  const lastScanRef = useRef({ id: null, at: 0 });
  const [topicId, setTopicId] = useState(sessions[0] ? sessions[0].id : "");
  const [status, setStatus] = useState({ type: "idle", text: "Point the camera at the member's QR code." });
  const [error, setError] = useState("");
  const [toast, setToast] = useState(null);
  const [toastLeaving, setToastLeaving] = useState(false);
  const toastTimerRef = useRef(null);
  const toastLeaveTimerRef = useRef(null);

  const peopleById = useMemo(() => {
    const map = {};
    people.forEach((p) => { map[p.id] = p; });
    return map;
  }, [people]);
  const topic = sessions.find((t) => t.id === topicId) || null;

  // The camera loop below (tick -> handleScan) keeps re-scheduling
  // itself via requestAnimationFrame starting from the very first
  // call, so it forever runs with whatever "topic" was captured at
  // that moment — switching the session dropdown while scanning
  // never reached it, and every scan kept marking attendance for
  // whichever session was selected when the camera first started.
  // Mirroring the current topic into a ref lets handleScan always
  // read the session the leader has picked right now.
  const topicRef = useRef(topic);
  useEffect(() => { topicRef.current = topic; }, [topic]);

  useEffect(() => {
    document.body.classList.add("dj-scanning");
    return () => document.body.classList.remove("dj-scanning");
  }, []);

  function cameraErrorMessage(err) {
    if (err && err.name === "NotAllowedError") {
      return "Camera access was blocked. Allow camera access for this site in your browser settings, then try again.";
    }
    if (err && (err.name === "NotFoundError" || err.name === "OverconstrainedError")) {
      return "No camera was found on this device. You can still mark attendance from the member's detail view instead.";
    }
    if (err && err.name === "NotReadableError") {
      return "The camera is already in use by another app. Close it and try again.";
    }
    return "Unable to access the camera. " + ((err && err.message) || "Please try again.");
  }

  const cancelledRef = useRef(false);
  const startCamera = useCallback(async () => {
    setError("");
    if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current = null; }
    if (streamRef.current) { streamRef.current.getTracks().forEach((t) => t.stop()); streamRef.current = null; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      if (cancelledRef.current) { stream.getTracks().forEach((t) => t.stop()); return; }
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
      }
      tick();
    } catch (err) {
      if (!cancelledRef.current) setError(cameraErrorMessage(err));
    }
  }, []);

  function tick() {
    const video = videoRef.current;
    const canvas = canvasRef.current;
    if (!video || !canvas || typeof jsQR === "undefined") {
      rafRef.current = requestAnimationFrame(tick);
      return;
    }
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code && code.data) {
        handleScan(code.data);
      }
    }
    rafRef.current = requestAnimationFrame(tick);
  }

  useEffect(() => {
    cancelledRef.current = false;
    startCamera();
    return () => {
      cancelledRef.current = true;
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function playSuccessBeep() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      const ctx = new Ctx();
      const notes = [
        { freq: 1108.73, start: 0, dur: 0.11 },
        { freq: 1479.98, start: 0.09, dur: 0.16 },
      ];
      notes.forEach(({ freq, start, dur }) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        const t0 = ctx.currentTime + start;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(0.55, t0 + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      });
      setTimeout(() => ctx.close(), 400);
    } catch (e) {
      // Web Audio not available — fail silently.
    }
  }

  function showSuccessToast(text) {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    if (toastLeaveTimerRef.current) clearTimeout(toastLeaveTimerRef.current);
    setToastLeaving(false);
    setToast(text);
    toastTimerRef.current = setTimeout(() => {
      setToastLeaving(true);
      toastLeaveTimerRef.current = setTimeout(() => {
        setToast(null);
        setToastLeaving(false);
      }, 220);
    }, 1800);
  }

  useEffect(() => {
    return () => {
      if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
      if (toastLeaveTimerRef.current) clearTimeout(toastLeaveTimerRef.current);
    };
  }, []);

  function handleScan(text) {
    if (!text.startsWith("DJONE2ONE:")) return;
    const currentTopic = topicRef.current;
    if (!currentTopic) return;
    const personId = text.slice("DJONE2ONE:".length);
    const now = Date.now();
    if (lastScanRef.current.id === personId && now - lastScanRef.current.at < 3000) return;
    lastScanRef.current = { id: personId, at: now };

    const person = peopleById[personId];
    if (!person) {
      setStatus({ type: "error", text: "Unrecognized QR code. This isn't one of your ONE2ONE members." });
      return;

    const already = isOneOnOneSessionDone(person, currentTopic, attendanceByMember);
    onToggleSession(person, currentTopic.id, true);
    setStatus({

      text: already
        ? `${person.name} — already marked present, ${fmtDateTime(scannedAt)}.`

    if (navigator.vibrate) navigator.vibrate(120);

            <div style={{ ...styles.modalActions, justifyContent: "center", marginTop: 0 }}>

                  </svg>

                <div style={{ minWidth: 0 }}>
                  <div style={{ color: "#fff", fontSize: 17, fontWeight: 800, letterSpacing: 0.1 }}>Attendance Marked</div>
                  <div style={{ color: "rgba(255,255,255,0.9)", fontSize: 14.5, fontWeight: 600, lineHeight: 1.3 }}>{toast}</div>
                </div>
              </div>
            )}
          </div>
        ))}
        {sessions.length > 0 && (
          <div
            style={{
              marginTop: 12, padding: "10px 12px", borderRadius: 8, fontSize: 13.5, fontWeight: 600, textAlign: "center",
              background: status.type === "ok" ? "#DCE7D4" : status.type === "error" ? "#F3E4DF" : "#F6F1E4",
              color: status.type === "ok" ? "#385026" : status.type === "error" ? "#A6402F" : "#7A6E4E",
            }}
          >
            {status.text}
          </div>
        )}
        <div style={{ ...styles.modalActions, justifyContent: "center" }}>
          <button style={styles.modalConfirmBtn} onClick={onClose}>Done / Close</button>
        </div>
      </div>
    </div>
  );
}

function Roster({ members, classes, topics, attendanceByMember, isLeader, onOpen, onAdd }) {
  const [printAllOpen, setPrintAllOpen] = useState(false);
  const [query, setQuery] = useState("");
  const [lifeStageFilter, setLifeStageFilter] = useState("");
  const [genderFilter, setGenderFilter] = useState("");
  const [categoryFilter, setCategoryFilter] = useState("");
  const [minAge, setMinAge] = useState("");
  const [maxAge, setMaxAge] = useState("");
  const [trackChips, setTrackChips] = useState([]); // multi-select array of DISCIPLESHIP_TRACKS
  const [batchChip, setBatchChip] = useState("");      // batch label, only used when exactly one track is selected
  const [sortCol, setSortCol] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const [csvBusy, setCsvBusy] = useState(false);
  const csvFileInputRef = useRef(null);

  const exportCsv = () => {
    const text = buildMembersCsvText(members);
    const stamp = new Date().toISOString().slice(0, 10);
    downloadTextFile(`disciples-${stamp}.csv`, text);
  };
  const triggerImportCsv = () => { if (csvFileInputRef.current) csvFileInputRef.current.value = ""; csvFileInputRef.current && csvFileInputRef.current.click(); };
  const handleCsvFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const parsedRows = parseMembersCsvRows(text);
      if (parsedRows.length === 0) { showError("That file doesn't look like a Disciples CSV — no data rows found."); return; }
      if (!(await askConfirm({
        title: "Import CSV?",
        message: `This will sync ${parsedRows.length} row${parsedRows.length === 1 ? "" : "s"}: rows whose ID (or exact name) matches an existing Disciple update them, everything else is added as new. Continue?`,
        confirmLabel: "Import",
      }))) return;
      setCsvBusy(true);
      const { created, updated, skipped } = await importMembersCsv(parsedRows, members, classes);
      showNotice(`Imported: ${created} added, ${updated} updated${skipped ? `, ${skipped} skipped` : ""}.`);
    } catch (err) {
      showError("Could not import that CSV. Error: " + err.message);
    } finally {
      setCsvBusy(false);
    }
  };

  const toggleTrackChip = (t) => {
    setTrackChips((prev) => (prev.includes(t) ? prev.filter((x) => x !== t) : [...prev, t]));
    setBatchChip("");
  };

  // Distinct batch labels currently in use, but scoped only to when
  // exactly one track is selected (to avoid confusion about which
  // batch list to show when multiple tracks are selected).
  const singleTrackChip = trackChips.length === 1 ? trackChips[0] : null;
  const batchOptionsForTrackChip = singleTrackChip
    ? Array.from(new Set(members.map((m) => (m.trackBatch && m.trackBatch[singleTrackChip]) || "").filter(Boolean)))
    : [];
  const matchesTrackStatus = (m) => {
    if (trackChips.length === 0) return true;
    return trackChips.every((t) => {
      const st = (m.trackStatus && m.trackStatus[t]) || "Not Enrolled";
      if (st === "Not Enrolled") return false;
      if (batchChip && singleTrackChip === t) {
        const b = (m.trackBatch && m.trackBatch[t]) || "";
        if (b !== batchChip) return false;
      }
      return true;
    });
  };

  const filtered = members.filter((m) => {
    if (query) {
      const q = query.toLowerCase();
      const haystack = [m.name, m.contactNumber, m.address, m.category].filter(Boolean).join(" ").toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    if (lifeStageFilter && m.lifeStage !== lifeStageFilter) return false;
    if (genderFilter && m.gender !== genderFilter) return false;
    if (categoryFilter && m.category !== categoryFilter) return false;
    const mAge = ageFromBirthdate(m.birthdate);
    if (minAge && !(typeof mAge === "number" && mAge >= Number(minAge))) return false;
    if (maxAge && !(typeof mAge === "number" && mAge <= Number(maxAge))) return false;
    if (!matchesTrackStatus(m)) return false;
    return true;
  });
  const anyFilterActive = query || lifeStageFilter || genderFilter || categoryFilter || minAge || maxAge || trackChips.length > 0 || batchChip;
  const clearFilters = () => { setQuery(""); setLifeStageFilter(""); setGenderFilter(""); setCategoryFilter(""); setMinAge(""); setMaxAge(""); setTrackChips([]); setBatchChip(""); };

  // Sortable columns: click a header to sort by it, click again to
  // flip direction. Track-status columns sort by a fixed status
  // rank so meaningful statuses (e.g. In-Progress) cluster together
  // instead of sorting alphabetically.
  const STATUS_SORT_RANK = { "Completed": 0, "In-Progress": 1, "Enrolled": 2, "Incomplete": 3, "Cancelled": 4, "Not Enrolled": 5 };
  const sortAccessor = (m, col) => {
    if (col === "name") return (m.name || "").toLowerCase();
    if (col === "age") return ageFromBirthdate(m.birthdate) ?? -1;
    if (col === "gender") return (m.gender || "").toLowerCase();
    if (col === "lifeStage") return (m.lifeStage || "").toLowerCase();
    if (col === "category") return (m.category || "").toLowerCase();
    const status = (m.trackStatus && m.trackStatus[col]) || "Not Enrolled";
    return STATUS_SORT_RANK[status] ?? 9;
  };
  const sorted = sortCol
    ? [...filtered].sort((a, b) => {
        const av = sortAccessor(a, sortCol), bv = sortAccessor(b, sortCol);
        let cmp = typeof av === "number" && typeof bv === "number" ? av - bv : String(av).localeCompare(String(bv));
        return sortDir === "asc" ? cmp : -cmp;
      })
    : filtered;
  const toggleSort = (col) => {
    if (sortCol === col) setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    else { setSortCol(col); setSortDir("asc"); }
  };

  return (
    <div style={{ background: "linear-gradient(135deg, #FBF8ED, #F5EFDA, #F0E9D2)", borderRadius: 16, padding: 10, margin: -10 }}>
      <div style={{ background: "rgba(255,255,255,0.5)", backdropFilter: "blur(18px) saturate(160%)", WebkitBackdropFilter: "blur(18px) saturate(160%)", border: "1px solid rgba(31,56,100,0.12)", borderRadius: 16, padding: "14px 14px 10px", marginBottom: 16, boxShadow: "0 10px 30px -18px rgba(35,33,29,0.2)" }}>
      <div className="stack-mobile" style={{ ...styles.toolbar, marginBottom: 12 }}>
        <input style={{ ...styles.toolbarInput, background: "rgba(255,255,255,0.7)" }} placeholder="Search name, contact number, or address…" value={query} onChange={(e) => setQuery(e.target.value)} />
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          {isLeader && members.length > 0 && <button style={{ ...styles.ghostBtn, flex: 1 }} onClick={() => setPrintAllOpen(true)}>Print QR IDs</button>}
          {isLeader && members.length > 0 && <button style={{ ...styles.ghostBtn, flex: 1 }} onClick={exportCsv}>Export CSV</button>}
          {isLeader && (
            <>
              <input ref={csvFileInputRef} type="file" accept=".csv,text/csv" style={{ display: "none" }} onChange={handleCsvFile} />
              <button style={{ ...styles.ghostBtn, flex: 1 }} onClick={triggerImportCsv} disabled={csvBusy}>{csvBusy ? "Importing…" : "Import CSV"}</button>
            </>
          )}
          {isLeader && <button style={{ ...styles.primaryBtn, flex: 1 }} onClick={onAdd}>+ Add Member</button>}
        </div>
      </div>

      {printAllOpen && <PrintAllQrModal members={members} onClose={() => setPrintAllOpen(false)} />}

      <div className="filter-grid-mobile" style={{ ...styles.toolbar, marginTop: -2, marginBottom: 12, display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))" }}>
        <select style={{ ...styles.toolbarInput, background: "rgba(255,255,255,0.7)" }} value={genderFilter} onChange={(e) => setGenderFilter(e.target.value)}>
          <option value="">Gender: All</option>
          {GENDERS.map((g) => <option key={g} value={g}>{g}</option>)}
        </select>
        <select style={{ ...styles.toolbarInput, background: "rgba(255,255,255,0.7)" }} value={lifeStageFilter} onChange={(e) => setLifeStageFilter(e.target.value)}>
          <option value="">Life stage: All</option>
          {LIFE_STAGES.map((ls) => <option key={ls} value={ls}>{ls}</option>)}
        </select>
        <select style={{ ...styles.toolbarInput, background: "rgba(255,255,255,0.7)" }} value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)}>
          <option value="">Membership: All</option>
          {MEMBER_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
        <input style={{ ...styles.toolbarInput, background: "rgba(255,255,255,0.7)", flex: "0 1 90px", minWidth: 70 }} type="number" min="0" placeholder="Min age" value={minAge} onChange={(e) => setMinAge(e.target.value)} />
        <input style={{ ...styles.toolbarInput, background: "rgba(255,255,255,0.7)", flex: "0 1 90px", minWidth: 70 }} type="number" min="0" placeholder="Max age" value={maxAge} onChange={(e) => setMaxAge(e.target.value)} />
      </div>

      {members.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, margin: "-2px 0 6px" }}>
          {DISCIPLESHIP_TRACKS.map((t) => {
            const active = trackChips.includes(t);
            return (
              <button
                key={t}
                onClick={() => toggleTrackChip(t)}
                style={{
                  padding: "5px 11px", borderRadius: 20, fontSize: 11.5, fontWeight: 600, cursor: "pointer",
                  border: active ? "1px solid #1F3864" : "1px solid rgba(31,56,100,0.2)",
                  background: active ? "rgba(31,56,100,0.1)" : "rgba(255,255,255,0.5)",
                  color: "#1F3864",
                }}
              >
                {t}
              </button>
            );
          })}
        </div>
      )}

      {members.length > 0 && singleTrackChip && batchOptionsForTrackChip.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 6, margin: "0 0 4px" }}>
          <span style={{ fontSize: 10.5, color: "#7A6E4E", alignSelf: "center", marginRight: 2 }}>Batch:</span>
          <button
            onClick={() => setBatchChip("")}
            style={{
              padding: "4px 10px", borderRadius: 20, fontSize: 11, fontWeight: 600, cursor: "pointer",
              border: batchChip === "" ? "1px solid #1F3864" : "1px solid rgba(31,56,100,0.2)",
              background: batchChip === "" ? "rgba(31,56,100,0.1)" : "rgba(255,255,255,0.5)",
              color: "#1F3864",
            }}
          >
            All
          </button>
          {batchOptionsForTrackChip.map((b) => {
            const active = batchChip === b;
            return (
              <button
                key={b}
                onClick={() => setBatchChip(active ? "" : b)}
                style={{
                  padding: "4px 10px", borderRadius: 20, fontSize: 11, fontWeight: 600, cursor: "pointer",
                  border: active ? "1px solid #1F3864" : "1px solid rgba(31,56,100,0.2)",
                  background: active ? "rgba(31,56,100,0.1)" : "rgba(255,255,255,0.5)",
                  color: "#1F3864",
                }}
              >
                {b}
              </button>
            );
          })}
        </div>
      )}
      </div>

      {members.length > 0 && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, fontSize: 12.5, color: "#7A6E4E", margin: "-6px 0 12px" }}>
          <span>Showing {filtered.length} of {members.length} {members.length === 1 ? "member" : "members"}</span>
          {anyFilterActive && <button style={{ ...styles.ghostBtn, padding: "4px 10px", fontSize: 11.5 }} onClick={clearFilters}>Clear filters</button>}
        </div>
      )}

      {filtered.length === 0 && <div style={styles.emptyNote}>{members.length === 0 ? "No members yet." : "No members match these filters."}</div>}

      <div style={{ overflowX: "auto", borderRadius: 12, border: "1px solid rgba(31,56,100,0.12)", background: "rgba(255,255,255,0.55)", backdropFilter: "blur(18px) saturate(160%)", WebkitBackdropFilter: "blur(18px) saturate(160%)", boxShadow: "0 8px 30px -18px rgba(35,33,29,0.18)" }}>
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5, tableLayout: "auto" }}>
            <thead>
              <tr>
                {[
                  { label: "Name", col: "name" },
                  { label: "Age", col: "age" },
                  { label: "Gender", col: "gender" },
                  { label: "Life Stage", col: "lifeStage" },
                  { label: "Membership", col: "category" },
                  ...DISCIPLESHIP_TRACKS.map((t) => ({ label: t, wrap: t.length > 8, col: t })),
                ].map((h, i) => (
                  <th
                    key={h.label + i}
                    onClick={() => toggleSort(h.col)}
                    style={{ textAlign: "left", padding: "10px 10px", fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.3, color: "#1F3864", background: "rgba(31,56,100,0.08)", backdropFilter: "blur(12px) saturate(160%)", WebkitBackdropFilter: "blur(12px) saturate(160%)", borderBottom: "1px solid rgba(31,56,100,0.15)", whiteSpace: h.wrap ? "normal" : "nowrap", maxWidth: h.wrap ? 78 : undefined, lineHeight: 1.35, cursor: "pointer", userSelect: "none", ...(i === 0 ? { position: "sticky", left: 0, zIndex: 2, background: "rgba(236,231,217,0.78)", boxShadow: "2px 0 4px -3px rgba(31,56,100,0.25)" } : {}) }}>
                    {h.label}{sortCol === h.col ? (sortDir === "asc" ? " ▲" : " ▼") : ""}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {sorted.map((m) => {
                const mAge = ageFromBirthdate(m.birthdate);
                return (
                  <tr key={m.id} className="card-row" style={{ cursor: "pointer" }} onClick={() => onOpen(m)}>
                    <td style={{ padding: "8px 10px", borderBottom: "1px solid rgba(31,56,100,0.08)", position: "sticky", left: 0, zIndex: 1, background: "rgba(246,242,230,0.78)", backdropFilter: "blur(12px) saturate(160%)", WebkitBackdropFilter: "blur(12px) saturate(160%)", boxShadow: "2px 0 4px -3px rgba(31,56,100,0.2)" }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <Avatar name={m.name} photoUrl={m.photoUrl} size={30} />
                        <span style={{ fontWeight: 700, color: "#23211D", whiteSpace: "nowrap" }}>{m.name}</span>
                      </div>
                    </td>
                    <td style={{ padding: "8px 10px", borderBottom: "1px solid rgba(31,56,100,0.08)", color: "#4A4230", whiteSpace: "nowrap" }}>{mAge || "—"}</td>
                    <td style={{ padding: "8px 10px", borderBottom: "1px solid rgba(31,56,100,0.08)", color: "#4A4230", whiteSpace: "nowrap" }}>{m.gender || "—"}</td>
                    <td style={{ padding: "8px 10px", borderBottom: "1px solid rgba(31,56,100,0.08)", color: "#4A4230", whiteSpace: "nowrap" }}>{m.lifeStage || "—"}</td>
                    <td style={{ padding: "8px 10px", borderBottom: "1px solid rgba(31,56,100,0.08)", color: "#4A4230", whiteSpace: "nowrap" }}>{m.category || "—"}</td>
                    {DISCIPLESHIP_TRACKS.map((track) => {
                      const status = (m.trackStatus && m.trackStatus[track]) || "Not Enrolled";
                      const batch = (m.trackBatch && m.trackBatch[track]) || "";
                      return (
                        <td key={track} title={`${track}: ${status}${batch ? ` (${batch})` : ""}`} style={{ padding: "8px 10px", borderBottom: "1px solid rgba(31,56,100,0.08)", whiteSpace: "nowrap", textAlign: "center" }}>
                          <TrackStatusCell status={status} batch={batch} />
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
      </div>
    </div>
  );
}

function MemberProfile({ member, classes, topics, attendanceByMember, isLeader, onBack, onToggleAttendance, onSetAttendanceDate, onDeleteMember, onEdit }) {
  const [qrOpen, setQrOpen] = useState(false);
  const att = attendanceByMember[member.id] || {};

  const enrolledClasses = useMemo(() => getEnrolledClasses(classes, member), [classes, member]);
  const enrolledTopics = useMemo(() => getEnrolledTopics(topics, enrolledClasses, member), [topics, enrolledClasses, member]);
  const enrolledTopicIds = useMemo(() => new Set(enrolledTopics.map((t) => t.id)), [enrolledTopics]);

  const [activeClassId, setActiveClassId] = useState(null);
  useEffect(() => {
    if (activeClassId && !enrolledClasses.some((c) => c.id === activeClassId)) setActiveClassId(null);
  }, [enrolledClasses, activeClassId]);
  const toggleClassOpen = (classId) => {
    setActiveClassId((prev) => (prev === classId ? null : classId));
  };

  const overallPct = overallProgressPct(enrolledTopics, attendanceByMember, member.id);
  const missing = enrolledTopics.filter((t) => !(att[t.id] && att[t.id].attended));

  const topicById = useMemo(() => {
    const map = {};
    topics.forEach((t) => { map[t.id] = t; });
    return map;
  }, [topics]);

  const history = useMemo(() => {
    return Object.values(att)
      .filter((a) => a.attended && a.dateAttended && topicById[a.topicId] && enrolledTopicIds.has(a.topicId))
      .map((a) => ({ ...a, topic: topicById[a.topicId] }))
      .sort((a, b) => {
        const da = a.dateAttended.toDate ? a.dateAttended.toDate() : new Date(a.dateAttended);
        const db = b.dateAttended.toDate ? b.dateAttended.toDate() : new Date(b.dateAttended);
        return db - da;
      });
  }, [att, topicById, enrolledTopicIds]);

  const [historySectionOpen, setHistorySectionOpen] = useState(false);
  const [missingSectionOpen, setMissingSectionOpen] = useState(false);
  const [expandedHistoryClasses, setExpandedHistoryClasses] = useState({});
  const [expandedMissingClasses, setExpandedMissingClasses] = useState({});
  const toggleHistoryClass = (classId) => {
    setExpandedHistoryClasses((prev) => ({ ...prev, [classId]: !prev[classId] }));
  };
  const toggleMissingClass = (classId) => {
    setExpandedMissingClasses((prev) => ({ ...prev, [classId]: !prev[classId] }));
  };

  const missingByClass = useMemo(() => {
    return enrolledClasses
      .map((c) => ({ classInfo: c, items: sortTopicsNaturally(missing.filter((t) => t.class === c.name)) }))
      .filter((g) => g.items.length > 0);
  }, [enrolledClasses, missing]);

  const historyByClass = useMemo(() => {
    return enrolledClasses
      .map((c) => ({ classInfo: c, items: history.filter((h) => h.topic.class === c.name) }))
      .filter((g) => g.items.length > 0);
  }, [enrolledClasses, history]);

  // Rendered as a modal over whatever page it was opened from. The QR
  // and class-attendance popups below are siblings of the overlay (not
  // children) so their fixed positioning isn't trapped by its blur.
  return (
    <>
      <div style={{ ...styles.modalOverlay, background: "rgba(20,18,14,0.55)" }} onClick={onBack}>
        <div
          style={{ position: "relative", width: "100%", maxWidth: 560, maxHeight: "90vh", display: "flex", flexDirection: "column", background: dj.card.background, border: dj.card.border, borderRadius: 26, boxShadow: "0 25px 60px -18px rgba(20,18,14,0.6)", overflow: "hidden", animation: "popIn 0.18s ease-out" }}
          onClick={(e) => e.stopPropagation()}
        >
          <button
            type="button"
            onClick={onBack}

              <div className="dj-modal-ring-col" style={{ flexShrink: 0, width: 168, display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center", paddingTop: 6 }}>
                <SessionRing sessions={sessions} size={176} />
                <div style={{ fontWeight: 700, color: "#F5F2E4", fontSize: 17, fontFamily: "Georgia, serif", marginTop: 12 }}>{activeClass.name}</div>
                <div style={{ fontSize: 12.5, color: "rgba(245,242,228,0.8)", marginTop: 2 }}>{ts.length} session{ts.length === 1 ? "" : "s"}</div>
              </div>

              <div className="dj-modal-list" style={{ flex: 1, minWidth: 0, maxHeight: "72vh", overflowY: "auto", paddingRight: 2, paddingTop: 6 }}>
                {ts.length === 0 ? (
                  <div style={{ ...styles.emptyNote, color: "rgba(245,242,228,0.7)" }}>No topics added for this class yet.</div>
                ) : (
                  <div style={styles.sessionList}>
                    {ts.map((t) => {
                      const doneT = !!(att[t.id] && att[t.id].attended);
                      return (
                        <div
                          key={t.id}
                          className="milestone-row"
                          style={{
                            ...styles.sessionRow,
                            background: "rgba(255,255,255,0.09)",
                            border: "1px solid rgba(255,255,255,0.16)",
                            backdropFilter: "blur(6px)",
                            WebkitBackdropFilter: "blur(6px)",
                            ...(doneT ? { background: "rgba(142,209,158,0.22)", border: "1px solid rgba(142,209,158,0.45)" } : {}),
                          }}
                        >
                          <label style={{ ...styles.sessionNameWrap, cursor: "default" }}>
                            <input
                              type="checkbox"
                              checked={doneT}
                              disabled
                              style={{ ...styles.sessionCheckbox, cursor: "not-allowed", opacity: 0.85, accentColor: "#8FD19E" }}

                            <span style={{ ...styles.sessionName, color: "#F5F2E4" }}>{t.name}</span>
                            {doneT && <span style={{ ...styles.sessionCheckIcon, color: "#8FD19E" }}>✓</span>}
                          </label>
                          {doneT && att[t.id].dateAttended && (
                            <span style={styles.topicMeta}>
                              <span style={{ ...styles.sessionDateBadge, background: "rgba(255,255,255,0.16)", color: "#EAF7EC", border: "1px solid rgba(255,255,255,0.2)" }}>{fmtDateTime(att[t.id].dateAttended)}</span>
                            </span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      })()}
    </>
  );
}

// ============================================================
// PHOTO PICKER — used by Add/Edit member modals. Compresses the
// chosen image client-side and hands back a data URL (or null).
// ============================================================

function PhotoPicker({ name, photoUrl, onChange }) {
  const inputRef = useRef(null);
  const [busy, setBusy] = useState(false);

  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setBusy(true);
    try {
      const dataUrl = await resizeImageToDataUrl(file);
      onChange(dataUrl);
    } catch (err) {
      showError("Could not process the photo. Please try again.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 12 }}>
      <Avatar name={name} photoUrl={photoUrl} size={56} />
      <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
        <button type="button" style={styles.ghostBtn} onClick={() => inputRef.current && inputRef.current.click()} disabled={busy}>
          {busy ? "Processing…" : photoUrl ? "Change photo" : "Upload photo"}
        </button>
        {photoUrl && !busy && (
          <button type="button" style={styles.dangerLink} onClick={() => onChange(null)}>Remove photo</button>
        )}
        <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
      </div>
    </div>
  );
}

// ============================================================
// ADD MEMBER MODAL
// ============================================================

// A member is no longer given a separate "Classes" enrollment form —
// enrollment/status per class is derived straight from the
// Discipleship Tracks statuses below. A class is matched to its
// track by name (ignoring a trailing "Class" and case), e.g. the
// "Making Disciples" track maps to a "Making Disciples Class" class.
function normalizeTrackClassName(s) {
  return (s || "").trim().toLowerCase().replace(/\s+class$/, "").replace(/\s+/g, " ");
}

function trackNameForClass(className) {
  const target = normalizeTrackClassName(className);
  return DISCIPLESHIP_TRACKS.find((t) => normalizeTrackClassName(t) === target) || null;
}

// Builds the classStatus map straight from trackStatus: any class
// whose name matches a discipleship track takes that track's status.
// A class with no matching track (a custom/legacy class) keeps
// whatever status it already had on the member, defaulting to "Not
// Enrolled".
function deriveClassStatusFromTracks(classes, trackStatus, existingClassStatus) {
  const result = {};
  classes.forEach((c) => {
    const existing = (existingClassStatus && existingClassStatus[c.id]) || "Not Enrolled";
    const track = trackNameForClass(c.name);
    if (track) {
      // Only override the old recorded status once this track has an
      // EXPLICIT entry in trackStatus. A track that was never touched
      // (no key at all — e.g. a member recorded before the Discipleship
      // Tracks fields existed) falls back to whatever was already on
      // file for this class, instead of getting reset to "Not
      // Enrolled". A track a leader deliberately set back to "Not
      // Enrolled" still wins, since that's an explicit key.
      const hasExplicitValue = trackStatus && Object.prototype.hasOwnProperty.call(trackStatus, track);
      result[c.id] = hasExplicitValue ? trackStatus[track] : existing;
    } else {
      result[c.id] = existing;
    }
  });
  return result;
}

// Mirrors old per-class status into the Discipleship Tracks dropdowns
// for members recorded before those fields existed, so opening Edit
// shows what's already on file instead of a misleading "Not Enrolled"
// (and so simply saving won't look like it silently cleared a record).
function backfillTrackStatusFromClassStatus(classes, trackStatus, classStatus) {
  const result = { ...(trackStatus || {}) };
  DISCIPLESHIP_TRACKS.forEach((track) => {
    if (Object.prototype.hasOwnProperty.call(result, track)) return;
    const cls = classes.find((c) => trackNameForClass(c.name) === track);
    if (cls && classStatus && classStatus[cls.id] && classStatus[cls.id] !== "Not Enrolled") {
      result[track] = classStatus[cls.id];
    }
  });
  return result;
}

function DiscipleshipTrackFields({ trackStatus, trackBatch, onChange, onBatchChange, classes, topics, onlyTrack }) {
  const tracksToShow = onlyTrack ? DISCIPLESHIP_TRACKS.filter((t) => t === onlyTrack) : DISCIPLESHIP_TRACKS;
  return (
    <>
      <div style={styles.sectionLabel}>Discipleship tracks</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 10 }}>
        {tracksToShow.map((track) => {
          const status = trackStatus[track] || "Not Enrolled";
          // The track maps to a real class (by name) when one exists —
          // that class's batch list is what the dropdown below offers.
          // A track with no matching class yet (or before any classes
          // are set up) just falls back to "Batch 1".
          const matchingClass = (classes || []).find((c) => trackNameForClass(c.name) === track);
          // Completed batches are excluded so a leader can't enroll or
          // add a member into a batch that's already finished; a
          // member already recorded in one keeps that value on file
          // even though it's no longer offered here for new picks.
          const batchOptions = matchingClass ? openBatchesForClass(matchingClass, topics || []) : ["Batch 1"];
          const currentBatch = (trackBatch && trackBatch[track]) || "Batch 1";
          // Every batch for this track's class has been fully conducted —
          // there's nowhere valid to put a NEW enrollment. Someone who is
          // already enrolled (set before the batch finished, or holding a
          // manual Incomplete/Cancelled status) keeps full control over
          // their own status here; this only blocks *starting* a fresh
          // enrollment once nothing is open.
          const noOpenBatch = !!matchingClass && batchOptions.length === 0;
          const statusOptions = noOpenBatch && status === "Not Enrolled" ? ["Not Enrolled"] : TRACK_STATUSES;
          const effectiveBatchOptions = batchOptions.length ? batchOptions : [currentBatch];
          return (
            <div key={track} style={{ display: "flex", flexDirection: "column", gap: 4 }}>
              <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
                <span style={{ flex: 1, color: "#4A4230" }}>{track}</span>
                <select
                  style={{ ...styles.modalInput, marginBottom: 0, flex: "0 0 160px" }}
                  value={status}
                  onChange={(e) => onChange(track, e.target.value)}
                >
                  {statusOptions.map((s) => <option key={s} value={s}>{s}</option>)}
                </select>
              </label>
              {noOpenBatch && status === "Not Enrolled" && (
                <div style={{ fontSize: 11.5, color: "#A6402F" }}>Every session in {track} has already been conducted — no open batch to enroll into.</div>
              )}
              {status !== "Not Enrolled" && (
                <select
                  style={{ ...styles.modalInput, marginBottom: 0, fontSize: 13 }}
                  value={effectiveBatchOptions.includes(currentBatch) ? currentBatch : effectiveBatchOptions[0]}
                  onChange={(e) => onBatchChange(track, e.target.value)}
                >
                  {effectiveBatchOptions.map((b) => <option key={b} value={b}>{b}</option>)}
                </select>
              )}
            </div>
          );
        })}
      </div>
    </>
  );
}

function AddMemberModal({ classes, topics, members, onClose, onSave, initialTrack, initialBatch, title }) {
  const [name, setName] = useState("");
  const [photoUrl, setPhotoUrl] = useState(null);
  const [birthdate, setBirthdate] = useState("");
  const [gender, setGender] = useState("");
  const [lifeStage, setLifeStage] = useState("");
  const [category, setCategory] = useState("");
  const [contactNumber, setContactNumber] = useState("");
  const [address, setAddress] = useState("");
  const [notes, setNotes] = useState("");
  // A leader can land here (via "+ Add Member") already looking at a
  // specific class/batch — but if that class has no open batch left
  // (every batch fully conducted), there's nowhere valid to enroll a
  // brand-new member, so default to "Not Enrolled" instead of silently
  // enrolling them into a finished batch.
  const initialOpenBatches = useMemo(() => {
    if (!initialTrack) return null;
    const matchingClass = (classes || []).find((c) => trackNameForClass(c.name) === initialTrack);
    return matchingClass ? openBatchesForClass(matchingClass, topics) : null;
  }, [initialTrack]);
  const initialTrackHasOpenBatch = !initialOpenBatches || initialOpenBatches.length > 0;
  const [trackStatus, setTrackStatus] = useState(() => (initialTrack && initialTrackHasOpenBatch ? { [initialTrack]: "Enrolled" } : {}));
  const [trackBatch, setTrackBatch] = useState(() => {
    if (!initialTrack || !initialBatch || !initialTrackHasOpenBatch) return {};
    // Don't default into a batch that's already complete (e.g. the
    // leader had a finished batch selected when they hit "+ Add
    // Member") — fall back to the first still-open batch instead.
    const allowed = initialOpenBatches;
    const batch = allowed && !allowed.includes(initialBatch) ? allowed[0] : initialBatch;
    return { [initialTrack]: batch };
  });
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  // Same "merge instead of creating a duplicate person" check used when
  // approving registrations — catches the same person being re-added
  // here by name before a second Disciples record gets created.
  const duplicates = useMemo(() => findPossibleDuplicates(members || [], name), [members, name]);
  const [mergeId, setMergeId] = useState("");

  const setTrack = (track, value) => {
    setTrackStatus((prev) => ({ ...prev, [track]: value }));
  };
  const setBatch = (track, value) => {
    setTrackBatch((prev) => ({ ...prev, [track]: value }));
  };

  // Each check has its own message so a leader who hits "Add" with one
  // field missed is told exactly which one, instead of the form just
  // sitting there doing nothing (the previous behavior for anything
  // that was only whitespace, since HTML's built-in "required" doesn't
  // catch a name of " ").
  function validate() {
    if (!name.trim()) return "Please enter the member's full name.";
    if (!birthdate) return "Please enter a birthdate.";
    if (!gender) return "Please select a gender.";
    if (!lifeStage) return "Please select a life stage.";
    if (!category) return "Please select a membership.";
    if (!contactNumber.trim()) return "Please enter a contact number.";
    if (!address.trim()) return "Please enter an address.";
    return "";
  }

  const submit = async (e) => {
    e.preventDefault();
    const problem = validate();
    if (problem) { setError(problem); return; }
    setError("");
    const classStatus = deriveClassStatusFromTracks(classes, trackStatus, null);
    const classIds = Object.keys(classStatus).filter((id) => classStatus[id] && classStatus[id] !== "Not Enrolled");
    setBusy(true);
    try {
      await onSave({
        name: name.trim(),
        photoUrl: photoUrl || null,
        birthdate,
        gender,
        lifeStage,
        category,
        contactNumber: contactNumber.trim(),
        address: address.trim(),
        notes: notes.trim(),
        classIds,
        classStatus,
        trackStatus,
        trackBatch,
        dateAdded: new Date(),
      }, mergeId || null);
    } catch (err) {
      // A save failure already shows a toast (from the parent's
      // addMember handler) — just stop treating the form as busy so
      // the leader can fix something and try again.
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <form style={styles.modalCard} onClick={(e) => e.stopPropagation()} onSubmit={submit}>
        <div style={styles.modalTitle}>{title || "Add Member"}</div>
        {error && <div style={styles.authError}><span>⚠</span><span>{error}</span></div>}
        <PhotoPicker name={name} photoUrl={photoUrl} onChange={setPhotoUrl} />
        <input style={styles.modalInput} placeholder="Full name" value={name} onChange={(e) => { setName(e.target.value); setMergeId(""); }} autoFocus required />
        {duplicates.length > 0 && (
          <div style={{ marginBottom: 12 }}>
            <div style={styles.sectionLabel}>Possible existing match</div>
            <div style={styles.pairNote}>Someone in Disciples already has this exact name. Merge instead of creating a duplicate person, or pick "Add as new person" if it's someone else.</div>
            <select style={styles.modalInput} value={mergeId} onChange={(e) => setMergeId(e.target.value)}>
              <option value="">Add as new person</option>
              {duplicates.map((d) => (
                <option key={d.id} value={d.id}>Merge into existing: {d.name}</option>
              ))}
            </select>
          </div>
        )}
        <div style={styles.modalRow2}>
          <label style={styles.modalFieldLabel}>
            Birthdate
            <DobPicker value={birthdate} onChange={setBirthdate} />
          </label>
          <label style={styles.modalFieldLabel}>
            Gender
            <select style={{ ...styles.modalInput, marginBottom: 0 }} value={gender} onChange={(e) => setGender(e.target.value)} required>
              <option value="">Select…</option>
              {GENDERS.map((g) => <option key={g} value={g}>{g}</option>)}
            </select>
          </label>
        </div>
        <div style={styles.modalRow2}>
          <label style={styles.modalFieldLabel}>
            Membership
            <select style={{ ...styles.modalInput, marginBottom: 0 }} value={category} onChange={(e) => setCategory(e.target.value)} required>
              <option value="">Select…</option>
