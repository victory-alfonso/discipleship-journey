function EditMemberModal({ member, classes, topics, attendanceByMember, onClose, onSave, onCompleteAllSessions, onUpdateSessionAttendance, initialTrack }) {
  const [name, setName] = useState(member.name || "");
  const [photoUrl, setPhotoUrl] = useState(member.photoUrl || null);
  const [birthdate, setBirthdate] = useState(member.birthdate ? toDateInputValue(member.birthdate) : "");
  const [gender, setGender] = useState(member.gender || "");
  const [lifeStage, setLifeStage] = useState(member.lifeStage || "");
  const [category, setCategory] = useState(member.category || "");
  const [contactNumber, setContactNumber] = useState(member.contactNumber || "");
  const [address, setAddress] = useState(member.address || "");
  const [notes, setNotes] = useState(member.notes || "");
  const [trackStatus, setTrackStatus] = useState(() => backfillTrackStatusFromClassStatus(classes, member.trackStatus, member.classStatus));
  const [trackBatch, setTrackBatch] = useState(member.trackBatch || {});
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  // Tracks (by name) the leader just confirmed to auto-complete —
  // { [track]: classId } — so submit() knows which classes need every
  // session marked attended once the status change itself is saved.
  const [autoCompleteTracks, setAutoCompleteTracks] = useState({});
  // Tracks (by name) where the leader picked exactly which sessions are
  // done after downgrading away from "Completed" — { [track]: { classId,
  // attendance: { [topicId]: boolean } } } — applied in submit() the same
  // way autoCompleteTracks is.
  const [sessionOverrides, setSessionOverrides] = useState({});

  const setTrack = async (track, value) => {
    const prevValue = trackStatus[track];
    if (value === "Completed" && prevValue !== "Completed") {
      const matchingClass = (classes || []).find((c) => trackNameForClass(c.name) === track);
      const className = matchingClass ? matchingClass.name : track;
      const ok = await askConfirm({
        title: "Mark as completed?",
        message: `Do you want to tag ${member.name} as completed in ${className}? If yes, all of their sessions in ${className} will be marked as attended.`,
        confirmLabel: "Yes, complete all",
      });
      if (!ok) return;
      setAutoCompleteTracks((prev) => ({ ...prev, [track]: matchingClass ? { classId: matchingClass.id, batch: trackBatch[track] || "Batch 1" } : null }));
      setSessionOverrides((prev) => {
        if (!(track in prev)) return prev;
        const next = { ...prev };
        delete next[track];
        return next;
      });
    } else if (prevValue === "Completed" && (value === "In-Progress" || value === "Incomplete") && onUpdateSessionAttendance) {
      // Downgrading a completed track — ask exactly which sessions
      // actually happened instead of quietly leaving every session in
      // that class marked attended under a status that now says
      // otherwise.
      const matchingClass = (classes || []).find((c) => trackNameForClass(c.name) === track);
      if (matchingClass) {
        const memberBatch = (member.trackBatch && member.trackBatch[track]) || "Batch 1";
        const classTopics = sortTopicsForDisplay(topicsForClass(topics, matchingClass.name).filter((t) => topicBatch(t) === memberBatch));
        const attForMember = (attendanceByMember && attendanceByMember[member.id]) || {};
        const initialChecked = {};
        classTopics.forEach((t) => { initialChecked[t.id] = attForMember[t.id] ? !!attForMember[t.id].attended : true; });
        const result = await askSessionPicker({
          title: `Update ${matchingClass.name} sessions`,
          message: `${member.name} was marked Completed. Uncheck any session they haven't actually finished — this updates their attendance record to match.`,
          sessions: classTopics,
          initialChecked,
        });
        if (!result) return;
        setSessionOverrides((prev) => ({ ...prev, [track]: { classId: matchingClass.id, attendance: result } }));
      }
      setAutoCompleteTracks((prev) => {
        if (!(track in prev)) return prev;
        const next = { ...prev };
        delete next[track];
        return next;
      });
    } else if (value !== "Completed") {
      setAutoCompleteTracks((prev) => {
        if (!(track in prev)) return prev;
        const next = { ...prev };
        delete next[track];
        return next;
      });
    }
    setTrackStatus((prev) => ({ ...prev, [track]: value }));
  };
  const setBatch = (track, value) => {
    setTrackBatch((prev) => ({ ...prev, [track]: value }));
  };

  function validate() {
    if (!name.trim()) return "Please enter the member's full name.";
    if (!birthdate) return "Please enter a birthdate.";
    if (!gender) return "Please select a gender.";
    if (!lifeStage) return "Please select a life stage.";
    if (!category) return "Please select a membership.";
    if (!contactNumber.trim()) return "Please enter a contact number.";
    if (!address.trim()) return "Please enter an address.";
    return "";
  }

  const submit = async (e) => {
    e.preventDefault();
    const problem = validate();
    if (problem) { setError(problem); return; }
    setError("");
    // Class enrollment/status is derived from the discipleship track
    // statuses above; a class with no matching track (custom/legacy)
    // keeps whatever status it already had on this member.
    const classStatus = deriveClassStatusFromTracks(classes, trackStatus, member.classStatus);
    const classIds = Object.keys(classStatus).filter((id) => classStatus[id] && classStatus[id] !== "Not Enrolled");
    setBusy(true);
    try {
      await onSave({
        name: name.trim(),
        photoUrl: photoUrl || null,
        birthdate,
        gender,
        lifeStage,
        category,
        contactNumber: contactNumber.trim(),
        address: address.trim(),
        notes: notes.trim(),
        classIds,
        classStatus,
        trackStatus,
        trackBatch,
      });
      const classIdsToComplete = Object.values(autoCompleteTracks).filter(Boolean);
      if (classIdsToComplete.length > 0 && onCompleteAllSessions) {
        await Promise.all(classIdsToComplete.map((c) => onCompleteAllSessions(member.id, c.classId, c.batch)));
      }
      const overridesToApply = Object.values(sessionOverrides);
      if (overridesToApply.length > 0 && onUpdateSessionAttendance) {
        await Promise.all(overridesToApply.map((o) => onUpdateSessionAttendance(member.id, o.classId, o.attendance)));
      }
    } catch (err) {
      // A save failure already shows a toast (from the parent's
      // updateMember handler) — just stop treating the form as busy.
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <form style={styles.modalCard} onClick={(e) => e.stopPropagation()} onSubmit={submit}>
        <div style={styles.modalTitle}>Edit Member</div>
        {error && <div style={styles.authError}><span>⚠</span><span>{error}</span></div>}
        <PhotoPicker name={name} photoUrl={photoUrl} onChange={setPhotoUrl} />
        <input style={styles.modalInput} placeholder="Full name" value={name} onChange={(e) => setName(e.target.value)} autoFocus required />
        <div style={styles.modalRow2}>
          <label style={styles.modalFieldLabel}>
            Birthdate
            <DobPicker value={birthdate} onChange={setBirthdate} />
          </label>
          <label style={styles.modalFieldLabel}>
            Gender
            <select style={{ ...styles.modalInput, marginBottom: 0 }} value={gender} onChange={(e) => setGender(e.target.value)} required>
              <option value="">Select…</option>
              {GENDERS.map((g) => <option key={g} value={g}>{g}</option>)}
            </select>
          </label>
        </div>
        <div style={styles.modalRow2}>
          <label style={styles.modalFieldLabel}>
            Membership
            <select style={{ ...styles.modalInput, marginBottom: 0 }} value={category} onChange={(e) => setCategory(e.target.value)} required>
              <option value="">Select…</option>
              {MEMBER_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </label>
          <label style={styles.modalFieldLabel}>
            Life stage
            <select style={{ ...styles.modalInput, marginBottom: 0 }} value={lifeStage} onChange={(e) => setLifeStage(e.target.value)} required>
              <option value="">Select…</option>
              {LIFE_STAGES.map((ls) => <option key={ls} value={ls}>{ls}</option>)}
            </select>
          </label>
        </div>
        <div style={styles.modalRow2}>
          <label style={styles.modalFieldLabel}>
            Contact number
            <input style={{ ...styles.modalInput, marginBottom: 0 }} placeholder="Contact number" type="tel" value={contactNumber} onChange={(e) => setContactNumber(e.target.value)} required />
          </label>
          <label style={styles.modalFieldLabel}>
            Address
            <input style={{ ...styles.modalInput, marginBottom: 0 }} placeholder="Address" value={address} onChange={(e) => setAddress(e.target.value)} required />
          </label>
        </div>
        <DiscipleshipTrackFields trackStatus={trackStatus} trackBatch={trackBatch} onChange={setTrack} onBatchChange={setBatch} classes={classes} topics={topics} onlyTrack={initialTrack} />
        <div style={styles.modalActions}>
          <button type="button" style={styles.modalCancelBtn} onClick={onClose} disabled={busy}>Cancel</button>
          <button type="submit" style={styles.modalConfirmBtn} disabled={busy}>{busy ? "Saving…" : "Save"}</button>
        </div>
      </form>
    </div>
  );
}

// Photo-card helpers ------------------------------------------------
// A class can have a cover photo (stored on the class doc as a compressed
// data URL, same approach as member photos). Classes without one get a
// colored gradient with their initials so the grid still looks finished.
const CLASS_COVER_GRADIENTS = [
  "linear-gradient(135deg, #355896 0%, #1F3864 100%)",
  "linear-gradient(135deg, #4A6B34 0%, #23361A 100%)",
  "linear-gradient(135deg, #B58637 0%, #6B4A16 100%)",
  "linear-gradient(135deg, #6B4E8F 0%, #382A55 100%)",
  "linear-gradient(135deg, #9A4F4F 0%, #522525 100%)",
];

function coverGradientFor(name) {
  let h = 0;
  const str = name || "";
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
  return CLASS_COVER_GRADIENTS[h % CLASS_COVER_GRADIENTS.length];
}

function ClassCoverImage({ classItem }) {
  if (classItem.photoUrl) {
    return <img src={classItem.photoUrl} alt="" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }} />;
  }
  return (
    <div style={{ position: "absolute", inset: 0, background: coverGradientFor(classItem.name), display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "Georgia, serif", fontSize: 64, fontWeight: 700, color: "rgba(255,255,255,0.22)", letterSpacing: 2 }}>
      {initials(classItem.name)}
    </div>
  );
}

const PHOTO_BADGE = {
  done: { label: "Completed", background: "#385026", color: "#F5F2E4" },
  progress: { label: "In Progress", background: "#E5A430", color: "#23211D" },
  none: { label: "Not Started", background: "rgba(20,18,14,0.6)", color: "#F5F2E4" },
  pending: { label: "Pending approval", background: "#8A5A1E", color: "#F5F2E4" },
  rejected: { label: "Rejected", background: "#8C2E2E", color: "#F5F2E4" },
};

function ClassRow({ classItem, topics, members, attendanceByMember, isLeader, onOpen, onDeleteClass, onEditClass, reorderMode, position, isFirst, isLast, onMove }) {
  const ts = topicsForClass(topics, classItem.name);
  const classMembers = getClassMembers(members, classItem.id);
  const activeBatch = latestOngoingBatch(classItem, topics);
  const batchTs = sortTopicsForDisplay(ts.filter((t) => topicBatch(t) === activeBatch));
  const batchDone = batchTs.filter((t) => t.conducted).length;
  const batchComplete = batchTs.length > 0 && batchDone === batchTs.length;
  const badge = batchComplete ? PHOTO_BADGE.done : batchDone > 0 ? PHOTO_BADGE.progress : PHOTO_BADGE.none;
  const batchPct = batchTs.length ? Math.round((batchDone / batchTs.length) * 100) : 0;
  // Only classes matching a Discipleship Track carry a per-member batch
  // label — for those, count just the members in this batch; a custom
  // class (no matching track) isn't split by batch, so count everyone.
  const track = trackNameForClass(classItem.name);
  const batchMembers = track ? classMembers.filter((m) => ((m.trackBatch && m.trackBatch[track]) || "Batch 1") === activeBatch) : classMembers;
  const isOneOnOneClass = isOneOnOneClassName(classItem.name);
  const pct = classAttendanceRate(classItem.name, topics, classMembers, attendanceByMember);
  let batchCompletedCount = 0, batchInProgressCount = 0, totalCompletedCount = 0, totalInProgressCount = 0;
  batchMembers.forEach((m) => {
    const p = memberClassPct(classItem, topics, attendanceByMember, m, track);
    if (p >= 100) batchCompletedCount++;
    else if (p > 0) batchInProgressCount++;
  });
  classMembers.forEach((m) => {
    const p = memberClassPct(classItem, topics, attendanceByMember, m, track);
    if (p >= 100) totalCompletedCount++;
    else if (p > 0) totalInProgressCount++;
  });
  const nextSession = nextSessionForBatch(classItem, topics, activeBatch);
  return (
    <div
      className="dj-class-photo-card"
      style={{ position: "relative", aspectRatio: "3 / 4", borderRadius: 18, overflow: "hidden", cursor: "pointer", background: "#23211D", boxShadow: "0 14px 30px -18px rgba(35,33,29,0.5)" }}
      onClick={() => { if (!reorderMode) onOpen(classItem); }}
    >
      <ClassCoverImage classItem={classItem} />
      <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(20,18,14,0.35) 0%, rgba(20,18,14,0) 32%, rgba(20,18,14,0.88) 100%)" }} />
      <div style={{ position: "absolute", top: 10, left: 10, right: 10, display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 6 }}>
        {isOneOnOneClass ? (
          <span style={{ ...styles.statusBadge, background: badge.background, color: badge.color, border: "none" }}>{batchComplete ? "✓ " : ""}{activeBatch}</span>
        ) : (
          <div style={{ ...styles.statusBadge, background: badge.background, color: badge.color, border: "none", display: "flex", flexDirection: "column", alignItems: "flex-start", gap: 2, textTransform: "none", letterSpacing: 0, padding: "6px 10px" }}>
            <span style={{ fontWeight: 700 }}>{batchComplete ? "✓ " : ""}{activeBatch} - {batchMembers.length} member{batchMembers.length === 1 ? "" : "s"}</span>
            <span style={{ fontWeight: 600, fontSize: 9.5, opacity: 0.9 }}>{nextSession ? `Next: ${nextSession.name}` : (batchTs.length ? "All sessions conducted" : "No sessions yet")}</span>
          </div>
        )}
        {reorderMode ? (
          <span style={{ ...styles.statusBadge, background: "rgba(20,18,14,0.65)", color: "#F5F2E4", border: "none", fontSize: 12 }}>#{position}</span>
        ) : isLeader && (
          <div style={{ display: "flex", gap: 6 }} onClick={(e) => e.stopPropagation()}>
            <button style={styles.iconEdit} onClick={() => onEditClass(classItem)} title="Edit class">✎</button>
            <button style={styles.iconDanger} onClick={() => onDeleteClass(classItem.id, classItem.name)} title="Delete class">×</button>
          </div>
        )}
      </div>
      {reorderMode && (
        <div style={{ position: "absolute", left: 0, right: 0, top: "38%", display: "flex", justifyContent: "center", gap: 8 }} onClick={(e) => e.stopPropagation()}>
          {[
            { action: "first", label: "⇤", title: "Move to first", disabled: isFirst },
            { action: "left", label: "◀", title: "Move earlier", disabled: isFirst },
            { action: "right", label: "▶", title: "Move later", disabled: isLast },
          ].map((b) => (
            <button
              key={b.action}
              type="button"
              title={b.title}
              aria-label={b.title}
              disabled={b.disabled}
              onClick={() => onMove(classItem.id, b.action)}
              style={{ width: 40, height: 40, borderRadius: "50%", border: "none", background: "rgba(245,242,228,0.92)", color: "#1F3864", fontSize: 16, fontWeight: 700, cursor: b.disabled ? "default" : "pointer", opacity: b.disabled ? 0.35 : 1, boxShadow: "0 4px 12px rgba(0,0,0,0.3)" }}
            >
              {b.label}
            </button>
          ))}
        </div>
      )}
      <div style={{ position: "absolute", left: 12, right: 12, bottom: 12 }}>
        <div style={{ fontFamily: "Georgia, serif", fontSize: 16, fontWeight: 700, color: "#F5F2E4", lineHeight: 1.2 }}>{classItem.name}</div>
        <div style={{ height: 4, borderRadius: 20, background: "rgba(255,255,255,0.25)", marginTop: 9, overflow: "hidden" }}>
          <div style={{ width: `${Math.max(0, Math.min(100, batchPct))}%`, height: "100%", background: "#E5A430" }} />
        </div>
        {isOneOnOneClass ? (
          <>
            <div style={{ fontSize: 11, color: "rgba(245,242,228,0.75)", marginTop: 4 }}>{activeBatch} - {batchCompletedCount} Completed - {batchInProgressCount} In progress</div>
            <div style={{ fontSize: 11, color: "rgba(245,242,228,0.75)", marginTop: 2 }}>{totalCompletedCount} Completed - {totalInProgressCount} In progress</div>
          </>
        ) : (
          <>
            <div style={{ fontSize: 11, color: "rgba(245,242,228,0.75)", marginTop: 4 }}>{pct}% overall attendance</div>
            <div style={{ fontSize: 11, color: "rgba(245,242,228,0.75)", marginTop: 2 }}>{totalCompletedCount} Completed - {totalInProgressCount} In progress</div>
          </>
        )}
      </div>
    </div>
  );
}

const detailRow = { display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderRadius: 12, background: "rgba(255,255,255,0.08)", cursor: "pointer" };

// Drag-to-reorder wrapper for a class's session list. Works with
// mouse and touch alike via the Pointer Events API (no native HTML5
// drag-and-drop, which iOS Safari doesn't support on touch). Only the
// small handle icon is draggable — the row itself keeps its normal
// tap-to-open behavior. While a drag is in progress the dragged row
// follows the pointer and the rows between its start and target spot
// shift out of the way; nothing is written until the drag ends, at
// which point onReorder receives the full list of ids in their new
// order for the caller to persist.
function SortableSessionList({ topics, isLeader, renderRow, onReorder }) {
  const [dragId, setDragId] = useState(null);
  const [dragDelta, setDragDelta] = useState(0);
  const dragInfo = useRef(null);
  const rowRefs = useRef({});
  const order = topics.map((t) => t.id);

  const startDrag = (id, e) => {
    if (!isLeader || topics.length < 2) return;
    const idx = order.indexOf(id);
    const el = rowRefs.current[id];
    if (!el) return;
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
    let unit = el.getBoundingClientRect().height + 8;
    const nextEl = rowRefs.current[order[idx + 1]];
    const prevEl = rowRefs.current[order[idx - 1]];
    if (nextEl) unit = nextEl.getBoundingClientRect().top - el.getBoundingClientRect().top;
    else if (prevEl) unit = el.getBoundingClientRect().top - prevEl.getBoundingClientRect().top;
    dragInfo.current = { pointerId: e.pointerId, startY: e.clientY, startIndex: idx, unit, order: [...order] };
    setDragId(id);
    setDragDelta(0);
    e.preventDefault();
    e.stopPropagation();
  };
  const moveDrag = (e) => {
    if (!dragInfo.current) return;
    e.preventDefault();
    setDragDelta(e.clientY - dragInfo.current.startY);
  };
  const endDrag = (e) => {
    const info = dragInfo.current;
    if (!info) return;
    const shift = Math.round(dragDelta / info.unit);
    const targetIndex = Math.max(0, Math.min(info.order.length - 1, info.startIndex + shift));
    dragInfo.current = null;
    setDragId(null);
    setDragDelta(0);
    if (targetIndex !== info.startIndex) {
      const newOrder = [...info.order];
      const [moved] = newOrder.splice(info.startIndex, 1);
      newOrder.splice(targetIndex, 0, moved);
      onReorder(newOrder);
    }
  };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      {topics.map((t, i) => {
        const info = dragInfo.current;
        const isDragged = dragId === t.id;
        let translateY = 0;
        if (info) {
          if (isDragged) {
            translateY = dragDelta;
          } else {
            const idx = info.order.indexOf(t.id);
            const shift = Math.round(dragDelta / info.unit);
            const targetIndex = Math.max(0, Math.min(info.order.length - 1, info.startIndex + shift));
            if (targetIndex > info.startIndex && idx > info.startIndex && idx <= targetIndex) translateY = -info.unit;
            else if (targetIndex < info.startIndex && idx < info.startIndex && idx >= targetIndex) translateY = info.unit;
          }
        }
        return (
          <div
            key={t.id}
            ref={(el) => { rowRefs.current[t.id] = el; }}
            style={{
              position: "relative",
              transform: translateY ? `translateY(${translateY}px)` : undefined,
              transition: isDragged ? "none" : "transform 0.15s ease",
              zIndex: isDragged ? 5 : 1,
              boxShadow: isDragged ? "0 12px 26px rgba(0,0,0,0.3)" : undefined,
            }}
          >
            {renderRow(t, i, {
              onPointerDown: (e) => startDrag(t.id, e),
              onPointerMove: moveDrag,
              onPointerUp: endDrag,
              onPointerCancel: endDrag,
            })}
          </div>
        );
      })}
    </div>
  );
}

function ClassDetailModal({ classItem, classes, topics, members, attendanceByMember, isLeader, onClose, onEditClass, onOpenSession, onOpenClass, onAddTopic, onEditTopic, onDeleteTopic, onOpenMember, onAddBatch, onRenameBatch, onDeleteBatch, onToggleConducted, onAddMember, onReorderTopics }) {

  const [newBatchName, setNewBatchName] = useState("");
  const [addingBatch, setAddingBatch] = useState(false);
  const [addMemberOpen, setAddMemberOpen] = useState(false);
  const batches = useMemo(() => getBatchesForClass(classItem, topics), [classItem, topics]);
  const [selectedBatch, setSelectedBatch] = useState(null);
  // Default to the last (newest, by natural sort) batch so a leader
  // who just added "Batch 2026" lands there automatically.
  const activeBatch = selectedBatch && batches.includes(selectedBatch) ? selectedBatch : batches[batches.length - 1];
  // Only classes that match a Discipleship Track (the app's existing
  // per-class enrollment mechanism) carry a per-member batch label
  // (member.trackBatch). A custom/leader-made class with no matching
  // track has no such label yet, so its member list isn't filtered by
  // batch — only its sessions are.
  const track = trackNameForClass(classItem.name);
  const ts = useMemo(
    () => sortTopicsForDisplay(topicsForClass(topics, classItem.name)).filter((t) => topicBatch(t) === activeBatch),
    [topics, classItem.name, activeBatch]

  // A batch counts as complete once it has at least one session and

  const batchComplete = ts.length > 0 && ts.every((t) => t.conducted);

    if (!track) return allClassMembers;
    return allClassMembers.filter((m) => ((m.trackBatch && m.trackBatch[track]) || "Batch 1") === activeBatch);

  const { segments, total } = classDemographicsSegments(classItem, ts, classMembers, attendanceByMember);

      .map((m) => {

      </div>
      {addMemberOpen && (
        <AddMemberModal
          classes={classes || [classItem]}
          topics={topics}
          members={members}

          initialTrack={track}

    </div>
  );

// session plus every registered member with their "X/Y

function registrationLinkForClass(classId, batch) {
  const base = window.location.href.replace(/[^/]*$/, "");
  const link = `${base}register.html?classId=${classId}`;
  // Only stamp a batch onto the link when one was actually given — this
  // keeps old copied links (and classes with just "Batch 1") behaving
  // exactly as before, while a link copied while a specific batch tab
  // is selected carries that batch so whoever fills it out is enrolled
  // straight into it, no leader follow-up needed.
  return batch ? `${link}&batch=${encodeURIComponent(batch)}` : link;
}

function CopyRegistrationLinkButton({ classId, batch }) {
  const [copied, setCopied] = useState(false);
  const copy = async () => {
    const link = registrationLinkForClass(classId, batch);
    try {
      await navigator.clipboard.writeText(link);
    } catch (err) {
      window.prompt("Copy this registration link:", link);
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };
  return (
    <div style={{ display: "inline-flex", flexDirection: "column", gap: 3 }}>
      <button style={styles.ghostBtn} onClick={copy}>{copied ? "Copied!" : "Copy Registration Link"}</button>
      {batch && <span style={{ fontSize: 11, color: "#7A6E4E" }}>Links new sign-ups straight into {batch}</span>}
    </div>
  );
}

// Same idea as registrationLinkForClass/CopyRegistrationLinkButton, but
// for a specific ONE2ONE leader — the link is keyed to that leader's
// email (not a classId), so register.html knows whose ONE2ONE tracker
// a self-registration should land under (see the "one2one" query param
// handling in register.html, and the matching Firestore rule that only
// lets this succeed for an email that already has a one2oneLeaders doc).
function registrationLinkForOneOnOne(leaderEmail) {
  const base = window.location.href.replace(/[^/]*$/, "");
  return `${base}register.html?one2one=${encodeURIComponent(leaderEmail)}`;
}

function CopyOneOnOneRegistrationLinkButton({ leaderEmail }) {
  const [copied, setCopied] = useState(false);
  const copy = async () => {
    const link = registrationLinkForOneOnOne(leaderEmail);
    try {
      await navigator.clipboard.writeText(link);
    } catch (err) {
      window.prompt("Copy this registration link:", link);
    }
    setCopied(true);
    setTimeout(() => setCopied(false), 2000);
  };
  return <button style={styles.ghostBtn} onClick={copy}>{copied ? "Copied!" : "Copy Registration Link"}</button>;
}

    return classMembers
      .map((m) => {
        const att = attendanceByMember[m.id] || {};
        const done = ts.filter((t) => att[t.id] && att[t.id].attended).length;
        const pct = ts.length ? Math.round((done / ts.length) * 100) : 0;
        return { member: m, done, total: ts.length, pct };
      })
      .sort((a, b) => b.pct - a.pct || a.member.name.localeCompare(b.member.name));
  }, [classMembers, attendanceByMember, ts]);

  return (
    <div>
      <a style={styles.backLink} onClick={onBack}>&larr; Back to Classes</a>

      <div style={styles.profileHeader}>

          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>

            {ts.length} session{ts.length === 1 ? "" : "s"} · {classMembers.length} member{classMembers.length === 1 ? "" : "s"}

        </div>
        {isLeader && !isOneOnOneClassName(classItem.name) && <CopyRegistrationLinkButton classId={classItem.id} batch={activeBatch} />}

      {(batches.length > 1 || isLeader) && (
        <div style={styles.lightCard}>
          <div style={styles.sectionLabel}>Batch</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center", marginTop: 8 }}>
            {batches.map((b) => (
              <div key={b} style={{ display: "flex", alignItems: "center", gap: 1 }}>
                <button
                  type="button"
                  onClick={() => setSelectedBatch(b)}
                  style={{
                    padding: "6px 14px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer",
                    border: b === activeBatch ? "1px solid #1F3864" : "1px solid rgba(31,56,100,0.25)",
                    background: b === activeBatch ? "#1F3864" : "rgba(31,56,100,0.06)",
                    color: b === activeBatch ? "#F5F2E4" : "#23211D",
                  }}
                >
                  {b}
                </button>
                {isLeader && b === activeBatch && (
                  <>
                    <button type="button" onClick={() => onRenameBatch(classItem.id, b)} title="Rename batch" style={{ background: "transparent", border: "none", color: "#1F3864", cursor: "pointer", fontSize: 12, padding: "2px 5px", opacity: 0.75 }}>✎</button>
                    {batches.length > 1 && (
                      <button type="button" onClick={() => onDeleteBatch(classItem.id, b)} title="Delete batch" style={{ background: "transparent", border: "none", color: "#1F3864", cursor: "pointer", fontSize: 15, padding: "2px 5px", opacity: 0.75 }}>×</button>
                    )}

            ))}

              <button type="button" onClick={() => setAddingBatch(true)} style={{ padding: "6px 14px", borderRadius: 20, fontSize: 12.5, fontWeight: 600, cursor: "pointer", border: "1px dashed rgba(31,56,100,0.35)", background: "transparent", color: "#23211D" }}>+ Add Batch</button>
            )}
            {isLeader && addingBatch && (
              <div style={{ display: "flex", gap: 6 }}>
                <input
                  autoFocus
                  style={{ ...styles.roleEditInput, width: 140 }}

                />

              </div>
            )}

        </div>
      )}

      <div style={styles.lightCard}>

        </div>
        {ts.length === 0 ? (
          <div style={styles.emptyNote}>No sessions yet in {activeBatch}.</div>
        ) : (
          <div style={{ marginTop: 10 }}>
            <SortableSessionList
              topics={ts}
              isLeader={isLeader}
              onReorder={onReorderTopics}
              renderRow={(t, i, dragHandlers) => {
                const { attended, notAttended } = topicAttendanceLists(classMembers, attendanceByMember, t.id);
                const total = attended.length + notAttended.length;
                const pct = total ? Math.round((attended.length / total) * 100) : 0;
                return (
                  <div className="card-row" style={styles.rosterCard} onClick={() => onOpenSession(t)}>

// ============================================================
// ONE2ONE — a personal discipleship tracker. Unlike the shared
// Classes/Members roster, access is role-based:
//  - ONE2ONE leaders (Settings > ONE2ONE Leaders) only get this
//    tab, and only see/edit the people they themselves added.
//  - Leaders and Managers see and can edit everyone's ONE2ONE
//    members (each row shows who added them).
// ============================================================

// The ONE2ONE class in the Classes tab (any class whose name starts
// with "ONE2ONE") is the single source of truth for sessions: every
// person added here automatically gets that class's sessions, and
// their own progress is stored on their doc as progress[topicId].
// Any class whose name starts with "ONE2ONE" (once punctuation/spacing
// is stripped) is treated as the ONE2ONE class — used both to find that
// class and to hide the public self-registration link on it (ONE2ONE
// members are added by leaders in the ONE2ONE tab instead; see
// addOneOnOnePerson and the QR handoff that follows it).
function isOneOnOneClassName(name) {
  return (name || "").toLowerCase().replace(/[^a-z0-9]/g, "").startsWith("one2one");
}
function findOneOnOneClass(classes) {
  return classes.find((c) => isOneOnOneClassName(c.name)) || null;
}
function oneOnOneClassSessions(classItem, topics) {
  if (!classItem) return [];
  const firstBatch = getBatchesForClass(classItem, topics)[0];
  return sortTopicsForDisplay(topicsForClass(topics, classItem.name).filter((t) => topicBatch(t) === firstBatch));
}
function isOneOnOneSessionDone(person, topic, attendanceByMember) {
  const p = person.progress && person.progress[topic.id];
  if (p && p.conducted) return true;
  // Marked present in the Classes tab for the linked Disciples member.
  const att = attendanceByMember && person.memberId && attendanceByMember[person.memberId] && attendanceByMember[person.memberId][topic.id];
  if (att && att.attended) return true;
  if (p) return false;
  // Older ONE2ONE entries stored their own session list — match by name.
  const legacy = (person.sessions || []).find((x) => x.name === topic.name);
  return !!(legacy && legacy.conducted);
}
function oneOnOneDoneCount(person, sessions, attendanceByMember) {
  return sessions.filter((t) => isOneOnOneSessionDone(person, t, attendanceByMember)).length;
}

function OneOnOneFormModal({ title, initial, submitLabel, members, onClose, onSave }) {
  const init = initial || {};
  const [name, setName] = useState(init.name || "");
  const [photoUrl, setPhotoUrl] = useState(init.photoUrl || null);
  const [birthdate, setBirthdate] = useState(init.birthdate || "");
  const [gender, setGender] = useState(init.gender || "");
  const [lifeStage, setLifeStage] = useState(init.lifeStage || "");
  const [contactNumber, setContactNumber] = useState(init.contactNumber || "");
  const [address, setAddress] = useState(init.address || "");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!name.trim()) { setError("Please enter the member's full name."); return; }
    if (!birthdate) { setError("Please enter a birthdate."); return; }
    if (!gender) { setError("Please select a gender."); return; }
    if (!lifeStage) { setError("Please select a life stage."); return; }
    if (!contactNumber.trim()) { setError("Please enter a contact number."); return; }
    if (!address.trim()) { setError("Please enter an address."); return; }
    setError("");
    setBusy(true);
    try {
      await onSave({ name: name.trim(), photoUrl: photoUrl || null, birthdate, gender, lifeStage, contactNumber: contactNumber.trim(), address: address.trim() });
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={styles.modalOverlay} onClick={onClose}>
      <form style={{ ...styles.modalCard, maxHeight: "92vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()} onSubmit={submit}>
        <div style={styles.modalTitle}>{title}</div>

function OneOnOneCard({ person, sessions, attendanceByMember, showAdder, onOpen, onEdit, onDelete }) {
  const done = oneOnOneDoneCount(person, sessions, attendanceByMember);
  const pct = sessions.length ? Math.round((done / sessions.length) * 100) : 0;
  const badge = person.status === "pending" ? PHOTO_BADGE.pending
    : person.status === "rejected" ? PHOTO_BADGE.rejected
    : pct >= 100 ? PHOTO_BADGE.done : pct > 0 ? PHOTO_BADGE.progress : PHOTO_BADGE.none;
  return (
    <div
      className="dj-class-photo-card"
      style={{ position: "relative", aspectRatio: "3 / 4", borderRadius: 18, overflow: "hidden", cursor: "pointer", background: "#23211D", boxShadow: "0 14px 30px -18px rgba(35,33,29,0.5)" }}
      onClick={() => onOpen(person)}
    >
      <ClassCoverImage classItem={{ name: person.name, photoUrl: person.photoUrl }} />
      <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(20,18,14,0.35) 0%, rgba(20,18,14,0) 32%, rgba(20,18,14,0.88) 100%)" }} />
      <div style={{ position: "absolute", top: 10, left: 10, right: 10, display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 6 }}>
        <span style={{ ...styles.statusBadge, background: badge.background, color: badge.color, border: "none" }}>{pct >= 100 && person.status !== "pending" && person.status !== "rejected" ? "✓ " : ""}{badge.label}</span>
        <div style={{ display: "flex", gap: 6 }} onClick={(e) => e.stopPropagation()}>
          <button style={styles.iconEdit} onClick={() => onEdit(person)} title="Edit">✎</button>
          <button style={styles.iconDanger} onClick={() => onDelete(person.id, person.name)} title="Remove">×</button>
        </div>
      </div>
      <div style={{ position: "absolute", left: 12, right: 12, bottom: 12 }}>
        <div style={{ fontFamily: "Georgia, serif", fontSize: 16, fontWeight: 700, color: "#F5F2E4", lineHeight: 1.2 }}>{person.name}</div>
        <div style={{ height: 4, borderRadius: 20, background: "rgba(255,255,255,0.25)", marginTop: 9, overflow: "hidden" }}>
          <div style={{ width: `${pct}%`, height: "100%", background: "#E5A430" }} />
        </div>
        <div style={{ fontSize: 11, color: "rgba(245,242,228,0.75)", marginTop: 4 }}>{done} of {sessions.length} session{sessions.length === 1 ? "" : "s"} done</div>
        {showAdder && person.createdBy && (
          <div style={{ fontSize: 10.5, color: "rgba(245,242,228,0.6)", marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>Added by {person.createdBy}</div>
        )}

    </div>
  );
}

function OneOnOne({ people, sessions, attendanceByMember, hasClass, onAdd, onOpen, onEdit, onDelete, showAll, needsProfile, onCreateProfile, onToggleSession, leaderEmail }) {
  const [scanOpen, setScanOpen] = useState(false);
  // A ONE2ONE-only leader who hasn't set up their own profile yet (no
  // name/photo on their one2oneLeaders doc) sees a create-profile prompt
  // instead of the member tracker — see updateOneOnOneLeaderProfile's note
  // about what a "profile" is. Leaders/Managers never pass needsProfile.
  if (needsProfile) {
    return (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <div style={styles.lightCard}>
          <div style={styles.sectionLabel}>Set up your ONE2ONE profile</div>
          <div style={{ fontSize: 13.5, color: "#4A4230", marginBottom: 14 }}>
            Create your profile so Leaders and Managers can find you and see the members you've added. It only takes a name and, optionally, a photo.
          </div>
          <button style={styles.primaryBtn} onClick={onCreateProfile}>+ Create Profile</button>
        </div>
      </div>
    );
  }
  // Quick counts across every member you've added, so you can see at a
  // glance how many have finished all their sessions vs. still going —
  // same categories/colors as each member's own card badge.
  const summary = useMemo(() => {
    const tally = { done: 0, progress: 0, none: 0, pending: 0, rejected: 0 };
    people.forEach((p) => {
      if (p.status === "pending") { tally.pending++; return; }
      if (p.status === "rejected") { tally.rejected++; return; }
      const pct = sessions.length ? Math.round((oneOnOneDoneCount(p, sessions, attendanceByMember) / sessions.length) * 100) : 0;
      if (pct >= 100) tally.done++;
      else if (pct > 0) tally.progress++;
      else tally.none++;
    });
    return tally;
  }, [people, sessions, attendanceByMember]);
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div className="stack-mobile" style={styles.toolbar}>
        <div style={{ flex: 1, fontSize: 13, color: "#7A6E4E", alignSelf: "center" }}>
          {showAll ? "All ONE2ONE members from every ONE2ONE leader." : "Your own ONE2ONE tracker — only people you've added show up here."}
        </div>
        {leaderEmail && <CopyOneOnOneRegistrationLinkButton leaderEmail={leaderEmail} />}
        {!showAll && sessions.length > 0 && <button style={styles.ghostBtn} onClick={() => setScanOpen(true)}>Scan Attendance</button>}
        <button style={styles.primaryBtn} onClick={onAdd}>+ Add Member</button>
      </div>

      {scanOpen && (
        <ScanOneOnOneAttendanceModal
          sessions={sessions}
          people={people}
          attendanceByMember={attendanceByMember}
          onToggleSession={onToggleSession}
          onClose={() => setScanOpen(false)}
        />
      )}

      {people.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          <span style={{ ...styles.statusBadge, background: PHOTO_BADGE.done.background, color: PHOTO_BADGE.done.color, border: "none" }}>{summary.done} Completed</span>
          <span style={{ ...styles.statusBadge, background: PHOTO_BADGE.progress.background, color: PHOTO_BADGE.progress.color, border: "none" }}>{summary.progress} In Progress</span>
          {summary.none > 0 && <span style={{ ...styles.statusBadge, background: PHOTO_BADGE.none.background, color: PHOTO_BADGE.none.color, border: "none" }}>{summary.none} Not Started</span>}
          {summary.pending > 0 && <span style={{ ...styles.statusBadge, background: PHOTO_BADGE.pending.background, color: PHOTO_BADGE.pending.color, border: "none" }}>{summary.pending} Pending</span>}
          {summary.rejected > 0 && <span style={{ ...styles.statusBadge, background: PHOTO_BADGE.rejected.background, color: PHOTO_BADGE.rejected.color, border: "none" }}>{summary.rejected} Rejected</span>}
        </div>
      )}

      {!hasClass && (
        <div style={styles.emptyNote}>No class named ONE2ONE was found in the Classes tab yet. Once a leader creates it and adds its sessions, those sessions will show up here for every member.</div>
      )}

      {people.length === 0 ? (
        <div style={styles.emptyNote}>{showAll ? "No one has been added to ONE2ONE yet." : "You haven't added anyone to ONE2ONE yet."}</div>
      ) : (
        <div className="dj-classes-grid" style={styles.classesGrid}>
          {people.map((p) => (
            <OneOnOneCard
              key={p.id}
              person={p}
              sessions={sessions}
              attendanceByMember={attendanceByMember}
              showAdder={showAll}
              onOpen={onOpen}
              onEdit={onEdit}
              onDelete={onDelete}
            />
          ))}
        </div>
      )}
    </div>
  );
}

// A round photo picker for a person's own profile picture (as opposed
// to ClassPhotoPicker's wide 16:9 cover picker) — used for the ONE2ONE
// leader's profile pic, which now shows as a circular avatar rather
// than a banner image.
function AvatarPhotoPicker({ name, photoUrl, onChange }) {
  const inputRef = useRef(null);
  const [busy, setBusy] = useState(false);
  const handleFile = async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setBusy(true);
    try {
      onChange(await resizeImageToDataUrl(file, 500, 0.8));
    } catch (err) {
      showError("Could not process the photo. Please try again.");
    } finally {
      setBusy(false);
    }
  };
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 12 }}>
      <div style={{ width: 72, height: 72, borderRadius: "50%", flexShrink: 0, overflow: "hidden" }}>
        <Avatar name={name} photoUrl={photoUrl} size={72} />
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        <button type="button" style={styles.ghostBtn} onClick={() => inputRef.current && inputRef.current.click()} disabled={busy}>
          {busy ? "Processing…" : photoUrl ? "Change photo" : "Upload photo"}
        </button>
        {photoUrl && <button type="button" style={{ ...styles.ghostBtn, color: "#8C2E2E" }} onClick={() => onChange(null)} disabled={busy}>Remove</button>}
      </div>
      <input ref={inputRef} type="file" accept="image/*" style={{ display: "none" }} onChange={handleFile} />
    </div>
  );
}

function OneOnOneDetailModal({ person, sessions, attendanceByMember, hasClass, onClose, onEdit, onToggleSession, isLeader, leaderOptions, onMove }) {
  const done = oneOnOneDoneCount(person, sessions, attendanceByMember);
  const pct = sessions.length ? Math.round((done / sessions.length) * 100) : 0;
  const roundBtn = { position: "absolute", top: 12, background: "rgba(20,18,14,0.45)", border: "none", borderRadius: "50%", width: 32, height: 32, color: "#F5F2E4", fontSize: 18, cursor: "pointer", lineHeight: 1, zIndex: 3 };
  // Leaders/Managers can reassign a ONE2ONE member to a different
  // ONE2ONE leader — this just changes whose tracker the person shows
  // up under (their createdBy field); session progress is untouched.
  // Only shown to isLeader (full Leaders/Managers); a ONE2ONE-only
  // leader never sees this modal with isLeader=true, so they can't
  // move members away from themselves or each other.
  const currentOwner = normEmail(person.createdBy);
  const moveChoices = (leaderOptions || []).filter((l) => l.id !== currentOwner);
  const [moveTarget, setMoveTarget] = useState("");
  const [moving, setMoving] = useState(false);
  const [qrOpen, setQrOpen] = useState(false);
  const doMove = async () => {
    if (!moveTarget) return;
    setMoving(true);
    try {
      await onMove(person, moveTarget);
      setMoveTarget("");
    } finally {
      setMoving(false);
    }
  };

  return (

function PendingRegistrationRow({ pending, classes, members, onApprove, onReject }) {
  const [expanded, setExpanded] = useState(false);
  const className = (classes.find((c) => c.id === (pending.classIds || [])[0]) || {}).name || "(class removed)";
  const duplicates = useMemo(() => findPossibleDuplicates(members, pending.name), [members, pending.name]);
  // Always default to "Add as new person" — merging must be a deliberate
  // choice by the leader, since merging unions classIds and would enroll
  // the person in whatever other class(es) the matched member already
  // belongs to, not just the one they registered for here.
  const [mergeId, setMergeId] = useState("");
  const [busy, setBusy] = useState(false);

  const approve = async () => {
    if (!mergeId && duplicates.length > 0) {
      const names = duplicates.map((d) => d.name).join(", ");
      if (!(await askConfirm({
        title: "Add as a new person?",
        message: `Disciples already has ${duplicates.length > 1 ? "members" : "a member"} named ${names}. Approving now will create a separate, new person instead of merging. Continue only if ${pending.name} is really a different person.`,
        confirmLabel: "Add as new person",
        danger: true,
      }))) return;
    }
    setBusy(true);
    try {
      await onApprove(pending, mergeId || null);
    } finally {
      setBusy(false);
    }
  };
  const reject = async () => {
    if (!(await askConfirm({ title: "Reject registration?", message: `${pending.name}'s registration will be rejected. This can't be undone.`, confirmLabel: "Reject", danger: true }))) return;
    setBusy(true);
    try {
      await onReject(pending);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={styles.lightCard}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontWeight: 700, color: "#23211D" }}>{pending.name}</div>
          <div style={styles.rosterMeta}>
            Wants to join <strong>{className}</strong>
            {(() => {
              const pAge = pending.birthdate ? ageFromBirthdate(pending.birthdate) : pending.age;
              return (pAge || pending.gender || pending.lifeStage) ? ` · ${[pAge ? `Age ${pAge}` : null, pending.gender || null, pending.lifeStage || null].filter(Boolean).join(", ")}` : "";
            })()}
            {pending.dateAdded ? ` · Submitted ${fmtDateTime(pending.dateAdded)}` : ""}
          </div>
        </div>
        <button style={styles.ghostBtn} onClick={() => setExpanded((v) => !v)}>{expanded ? "Hide details" : "Details"}</button>
      </div>

      {expanded && (
        <div style={{ marginTop: 10, fontSize: 13.5, color: "#4A4230", display: "flex", flexDirection: "column", gap: 4 }}>
          {pending.contactNumber && <div><strong>Contact: </strong>{pending.contactNumber}</div>}
          {pending.address && <div><strong>Address: </strong>{pending.address}</div>}
          {pending.notes && <div><strong>Notes: </strong>{pending.notes}</div>}
          {!pending.contactNumber && !pending.address && !pending.notes && (
            <div style={{ color: "#7A6E4E", fontStyle: "italic" }}>No other details provided.</div>
          )}
        </div>
      )}

      {duplicates.length > 0 && (
        <div style={{ marginTop: 12 }}>
          <div style={styles.sectionLabel}>Possible existing match</div>
          <div style={styles.pairNote}>Someone in Disciples already has this exact name. Merge instead of creating a duplicate person, or pick "Add as new person" if it's someone else.</div>
          <select style={styles.modalInput} value={mergeId} onChange={(e) => setMergeId(e.target.value)}>
            <option value="">Add as new person</option>
            {duplicates.map((d) => (
              <option key={d.id} value={d.id}>Merge into existing: {d.name}</option>
            ))}
          </select>
        </div>
      )}

      <div style={{ ...styles.modalActions, justifyContent: "flex-start", marginTop: 12 }}>
        <button style={styles.modalConfirmBtn} disabled={busy} onClick={approve}>
          {busy ? "Working…" : mergeId ? "Approve & Merge" : "Approve"}
        </button>
        <button style={styles.dangerLink} disabled={busy} onClick={reject}>Reject</button>
      </div>
    </div>
  );
}
