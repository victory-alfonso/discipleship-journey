function fmtDate(d) {
  if (!d) return "";
  const dt = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(dt.getTime())) return "";
  return dt.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function toDateInputValue(d) {
  if (!d) return "";
  const dt = d.toDate ? d.toDate() : new Date(d);
  if (isNaN(dt.getTime())) return "";
  const yyyy = dt.getFullYear();
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  const dd = String(dt.getDate()).padStart(2, "0");
  return `${yyyy}-${mm}-${dd}`;
}

// ============================================================
// DISCIPLES JOURNEY — default class / session structure
// ============================================================
// Spiritual Foundations runs 1–10 sessions, Making Disciples runs
// 1–2 sessions, and Empowering Leaders is a single session. These
// are used to seed the "classes" and "topics" collections the
// first time a leader sets up the app (see the "Load Disciples
// Journey Classes" button on the Classes tab).
const DEFAULT_CLASSES = [
  { name: "Spiritual Foundations", order: 1, sessionCount: 10 },
  { name: "Making Disciples Class", order: 2, sessionCount: 2 },
  { name: "Empowering Leaders Class", order: 3, sessionCount: 1 },
];

const LIFE_STAGES = ["Single", "Married", "ENC"];
const GENDERS = ["Male", "Female"];

// ============================================================
// HELPERS — attendance / progress calculations
// ============================================================

function topicsForClass(topics, className) {
  return topics.filter((t) => t.class === className);
}

function classProgressPct(className, topics, attendanceByMember, memberId) {
  const ts = topicsForClass(topics, className);
  if (ts.length === 0) return 0;
  const att = attendanceByMember[memberId] || {};
  const done = ts.filter((t) => att[t.id] && att[t.id].attended).length;
  return Math.round((done / ts.length) * 100);
}

function overallProgressPct(topics, attendanceByMember, memberId) {
  if (topics.length === 0) return 0;
  const att = attendanceByMember[memberId] || {};
  const done = topics.filter((t) => att[t.id] && att[t.id].attended).length;
  return Math.round((done / topics.length) * 100);
}

function completedClassesCount(classes, topics, attendanceByMember, memberId) {
  return classes.filter((c) => {
    const ts = topicsForClass(topics, c.name);
    if (ts.length === 0) return false;
    return classProgressPct(c.name, topics, attendanceByMember, memberId) === 100;
  }).length;
}

function topicAttendanceLists(members, attendanceByMember, topicId) {
  const attended = [];
  const notAttended = [];
  (members || []).forEach((m) => {
    const a = (attendanceByMember[m.id] || {})[topicId];
    if (a && a.attended) {
      attended.push({ ...m, _attendance: a });
    } else {
      notAttended.push(m);
    }
  });
  attended.sort((a, b) => a.name.localeCompare(b.name));
  notAttended.sort((a, b) => a.name.localeCompare(b.name));
  return { attended, notAttended };
}

// FIRESTORE HOOKS — live-sync collections into React state
// ============================================================

function useCollection(path, orderField) {
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    if (!db) { setLoading(false); return; }
    let ref = db.collection(path);
    const unsub = ref.onSnapshot((snap) => {
      let rows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      if (orderField) rows.sort((a, b) => (a[orderField] || 0) - (b[orderField] || 0));
      setData(rows);
      setLoading(false);
    }, (err) => { console.error(path, err); setLoading(false); });
    return unsub;
  }, [path, orderField]);
  return [data, loading];
}

// ============================================================
// AUTH SCREEN — email/password sign in, sign up, reset
// ============================================================

function AuthScreen() {
  const [mode, setMode] = useState("login"); // login | signup | reset
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const [notice, setNotice] = useState("");

  const submit = async (e) => {
    e.preventDefault();
    setError(""); setNotice(""); setBusy(true);
    const cleanEmail = normEmail(email);
    try {
      if (mode === "reset") {
        await auth.sendPasswordResetEmail(cleanEmail);
        setNotice("Password reset email sent. Check your inbox.");
      } else if (mode === "signup") {
        const cred = await auth.createUserWithEmailAndPassword(cleanEmail, password);
        if (name.trim()) await cred.user.updateProfile({ displayName: name.trim() });
      } else {
        await auth.signInWithEmailAndPassword(cleanEmail, password);
      }
    } catch (err) {
      setError(err.message || "Something went wrong.");
    } finally {
      setBusy(false);
    }
  };

  if (!FIREBASE_CONFIGURED) {
    return (
      <div style={styles.authWrap}>
        <div style={styles.authCard}>
          <h1 style={styles.authTitle}>Class Attendance</h1>
          <p style={styles.authBody}>
            This app isn't connected to Firebase yet. Paste your project's{" "}
            <code style={styles.code}>firebaseConfig</code> near the top of{" "}
            <code style={styles.code}>index.html</code>, then reload.
          </p>
        </div>
      </div>
    );
  }

  return (
    <div style={styles.authWrap}>
      <form style={styles.authCard} onSubmit={submit}>
        <h1 style={styles.authTitle}>Class Attendance</h1>
        <p style={styles.authSubtitle}>
          {mode === "login" && "Sign in to continue."}
          {mode === "signup" && "Create an account."}
          {mode === "reset" && "We'll email you a reset link."}
        </p>

        {mode === "signup" && (
          <input style={styles.authInput} placeholder="Your name" value={name} onChange={(e) => setName(e.target.value)} />
        )}
        <input style={styles.authInput} type="email" placeholder="Email" value={email} onChange={(e) => setEmail(e.target.value)} required />
        {mode !== "reset" && (
          <input style={styles.authInput} type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} required minLength={6} />
        )}

        {error && <div style={styles.authError}>{error}</div>}
        {notice && <div style={styles.authNotice}>{notice}</div>}

        <button style={styles.authSubmit} disabled={busy} type="submit">
          {busy ? "Please wait…" : mode === "login" ? "Sign In" : mode === "signup" ? "Sign Up" : "Send Reset Link"}
        </button>

        <div style={styles.authLinks}>
          {mode !== "login" && <a style={styles.authLink} onClick={() => setMode("login")}>Sign in</a>}
          {mode !== "signup" && <a style={styles.authLink} onClick={() => setMode("signup")}>Create account</a>}
          {mode !== "reset" && <a style={styles.authLink} onClick={() => setMode("reset")}>Forgot password?</a>}
        </div>
      </form>
    </div>
  );
}

// ============================================================

function Roster({ members, classes, topics, attendanceByMember, isLeader, onOpen, onAdd }) {
  const [query, setQuery] = useState("");
  const [lifeStageFilter, setLifeStageFilter] = useState("");
  const [genderFilter, setGenderFilter] = useState("");
  const [classFilter, setClassFilter] = useState("");
  const [minAge, setMinAge] = useState("");
  const [maxAge, setMaxAge] = useState("");

  const filtered = members.filter((m) => {
    if (query) {
      const q = query.toLowerCase();
      const haystack = [m.name, m.contactNumber, m.address].filter(Boolean).join(" ").toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    if (lifeStageFilter && m.lifeStage !== lifeStageFilter) return false;
    if (genderFilter && m.gender !== genderFilter) return false;
    if (minAge && !(typeof m.age === "number" && m.age >= Number(minAge))) return false;
    if (maxAge && !(typeof m.age === "number" && m.age <= Number(maxAge))) return false;
    if (classFilter) {
      const pct = classProgressPct(classFilter, topics, attendanceByMember, m.id);
      if (pct <= 0) return false;
    }
    return true;
  });
  const totalClasses = classes.filter((c) => topicsForClass(topics, c.name).length > 0).length;
  const anyFilterActive = query || lifeStageFilter || genderFilter || classFilter || minAge || maxAge;
  const clearFilters = () => { setQuery(""); setLifeStageFilter(""); setGenderFilter(""); setClassFilter(""); setMinAge(""); setMaxAge(""); };

  return (
    <div>
      <div style={{ ...styles.toolbar, ...styles.stackMobileFlex }}>
        <input style={styles.toolbarInput} placeholder="Search name, contact number, or address…" value={query} onChange={(e) => setQuery(e.target.value)} />
        {isLeader && <button style={styles.primaryBtn} onClick={onAdd}>+ Add Member</button>}
      </div>

      <div style={{ ...styles.toolbar, ...styles.stackMobileFlex, marginTop: -10 }}>
        <select style={styles.toolbarInput} value={genderFilter} onChange={(e) => setGenderFilter(e.target.value)}>
          <option value="">Gender: All</option>
          {GENDERS.map((g) => <option key={g} value={g}>{g}</option>)}
        </select>
        <select style={styles.toolbarInput} value={lifeStageFilter} onChange={(e) => setLifeStageFilter(e.target.value)}>
          <option value="">Life stage: All</option>
          {LIFE_STAGES.map((ls) => <option key={ls} value={ls}>{ls}</option>)}
        </select>
        <select style={styles.toolbarInput} value={classFilter} onChange={(e) => setClassFilter(e.target.value)}>
          <option value="">Class: All</option>
          {classes.map((c) => <option key={c.id} value={c.name}>{c.name}</option>)}
        </select>
        <input style={{ ...styles.toolbarInput, flex: "0 1 90px", minWidth: 70 }} type="number" min="0" placeholder="Min age" value={minAge} onChange={(e) => setMinAge(e.target.value)} />
        <input style={{ ...styles.toolbarInput, flex: "0 1 90px", minWidth: 70 }} type="number" min="0" placeholder="Max age" value={maxAge} onChange={(e) => setMaxAge(e.target.value)} />
        {anyFilterActive && <button style={styles.ghostBtn} onClick={clearFilters}>Clear filters</button>}
      </div>

      {filtered.length === 0 && <div style={styles.emptyNote}>{members.length === 0 ? "No members yet." : "No members match these filters."}</div>}

      <div style={styles.rosterList}>
        {filtered.map((m) => {
          const pct = overallProgressPct(topics, attendanceByMember, m.id);
          const done = completedClassesCount(classes, topics, attendanceByMember, m.id);
          return (
            <div key={m.id} className="card-row" style={styles.rosterCard} onClick={() => onOpen(m)}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={styles.rosterName}>{m.name}</div>
                <div style={styles.rosterMeta}>
                  {done} of {totalClasses} classes completed
                  {(m.age || m.gender || m.lifeStage) ? ` · ${[m.age ? `Age ${m.age}` : null, m.gender || null, m.lifeStage || null].filter(Boolean).join(", ")}` : ""}
                  {m.contactNumber ? ` · ${m.contactNumber}` : ""}
                  {m.notes ? ` · ${m.notes}` : ""}
                </div>
                <ProgressBar pct={pct} />
              </div>
              <div style={styles.rosterPct}>{pct}%</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// MEMBER PROFILE — per-class topic attendance
// ============================================================

function MemberProfile({ member, classes, topics, attendanceByMember, isLeader, onBack, onToggleAttendance, onSetAttendanceDate, onDeleteMember, onEdit }) {
  const att = attendanceByMember[member.id] || {};
  const overallPct = overallProgressPct(topics, attendanceByMember, member.id);
  const missing = topics.filter((t) => !(att[t.id] && att[t.id].attended));

  const topicById = useMemo(() => {
    const map = {};
    topics.forEach((t) => { map[t.id] = t; });
    return map;
  }, [topics]);

  const history = useMemo(() => {
    return Object.values(att)
      .filter((a) => a.attended && a.dateAttended && topicById[a.topicId])
      .map((a) => ({ ...a, topic: topicById[a.topicId] }))
      .sort((a, b) => {
        const da = a.dateAttended.toDate ? a.dateAttended.toDate() : new Date(a.dateAttended);
        const db = b.dateAttended.toDate ? b.dateAttended.toDate() : new Date(b.dateAttended);
        return db - da;
      });
  }, [att, topicById]);

  return (
    <div>
      <a style={styles.backLink} onClick={onBack}>&larr; Back to roster</a>

      <div style={styles.profileHeader}>
        <div>
          <h2 style={styles.profileName}>{member.name}</h2>
          <div style={styles.rosterMeta}>
            {[member.age ? `Age ${member.age}` : null, member.gender || null, member.lifeStage || null].filter(Boolean).join(" · ") || "No details"}
          </div>
          {member.notes && <div style={styles.rosterMeta}>{member.notes}</div>}
        </div>
        {isLeader && (
          <div style={{ display: "flex", gap: 14, alignItems: "center", flexShrink: 0 }}>
            <button style={styles.ghostBtn} onClick={onEdit}>Edit</button>
            <button style={styles.dangerLink} onClick={() => { if (confirm(`Remove ${member.name}?`)) onDeleteMember(member.id); }}>Remove</button>
          </div>
        )}
      </div>

      {(member.contactNumber || member.address) && (
        <div style={styles.lightCard}>
          <div style={styles.sectionLabel}>Contact Details</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6, fontSize: 14, color: "#2A2620" }}>
            {member.contactNumber && (
              <div>
                <strong>Contact number: </strong>
                <a href={`tel:${member.contactNumber}`} style={{ color: "#1F3864" }}>{member.contactNumber}</a>
              </div>
            )}
            {member.address && (
              <div><strong>Address: </strong>{member.address}</div>
            )}
          </div>
        </div>
      )}

      <div style={styles.lightCard}>
        <div style={styles.sectionLabel}>Overall Attendance</div>
        <ProgressBar pct={overallPct} />
        <div style={styles.pctLabel}>{overallPct}% of all topics attended</div>
      </div>

      <div style={styles.sectionLabel}>Classes</div>
      {classes.length === 0 && <div style={styles.emptyNote}>No classes have been set up yet.</div>}
      {classes.map((c) => {
        const ts = topicsForClass(topics, c.name);
        const pct = classProgressPct(c.name, topics, attendanceByMember, member.id);
        return (
          <div key={c.id} style={styles.lightCard}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, gap: 8, flexWrap: "wrap" }}>
              <div style={{ fontWeight: 700, color: "#23211D" }}>{c.name}</div>
              <div style={styles.classBadge}>{pct}%</div>
            </div>
            <ProgressBar pct={pct} />
            {ts.length === 0 ? (
              <div style={styles.emptyNote}>No topics added for this class yet.</div>
            ) : (
              <div style={{ ...styles.topicList, marginTop: 10 }}>
                {ts.map((t) => {
                  const doneT = !!(att[t.id] && att[t.id].attended);
                  return (
                    <label key={t.id} className="milestone-row" style={styles.topicRow}>
                      <input
                        type="checkbox"
                        checked={doneT}
                        disabled={!isLeader}
                        onChange={(e) => onToggleAttendance(member.id, t.id, e.target.checked)}
                        style={{ width: 18, height: 18 }}
                      />
                      <span style={{ ...styles.topicText, ...(doneT ? styles.topicDone : {}) }}>{t.name}</span>
                      {doneT && isLeader && (
                        <input
                          type="date"
                          value={toDateInputValue(att[t.id].dateAttended)}
                          onClick={(e) => e.preventDefault()}
                          onChange={(e) => { if (e.target.value) onSetAttendanceDate(member.id, t.id, e.target.value); }}
                          style={{ fontSize: 12, border: "1px solid #D8CFB0", borderRadius: 6, padding: "2px 6px", color: "#7A6E4E" }}
                        />
                      )}
                      {doneT && !isLeader && att[t.id].dateAttended && <span style={styles.topicDate}>{fmtDate(att[t.id].dateAttended)}</span>}
                    </label>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}

      {history.length > 0 && (
        <div style={styles.lightCard}>
          <div style={styles.sectionLabel}>Attendance History</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
            {history.map((h) => (
              <div key={h.topic.id} style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 13.5, color: "#2A2620", borderBottom: "1px solid #EFE7D3", paddingBottom: 6 }}>
                <span>{h.topic.class} — {h.topic.name}</span>
                <span style={{ color: "#7A6E4E", flexShrink: 0 }}>{fmtDate(h.dateAttended)}</span>
              </div>
            ))}
          </div>
        </div>
      )}

      {missing.length > 0 && (
        <div style={styles.lightCard}>
          <div style={styles.sectionLabel}>Not Yet Attended</div>
          <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
            {missing.map((t) => (
              <div key={t.id} style={{ fontSize: 13.5, color: "#5C5230" }}>{t.class} — {t.name}</div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function SessionDetail({ topic, members, attendanceByMember, isLeader, onBack, onToggleAttendance, onSetAttendanceDate }) {
  const sortedMembers = useMemo(
    () => [...members].sort((a, b) => (a.name || "").localeCompare(b.name || "")),
    [members]
  );
  const attendedCount = sortedMembers.filter((m) => {
    const a = (attendanceByMember[m.id] || {})[topic.id];
    return a && a.attended;
  }).length;
  const pct = sortedMembers.length ? Math.round((attendedCount / sortedMembers.length) * 100) : 0;

  return (
    <div>
      <a style={styles.backLink} onClick={onBack}>&larr; Back to {topic.class}</a>

          <h2 style={styles.profileName}>{topic.name}</h2>

        <div style={styles.pctLabel}>{attendedCount} of {sortedMembers.length} members attended</div>
      </div>

      <div style={styles.sectionLabel}>Members</div>
      {sortedMembers.length === 0 ? (
        <div style={styles.emptyNote}>No members in the roster yet.</div>
      ) : (
        <div style={{ ...styles.topicList, marginTop: 4 }}>
          {sortedMembers.map((m) => {
            const a = (attendanceByMember[m.id] || {})[topic.id];
            const done = !!(a && a.attended);
            return (
              <label key={m.id} className="milestone-row" style={styles.topicRow}>
                <input
                  type="checkbox"
                  checked={done}
                  disabled={!isLeader}
                  onChange={(e) => onToggleAttendance(m.id, topic.id, e.target.checked)}
                  style={{ width: 18, height: 18 }}
                />
                <span style={{ ...styles.topicText, ...(done ? styles.topicDone : {}) }}>{m.name}</span>
                {done && isLeader && (
                  <input
                    type="date"
                    value={toDateInputValue(a.dateAttended)}
                    onClick={(e) => e.preventDefault()}
                    onChange={(e) => { if (e.target.value) onSetAttendanceDate(m.id, topic.id, e.target.value); }}
                    style={{ fontSize: 12, border: "1px solid #D8CFB0", borderRadius: 6, padding: "2px 6px", color: "#7A6E4E" }}
                  />
                )}
                {done && !isLeader && a.dateAttended && <span style={styles.topicDate}>{fmtDate(a.dateAttended)}</span>}
              </label>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Classes({ classes, topics, members, attendanceByMember, isLeader, onAddClass, onDeleteClass, onAddTopic, onDeleteTopic, onSeedDefaults, onOpenSession }) {
  const [newClass, setNewClass] = useState("");

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      {isLeader && classes.length === 0 && (
        <div style={styles.settingsSection}>
          <div style={styles.sectionLabel}>Disciples Journey</div>
          <div style={styles.pairNote}>Set up the standard track in one click: Spiritual Foundations (1–10 sessions), Making Disciples Class (1–2 sessions), Empowering Leaders Class (1 session).</div>
          <button style={styles.smallBtn} onClick={onSeedDefaults}>Load Disciples Journey Classes</button>
        </div>
      )}

      {isLeader && (
        <div style={styles.settingsSection}>
          <div style={styles.sectionLabel}>Add a Class</div>
          <div style={styles.addRoleRow}>
            <input style={styles.roleEditInput} placeholder="Class name" value={newClass} onChange={(e) => setNewClass(e.target.value)} />
            <button style={styles.smallBtn} onClick={() => { if (newClass.trim()) { onAddClass(newClass.trim(), classes.length + 1); setNewClass(""); } }}>Add</button>
          </div>
        </div>
      )}

      {classes.length === 0 && <div style={styles.emptyNote}>No classes have been set up yet.</div>}

      {classes.map((c) => (
        <ClassCard
          key={c.id}
          classItem={c}
          topics={topics}
          members={members}
          attendanceByMember={attendanceByMember}
          isLeader={isLeader}
          onAddTopic={onAddTopic}
          onDeleteTopic={onDeleteTopic}
          onDeleteClass={onDeleteClass}
          onOpenSession={onOpenSession}
        />
      ))}
    </div>
  );
}

// ============================================================
// SETTINGS — leaders / mentors (leader-only)
// ============================================================

function Settings({ leaders, currentEmail, onAddLeader, onRemoveLeader }) {
  const [newLeaderEmail, setNewLeaderEmail] = useState("");

  return (
    <div style={styles.settingsSection}>
      <div style={styles.sectionLabel}>Leaders (can edit)</div>
      <div style={styles.pairNote}>Anyone whose email is listed here can add classes, topics, members, and mark attendance. Everyone else who signs in gets a read-only view.</div>
      <div style={styles.restrictList}>
        {leaders.map((l) => (
          <div key={l.id} style={styles.restrictRow}>
            <span style={styles.restrictName}>{l.id}{l.id === currentEmail ? " (you)" : ""}</span>
            <button style={styles.iconDanger} onClick={() => onRemoveLeader(l.id)}>×</button>
          </div>
        ))}
      </div>
      <div style={styles.addRoleRow}>
        <input style={styles.roleEditInput} type="email" placeholder="email@example.com" value={newLeaderEmail} onChange={(e) => setNewLeaderEmail(e.target.value)} />
        <button style={styles.smallBtn} onClick={() => { if (newLeaderEmail.trim()) { onAddLeader(newLeaderEmail.trim()); setNewLeaderEmail(""); } }}>Add</button>
      </div>
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================

function App() {
  const [authUser, setAuthUser] = useState(undefined); // undefined = loading, null = signed out
  const [tab, setTab] = useState("roster");
  const [openMember, setOpenMember] = useState(null);
  const [openTopic, setOpenTopic] = useState(null);
  const [addOpen, setAddOpen] = useState(false);
  const [editingMember, setEditingMember] = useState(null);

  useEffect(() => {
    if (!auth) { setAuthUser(null); return; }
    return auth.onAuthStateChanged((u) => setAuthUser(u));
  }, []);

  const currentEmail = normEmail(authUser && authUser.email);

  const [membersRaw] = useCollection("members");
  const [classes] = useCollection("classes", "order");
  const [topics] = useCollection("topics", "order");
  const [attendanceDocs] = useCollection("attendance");
  const [leaders] = useCollection("leaders");

  const isLeader = leaders.some((l) => l.id === currentEmail);

  const members = useMemo(() => membersRaw.map((m) => ({ ...m, name: m.name || "(no name)" })), [membersRaw]);

  const attendanceByMember = useMemo(() => {
    const map = {};
    attendanceDocs.forEach((a) => {
      if (!map[a.memberId]) map[a.memberId] = {};
      map[a.memberId][a.topicId] = a;
    });
    return map;
  }, [attendanceDocs]);

  const liveOpenMember = openMember ? members.find((m) => m.id === openMember.id) || openMember : null;
  const liveOpenTopic = openTopic ? topics.find((t) => t.id === openTopic.id) || openTopic : null;

  const addMember = (data) => {
    db.collection("members").add(data)
      .then(() => setAddOpen(false))
      .catch((err) => alert("Hindi na-save ang member. Error: " + err.message));
  };
  const updateMember = (id, data) => {
    db.collection("members").doc(id).update(data)
      .then(() => setEditingMember(null))
      .catch((err) => alert("Hindi na-save ang pagbabago. Error: " + err.message));
  };
  const deleteMember = (id) => {
    db.collection("members").doc(id).delete()
      .then(() => setOpenMember(null))
      .catch((err) => alert("Hindi na-delete ang member. Error: " + err.message));
  };
  const toggleAttendance = (memberId, topicId, attended) => {
    const docId = `${memberId}_${topicId}`;
    db.collection("attendance").doc(docId).set({ memberId, topicId, attended, dateAttended: attended ? new Date() : null }, { merge: true })
      .catch((err) => alert("Hindi na-save ang attendance. Error: " + err.message));
  };
  const setAttendanceDate = (memberId, topicId, dateStr) => {
    const docId = `${memberId}_${topicId}`;
    const [y, m, d] = dateStr.split("-").map(Number);
    const dateAttended = new Date(y, m - 1, d);
    db.collection("attendance").doc(docId).set({ memberId, topicId, attended: true, dateAttended }, { merge: true })
      .catch((err) => alert("Hindi na-save ang petsa. Error: " + err.message));
  };
  const addClass = (name, order) => {
    db.collection("classes").add({ name, order })
      .catch((err) => alert("Hindi na-save ang class. Error: " + err.message));
  };
  const deleteClass = (id) => {
    db.collection("classes").doc(id).delete()
      .catch((err) => alert("Hindi na-delete ang class. Error: " + err.message));
  };
  const addTopic = (className, name, order) => {
    db.collection("topics").add({ class: className, name, order })
      .catch((err) => alert("Hindi na-save ang topic. Error: " + err.message));
  };
  const deleteTopic = (id) => {
    db.collection("topics").doc(id).delete()
      .catch((err) => alert("Hindi na-delete ang topic. Error: " + err.message));
  };
  const seedDefaultClasses = async () => {
    try {
      for (const c of DEFAULT_CLASSES) {
        await db.collection("classes").add({ name: c.name, order: c.order });
        for (let i = 1; i <= c.sessionCount; i++) {
          await db.collection("topics").add({ class: c.name, name: `Session ${i}`, order: i });
        }
      }
    } catch (err) {
      alert("Hindi na-load ang Disciples Journey classes. Error: " + err.message);
    }
  };
  const addLeader = (email) => {
    db.collection("leaders").doc(normEmail(email)).set({ addedAt: new Date() })
      .catch((err) => alert("Hindi na-add ang leader. Error: " + err.message));
  };
  const removeLeader = (email) => {
    db.collection("leaders").doc(email).delete()
      .catch((err) => alert("Hindi na-remove ang leader. Error: " + err.message));
  };

  if (authUser === undefined) {
    return <div style={styles.loadingScreen}>Loading…</div>;
  }
  if (!authUser) {
    return <AuthScreen />;
  }

  return (
    <div style={styles.appWrap}>
      <div style={styles.watermark} aria-hidden="true">
        <img src={WATERMARK_IMG} alt="" style={styles.watermarkImg} />
      </div>
      <header style={styles.header}>
        <div style={styles.headerTitle}>Disciples Journey</div>
        <div style={styles.headerRight}>
          <span style={styles.headerUser} className="hide-mobile">
            {authUser.displayName || authUser.email} {isLeader ? "· Leader" : "· Viewer"}
          </span>
          <button style={styles.signOutBtn} onClick={() => auth.signOut()}>Sign out</button>
        </div>
      </header>

      <nav style={styles.nav}>
        <button className="nav-item" style={{ ...styles.navItem, ...(tab === "roster" ? styles.navItemActive : {}) }} onClick={() => { setTab("roster"); setOpenMember(null); setOpenTopic(null); }}>Roster</button>
        <button className="nav-item" style={{ ...styles.navItem, ...(tab === "classes" ? styles.navItemActive : {}) }} onClick={() => { setTab("classes"); setOpenMember(null); setOpenTopic(null); }}>Classes</button>
        {isLeader && (
          <button className="nav-item" style={{ ...styles.navItem, ...(tab === "settings" ? styles.navItemActive : {}) }} onClick={() => { setTab("settings"); setOpenMember(null); setOpenTopic(null); }}>Settings</button>
        )}
      </nav>

      <main style={styles.main}>
        {tab === "roster" && !liveOpenMember && (
          <Roster
            members={members}
            classes={classes}
            topics={topics}
            attendanceByMember={attendanceByMember}
            isLeader={isLeader}
            onOpen={setOpenMember}
            onAdd={() => setAddOpen(true)}
          />
        )}

        {tab === "roster" && liveOpenMember && (
          <MemberProfile
            member={liveOpenMember}
            classes={classes}
            topics={topics}
            attendanceByMember={attendanceByMember}
            isLeader={isLeader}
            onBack={() => setOpenMember(null)}
            onToggleAttendance={toggleAttendance}
            onSetAttendanceDate={setAttendanceDate}
            onDeleteMember={deleteMember}
            onEdit={() => setEditingMember(liveOpenMember)}
          />
        )}

        {tab === "classes" && !liveOpenTopic && (
          <Classes
            classes={classes}
            topics={topics}
            members={members}
            attendanceByMember={attendanceByMember}
            isLeader={isLeader}
            onAddClass={addClass}
            onDeleteClass={deleteClass}
            onAddTopic={addTopic}
            onDeleteTopic={deleteTopic}
            onSeedDefaults={seedDefaultClasses}
            onOpenSession={setOpenTopic}
          />
        )}

        {tab === "classes" && liveOpenTopic && (
          <SessionDetail
            topic={liveOpenTopic}
            members={members}
            attendanceByMember={attendanceByMember}
            isLeader={isLeader}
            onBack={() => setOpenTopic(null)}
            onToggleAttendance={toggleAttendance}
            onSetAttendanceDate={setAttendanceDate}
          />
        )}

        {tab === "settings" && isLeader && (
          <Settings
            leaders={leaders}
            currentEmail={currentEmail}
            onAddLeader={addLeader}
            onRemoveLeader={removeLeader}
          />
        )}
      </main>

      {addOpen && <AddMemberModal onClose={() => setAddOpen(false)} onSave={addMember} />}
      {editingMember && (
        <EditMemberModal
          member={editingMember}
          onClose={() => setEditingMember(null)}
          onSave={(data) => updateMember(editingMember.id, data)}
        />
      )}
    </div>
  );
}
