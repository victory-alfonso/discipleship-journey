<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="Register yourself for a Disciples Journey class at Victory Church." />
<meta name="theme-color" content="#23211D" />
<title>Register — Disciples Journey</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #F6F1E4; font-family: system-ui, sans-serif; color: #2A2620; }
  input, button, select, textarea { touch-action: manipulation; font-family: inherit; }
  input:focus, select:focus, textarea:focus { border-color: #1F3864 !important; box-shadow: 0 0 0 3px rgba(31,56,100,0.15) !important; outline: none; }

  .wrap { max-width: 480px; margin: 0 auto; padding: 22px 18px 60px; }
  .header { background: #23211D; color: #EFE7D3; padding: 18px 20px; text-align: center; }
  .headerTitle { font-family: Georgia, serif; font-size: 19px; font-weight: 700; }
  .headerSub { font-size: 12.5px; color: #C9BF9E; margin-top: 2px; }

  .card { background: #FFFFFF; border: 1px solid #E4DCC6; border-radius: 12px; padding: 20px; margin-top: 18px; box-shadow: 0 8px 20px -14px rgba(35,33,29,0.3); }
  .className { font-family: Georgia, serif; font-size: 21px; color: #1F3864; margin: 0 0 4px; }
  .classSub { font-size: 13px; color: #7A6E4E; margin-bottom: 14px; }

  label.field { display: block; margin-bottom: 12px; }
  label.field span { display: block; font-size: 12.5px; font-weight: 700; color: #7A6E4E; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 5px; }
  .input { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid #D8CFB0; font-size: 14.5px; background: #FFFFFF; }

  .row2 { display: flex; gap: 10px; }
  .row2 > label { flex: 1; min-width: 0; }

  .submitBtn { width: 100%; padding: 13px; border-radius: 8px; border: none; background: #1F3864; color: #EFE7D3; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 6px; }
  .submitBtn:disabled { opacity: 0.6; cursor: default; }

  .errorBox { background: #F3E4DF; color: #A6402F; padding: 10px 13px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
  .noteBox { background: #FBF8F0; border: 1px solid #EFE7D3; color: #6B5E3E; padding: 12px 14px; border-radius: 10px; font-size: 12.5px; margin-top: 16px; }

  .loadingScreen, .msgScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center; padding: 20px; color: #7A6E4E; }
  .msgScreen .big { font-family: Georgia, serif; font-size: 22px; color: #23211D; margin-bottom: 8px; }
  .msgScreen .sub { font-size: 14px; color: #5C5230; max-width: 340px; line-height: 1.6; }
  .checkCircle { width: 56px; height: 56px; border-radius: 50%; background: #385026; color: #EFE7D3; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 14px; }

  .againBtn { margin-top: 18px; padding: 10px 18px; border-radius: 8px; border: 1px solid #D8CFB0; background: #FFFFFF; color: #4A4230; cursor: pointer; font-size: 13.5px; font-weight: 600; }
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
<div class="header">
  <div class="headerTitle">Disciples Journey</div>
  <div class="headerSub">Class Registration</div>
</div>
<div class="wrap" id="app">
  <div class="loadingScreen">Loading…</div>
</div>

<script>
// ---- PASTE YOUR FIREBASE CONFIG HERE (same as index.html) ----
const firebaseConfig = {
  apiKey: "AIzaSyD-cz-NFG35omoPBN4cG1gM-w8kLjS8G8s",
  authDomain: "discipleship-journey-cc60b.firebaseapp.com",
  projectId: "discipleship-journey-cc60b",
  storageBucket: "discipleship-journey-cc60b.firebasestorage.app",
  messagingSenderId: "942058852250",
  appId: "1:942058852250:web:7ae5092a3efbe146283423",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

const GENDERS = ["Male", "Female"];
const LIFE_STAGES = ["Single", "Married", "ENC"];

const app = document.getElementById("app");

function qs(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function renderMissingClass() {
  app.innerHTML = `
    <div class="msgScreen">
      <div class="big">Link not set up</div>
      <div class="sub">This registration link is missing a class. Please ask your leader for the correct link, or scan the QR code they shared for your class.</div>
    </div>
  `;
}

function renderError(message) {
  app.innerHTML = `
    <div class="msgScreen">
      <div class="big">Something went wrong</div>
      <div class="sub">${esc(message)}</div>
    </div>
  `;
}

function renderSuccess(className, classId) {
  app.innerHTML = `
    <div class="msgScreen">
      <div class="checkCircle">✓</div>
      <div class="big">You're registered!</div>
      <div class="sub">Thanks for signing up for <strong>${esc(className)}</strong>. Your leader will check you in as sessions happen.</div>
      <button class="againBtn" id="againBtn">Register another person</button>
    </div>
  `;
  document.getElementById("againBtn").onclick = () => renderForm(className, classId);
}

function renderForm(className, classId, errorMessage) {
  app.innerHTML = `
    <div class="card">
      <div class="className">${esc(className)}</div>
      <div class="classSub">Fill in your details to register for this class.</div>
      ${errorMessage ? `<div class="errorBox">${esc(errorMessage)}</div>` : ""}
      <form id="regForm">
        <label class="field">
          <span>Full name *</span>
          <input class="input" name="name" required autofocus />
        </label>
        <div class="row2">
          <label class="field">
            <span>Age (optional)</span>
            <input class="input" name="age" type="number" min="0" />
          </label>
          <label class="field">
            <span>Gender (optional)</span>
            <select class="input" name="gender">
              <option value="">—</option>
              ${GENDERS.map((g) => `<option value="${esc(g)}">${esc(g)}</option>`).join("")}
            </select>
          </label>
        </div>
        <label class="field">
          <span>Life stage (optional)</span>
          <select class="input" name="lifeStage">
            <option value="">—</option>
            ${LIFE_STAGES.map((ls) => `<option value="${esc(ls)}">${esc(ls)}</option>`).join("")}
          </select>
        </label>
        <label class="field">
          <span>Contact number (optional)</span>
          <input class="input" name="contactNumber" type="tel" />
        </label>
        <label class="field">
          <span>Address (optional)</span>
          <input class="input" name="address" />
        </label>
        <label class="field">
          <span>Notes (optional)</span>
          <input class="input" name="notes" />
        </label>
        <button class="submitBtn" type="submit" id="submitBtn">Register</button>
      </form>
      <div class="noteBox">Your details are shared with your class leaders so they can track attendance. If you've registered before, ask a leader to add this class to your existing profile instead so you don't end up with two entries.</div>
    </div>
  `;

  document.getElementById("regForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const submitBtn = document.getElementById("submitBtn");
    const name = form.name.value.trim();
    if (!name) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Registering…";

    const data = {
      name,
      photoUrl: null,
      age: form.age.value.trim() ? Number(form.age.value.trim()) : null,
      gender: form.gender.value || null,
      lifeStage: form.lifeStage.value || null,
      contactNumber: form.contactNumber.value.trim(),
      address: form.address.value.trim(),
      notes: form.notes.value.trim(),
      classIds: [classId],
      dateAdded: new Date(),
      selfRegistered: true,
    };

    try {
      await ensureSignedIn();
      await db.collection("members").add(data);
      renderSuccess(className, classId);
    } catch (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Register";
      renderForm(className, classId, "Couldn't save your registration. " + (err && err.message ? err.message : "Please try again."));
    }
  });
}

function ensureSignedIn() {
  return new Promise((resolve, reject) => {
    if (auth.currentUser) { resolve(auth.currentUser); return; }
    auth.signInAnonymously().then(resolve).catch(() => resolve(null));
  });
}

async function init() {
  const classId = qs("classId");
  if (!classId) { renderMissingClass(); return; }
  try {
    const doc = await db.collection("classes").doc(classId).get();
    if (!doc.exists) { renderMissingClass(); return; }
    const classItem = doc.data();
    renderForm(classItem.name || "Class", classId);
  } catch (err) {
    renderError(err && err.message ? err.message : "Couldn't load this class. Please check your connection and try again.");
  }
}

init();
</script>
</body>
</html>
